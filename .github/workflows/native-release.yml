name: native-release
run-name: native-release ${{ inputs.channel }} ${{ inputs.sha }}

# The packages, the signature and the publication moved into native-ci (ADR 0082 W3): one run tests a
# commit and publishes its beta. This workflow stays so native-promote, which starts it with
# `channel: stable`, keeps working: it starts native-ci for the same commit and channel, and that run
# builds, tests on the three systems and publishes only when they are green.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Private repo commit SHA (40 hex), already green in native-ci"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: read

jobs:
  dispatch:
    name: start native-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start native-ci for the commit and channel
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::Invalid SHA: $SHA"; exit 1; }
          gh workflow run native-ci.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f sha="$SHA" -f channel="$CHANNEL"
          echo "native-ci $CHANNEL started for $SHA"
