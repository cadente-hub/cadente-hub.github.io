name: Build Release (Secure Public Builder)

# SECURITY MODEL:
# This workflow builds binaries from the private repo using public CI minutes.
# It ONLY runs on repository_dispatch (not on PRs, pushes, or forks).
# Secrets are stored in repository secrets.
# The dispatch payload includes an HMAC signature to prevent unauthorized triggers.

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.24) — must match an existing tag in the private repo'
        required: true

# Minimal permissions - only what's needed
permissions:
  contents: read
  actions: read

# Prevent concurrent builds
concurrency:
  group: build-release-${{ github.event.client_payload.version || github.event.inputs.version }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: jeancatarina/catarina-claude
  CARGO_INCREMENTAL: 0

jobs:
  # ─────────────────────────────────────────────────────────────
  # Step 1: Validate the dispatch came from the private repo
  # ─────────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      release_notes: ${{ steps.check.outputs.release_notes }}
    steps:
      - name: Validate and resolve version
        id: check
        env:
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          PAYLOAD_RELEASE_NOTES: ${{ github.event.client_payload.release_notes }}
          PAYLOAD_RELEASE_NOTES_SHA: ${{ github.event.client_payload.release_notes_sha }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_SIGNATURE: ${{ github.event.client_payload.signature }}
          PAYLOAD_TIMESTAMP: ${{ github.event.client_payload.timestamp }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RELEASE_NOTES=""""
          RELEASE_NOTES_SHA=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # ── Manual trigger ──────────────────────────────────────────
            # GitHub auth already guarantees only repo admins can reach here.
            # No HMAC needed — resolve SHA from the private repo tag instead.
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"  # strip leading v if provided

            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version format: $VERSION"
              exit 1
            fi

            echo "::add-mask::${PRIVATE_TOKEN}"
            SHA=$(curl -sf \
              -H "Authorization: Bearer ${PRIVATE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/jeancatarina/catarina-claude/commits/v${VERSION}" \
              | jq -r '.sha // empty')

            if [ -z "$SHA" ]; then
              echo "::error::Tag v${VERSION} not found in private repo. Push the tag first."
              exit 1
            fi
            RELEASE_NOTES="## Cadente v${VERSION}

          Built from commit: ${SHA:0:8}

          Release notes were generated from a manual public builder run."
            echo "✅ Manual trigger: v${VERSION} @ ${SHA:0:8}"
          else
            # ── Automated repository_dispatch ───────────────────────────
            # Validate HMAC signature to prove the call came from the private repo.
            echo "::add-mask::${DISPATCH_SECRET}"

            VERSION="$PAYLOAD_VERSION"
            SHA="$PAYLOAD_SHA"
            SIGNATURE="$PAYLOAD_SIGNATURE"
            TIMESTAMP="$PAYLOAD_TIMESTAMP"
            RELEASE_NOTES="$PAYLOAD_RELEASE_NOTES"
            RELEASE_NOTES_SHA="$PAYLOAD_RELEASE_NOTES_SHA"

            if [ -z "$VERSION" ] || [ -z "$SHA" ] || [ -z "$SIGNATURE" ] || [ -z "$TIMESTAMP" ]; then
              echo "::error::Missing required payload fields. Rejecting dispatch."
              exit 1
            fi

            # Payload fields are untrusted until the HMAC below passes: they arrive
            # through env, never through expression interpolation, and must be well-formed.
            if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::Invalid dispatch sha."
              exit 1
            fi
            if ! printf '%s' "$TIMESTAMP" | grep -qE '^[0-9]{1,12}$'; then
              echo "::error::Invalid dispatch timestamp."
              exit 1
            fi
            if ! printf '%s' "$SIGNATURE" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error::Invalid dispatch signature format."
              exit 1
            fi
            if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Invalid dispatch version."
              exit 1
            fi

            if [ -n "$RELEASE_NOTES" ]; then
              if [ -z "$RELEASE_NOTES_SHA" ]; then
                echo "::error::Missing release_notes_sha for signed release notes."
                exit 1
              fi
              ACTUAL_RELEASE_NOTES_SHA=$(printf '%s\n' "$RELEASE_NOTES" | shasum -a 256 | awk '{print $1}')
              if [ "$ACTUAL_RELEASE_NOTES_SHA" != "$RELEASE_NOTES_SHA" ]; then
                echo "::error::release_notes_sha mismatch."
                exit 1
              fi
              EXPECTED_SIG=$(echo -n "${VERSION}:${SHA}:${TIMESTAMP}:${RELEASE_NOTES_SHA}" | openssl dgst -sha256 -hmac "$DISPATCH_SECRET" | awk '{print $2}')
            else
              EXPECTED_SIG=$(echo -n "${VERSION}:${SHA}:${TIMESTAMP}" | openssl dgst -sha256 -hmac "$DISPATCH_SECRET" | awk '{print $2}')
              RELEASE_NOTES="## Cadente v${VERSION}

          Built from commit: ${SHA:0:8}

          Release notes were not included in the dispatch payload."
            fi
            if [ "$SIGNATURE" != "$EXPECTED_SIG" ]; then
              echo "::error::Invalid signature. This dispatch did not come from an authorized source."
              exit 1
            fi

            NOW=$(date +%s)
            DIFF=$((NOW - TIMESTAMP))
            if [ "$DIFF" -gt 900 ] || [ "$DIFF" -lt -60 ]; then
              echo "::error::Timestamp out of range (${DIFF}s). Possible replay attack."
              exit 1
            fi

            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version format: $VERSION"
              exit 1
            fi
            echo "✅ Dispatch validated: v${VERSION} @ ${SHA:0:8}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          {
            echo "release_notes<<CADENTE_RELEASE_NOTES"
            printf '%s\n' "$RELEASE_NOTES"
            echo "CADENTE_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

  # Run the repository guardrails once on Ubuntu, outside platform build jobs.
  # Platform builds skip npm lifecycle scripts, so prebuild must remain only
  # the guardrail command; this check fails if it later grows code generation.
  guardrails:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone private repo at exact SHA
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          git clone --depth=1 "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" source >/dev/null 2>&1
          cd source
          git fetch --depth=1 origin "${{ needs.validate.outputs.sha }}" >/dev/null 2>&1
          git checkout "${{ needs.validate.outputs.sha }}" >/dev/null 2>&1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Verify prebuild remains guardrails-only
        working-directory: source
        run: |
          node - <<'NODE'
          const { scripts } = require('./package.json');
          if (scripts?.prebuild !== 'npm run guardrails:quick') {
            console.error(`Unexpected prebuild script: ${scripts?.prebuild ?? '(missing)'}`);
            process.exit(1);
          }
          NODE

      - name: Install frontend dependencies
        working-directory: source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tail -5

      - name: Run guardrails
        working-directory: source
        run: npm run guardrails:quick

      - name: Cleanup source
        if: always()
        run: rm -rf source

  # ─────────────────────────────────────────────────────────────
  # Step 2: Build on each platform
  # ─────────────────────────────────────────────────────────────
  build-macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone private repo at exact SHA
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          echo "::add-mask::$(pwd)/source"
          git clone --depth=1 \
            "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" source >/dev/null 2>&1
          cd source
          EXPECTED_SHA="${{ needs.validate.outputs.sha }}"
          git fetch --depth=1 origin "$EXPECTED_SHA" 2>/dev/null
          git checkout "$EXPECTED_SHA" 2>/dev/null
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA mismatch! Expected ${EXPECTED_SHA:0:8}, got ${ACTUAL_SHA:0:8}. Aborting."
            exit 1
          fi
          echo "✅ Checked out: ${ACTUAL_SHA:0:8}"
          git remote set-url origin "https://REDACTED@github.com/redacted/redacted.git"
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          unset PRIVATE_TOKEN

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri
          shared-key: cadente-${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tail -5

      - name: Build Tauri app (${{ matrix.target }})
        working-directory: source
        env:
          npm_config_ignore_scripts: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_WRITE_TOKEN || secrets.CATARINA_PRIVATE_LOG_TOKEN || secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/persist-private-log.sh"
          LOG_FILE="/tmp/build-${{ matrix.arch }}.log"
          if npx tauri build --target "${{ matrix.target }}" -- --locked > "$LOG_FILE" 2>&1; then
            echo "${{ matrix.target }} build succeeded ($(wc -l < "$LOG_FILE") log lines suppressed)"
          else
            EXIT_CODE=$?
            if [ -n "${PRIVATE_LOG_TOKEN:-}" ]; then
              persist_private_build_log "$LOG_FILE" "macos-${{ matrix.arch }}"
            else
              echo "::error::${{ matrix.target }} build failed; private diagnostic token is not configured."
            fi
            rm -f "$LOG_FILE"
            exit "$EXIT_CODE"
          fi
          rm -f "$LOG_FILE"

      - name: Build and integrate Cadente Launcher (Fat Bundle)
        working-directory: source
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_WRITE_TOKEN || secrets.CATARINA_PRIVATE_LOG_TOKEN || secrets.CATARINA_PRIVATE_READ_TOKEN }}
          CI: "true"
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/persist-private-log.sh"
          LOG_FILE="/tmp/launcher-${{ matrix.arch }}.log"
          if cargo build --release --target "${{ matrix.target }}" --manifest-path crates/cadente-launcher/Cargo.toml > "$LOG_FILE" 2>&1; then
            echo "Launcher build succeeded ($(wc -l < "$LOG_FILE") log lines suppressed)"
          else
            EXIT_CODE=$?
            if [ -n "${PRIVATE_LOG_TOKEN:-}" ]; then
              persist_private_build_log "$LOG_FILE" "macos-launcher-${{ matrix.arch }}"
            else
              echo "::error::Launcher build failed; private diagnostic token is not configured."
            fi
            rm -f "$LOG_FILE"
            exit "$EXIT_CODE"
          fi
          rm -f "$LOG_FILE"

          BUNDLE_APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Cadente.app"
          LAUNCHER_BIN="crates/cadente-launcher/target/${{ matrix.target }}/release/cadente"
          CORE_BIN="$BUNDLE_APP/Contents/MacOS/cadente"
          if [ ! -d "$BUNDLE_APP" ]; then
            echo "::error::Tauri app bundle is missing: $BUNDLE_APP"
            exit 1
          fi
          if [ ! -f "$LAUNCHER_BIN" ]; then
            echo "::error::Launcher binary is missing: $LAUNCHER_BIN"
            exit 1
          fi
          if [ ! -f "$CORE_BIN" ]; then
            echo "::error::Cadente core binary is missing: $CORE_BIN"
            exit 1
          fi

          mv "$CORE_BIN" "$BUNDLE_APP/Contents/MacOS/cadente-core"
          cp "$LAUNCHER_BIN" "$CORE_BIN"
          chmod +x "$CORE_BIN" "$BUNDLE_APP/Contents/MacOS/cadente-core"
          mkdir -p "$BUNDLE_APP/Contents/SharedSupport/baseline_version"
          echo "{\"version\": \"${{ needs.validate.outputs.version }}\", \"channel\": \"stable\"}" > "$BUNDLE_APP/Contents/SharedSupport/baseline_version/metadata.json"
          python3 "$GITHUB_WORKSPACE/.github/scripts/stamp-launcher-identity.py" \
            --source . --app "$BUNDLE_APP" --bin "$LAUNCHER_BIN" \
            --build "${{ needs.validate.outputs.version }}"
          codesign --force --deep --sign - "$BUNDLE_APP"

          TAR_GZ="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Cadente.app.tar.gz"
          rm -f "$TAR_GZ" "$TAR_GZ.sig"
          tar -czf "$TAR_GZ" -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" Cadente.app
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri signer sign --password "" "$TAR_GZ"
          fi

          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          if [ ! -d "$DMG_DIR" ]; then
            echo "::error::Tauri DMG directory is missing: $DMG_DIR"
            exit 1
          fi
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "Cadente" -srcfolder "$BUNDLE_APP" -ov -format UDZO "$DMG_DIR/Cadente_${{ needs.validate.outputs.version }}_${{ matrix.arch }}.dmg"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p artifacts
          BUNDLE="source/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE/dmg" -name "*.dmg" -exec cp {} "artifacts/cadente-${VERSION}-macos-${{ matrix.arch }}.dmg" \;
          find "$BUNDLE/macos" -name "*.app.tar.gz" -exec cp {} "artifacts/cadente-${VERSION}-macos-${{ matrix.arch }}.app.tar.gz" \;
          find "$BUNDLE/macos" -name "*.app.tar.gz.sig" -exec cp {} "artifacts/cadente-${VERSION}-macos-${{ matrix.arch }}.app.tar.gz.sig" \;
          echo "📦 Artifacts collected:"
          ls -la artifacts/

      - name: Smoke test native macOS app boot
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          ARCHIVE="artifacts/cadente-${VERSION}-macos-arm64.app.tar.gz"
          rm -rf /tmp/cadente-boot-smoke
          mkdir -p /tmp/cadente-boot-smoke
          tar -xzf "$ARCHIVE" -C /tmp/cadente-boot-smoke
          python3 source/scripts/packaged-boot-smoke.py \
            --macos-app /tmp/cadente-boot-smoke/Cadente.app \
            --timeout-secs 30

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Scrub credentials and non-cacheable outputs
        if: always()
        shell: bash
        run: |
          rm -rf source/.git
          rm -rf source/dist
          rm -rf source/src-tauri/target/*/release/bundle source/src-tauri/target/release/bundle
          rm -f /tmp/build-*.log /tmp/launcher-*.log

  smoke-macos-intel:
    needs: [validate, build-macos]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: artifacts-macos-x64
          path: artifacts

      - name: Smoke test Intel macOS app boot
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          ARCHIVE="artifacts/cadente-${VERSION}-macos-x64.app.tar.gz"
          rm -rf /tmp/cadente-boot-smoke
          mkdir -p /tmp/cadente-boot-smoke
          tar -xzf "$ARCHIVE" -C /tmp/cadente-boot-smoke
          python3 scripts/packaged-boot-smoke.py \
            --macos-app /tmp/cadente-boot-smoke/Cadente.app \
            --timeout-secs 30

  build-linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Clone private repo at specific SHA
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          echo "::add-mask::$(pwd)/source"

          git clone --depth=1 \
            "https://x-access-token:${PRIVATE_TOKEN}@github.com/jeancatarina/catarina-claude.git" \
            source 2>&1 | head -1 || true

          cd source
          EXPECTED_SHA="${{ needs.validate.outputs.sha }}"
          git fetch --depth=1 origin "$EXPECTED_SHA" 2>/dev/null
          git checkout "$EXPECTED_SHA" 2>/dev/null

          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA mismatch! Expected ${EXPECTED_SHA:0:8}, got ${ACTUAL_SHA:0:8}. Aborting."
            exit 1
          fi
          echo "✅ Checked out: ${ACTUAL_SHA:0:8}"

          git remote set-url origin "https://REDACTED@github.com/redacted/redacted.git"
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          unset PRIVATE_TOKEN

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/src-tauri
            source/crates/cadente-launcher
          shared-key: cadente
          cache-on-failure: true

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: linux-apt-webkit2gtk-v1

      - name: Install Linux dependencies
        run: |
          if [ -d ~/apt-cache ] && [ "$(ls -A ~/apt-cache 2>/dev/null)" ]; then
            echo "📦 Restoring cached .deb packages..."
            sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld rpm pkg-config clang libssl-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Install frontend dependencies
        working-directory: source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tail -5

      - name: Build Tauri app
        working-directory: source
        env:
          npm_config_ignore_scripts: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          BUILD_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_CHANNEL: stable
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_WRITE_TOKEN || secrets.CATARINA_PRIVATE_LOG_TOKEN || secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          persist_private_build_log() {
            local log_file="$1" label="$2" repo_dir safe_workflow safe_job dest_dir dest_rel
            safe_workflow="$(printf '%s' "${GITHUB_WORKFLOW:-workflow}" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_job="$(printf '%s' "${GITHUB_JOB:-job}" | tr -cs 'A-Za-z0-9._-' '-')"
            dest_rel=".cadente-build-logs/public-actions/${safe_workflow}/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}/${safe_job}-${label}.log"
            if [ -z "${PRIVATE_LOG_TOKEN:-}" ]; then
              echo "::error::Build failed; private log token is not configured."
              return
            fi
            echo "::add-mask::${PRIVATE_LOG_TOKEN}"
            repo_dir="$(mktemp -d)"
            if git clone --depth=1 "https://x-access-token:${PRIVATE_LOG_TOKEN}@github.com/${PRIVATE_REPO}.git" "$repo_dir" >/dev/null 2>&1; then
              dest_dir="$repo_dir/$(dirname "$dest_rel")"
              mkdir -p "$dest_dir"
              cp "$log_file" "$repo_dir/$dest_rel"
              git -C "$repo_dir" config user.name "github-actions[bot]"
              git -C "$repo_dir" config user.email "github-actions[bot]@users.noreply.github.com"
              git -C "$repo_dir" add -f "$dest_rel"
              git -C "$repo_dir" commit -m "ci: store private build log for ${GITHUB_RUN_ID:-local} ${safe_job}" >/dev/null 2>&1 || true
              if git -C "$repo_dir" push >/dev/null 2>&1; then
                echo "::error::Build failed. Full log committed privately at ${dest_rel}."
              else
                echo "::error::Build failed. Could not push private build log."
              fi
            else
              echo "::error::Build failed. Could not clone private log repository."
            fi
            rm -rf "$repo_dir"
          }
          echo "Building linux x86_64..."
          # The launcher and the app are packaged together (one layout on every platform);
          # nothing here prints source text: all output goes to the private log.
          build_linux() {
            # `set -e` does not apply inside an `if` condition: fail explicitly.
            cargo build --release --manifest-path crates/cadente-launcher/Cargo.toml --bin cadente || return 1
            digest="$(python3 "$GITHUB_WORKSPACE/.github/scripts/stamp-launcher-identity.py" --source . --build "$BUILD_VERSION" --print --bin crates/cadente-launcher/target/release/cadente)" || return 1
            bash scripts/packaging/bundle-with-launcher.sh --launcher crates/cadente-launcher/target/release/cadente \
              --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --digest "$digest" --formats deb,rpm,appimage || return 1
          }
          if build_linux > /tmp/build-linux.log 2>&1; then
            echo "Linux build succeeded ($(wc -l < /tmp/build-linux.log) log lines suppressed)"
          else
            EXIT_CODE=$?
            persist_private_build_log /tmp/build-linux.log linux-x64
            rm -f /tmp/build-linux.log
            exit $EXIT_CODE
          fi
          rm -f /tmp/build-linux.log

      - name: Verify the Linux packages install and run before they are published
        working-directory: source
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          bash scripts/packaging/verify-built-package.sh deb "$(ls "$bundle"/deb/*.deb)" "$BUILD_VERSION"
          bash scripts/packaging/verify-built-package.sh rpm "$(ls "$bundle"/rpm/*.rpm)" "$BUILD_VERSION"
          bash scripts/packaging/verify-built-package.sh appimage "$(ls "$bundle"/appimage/*.AppImage)" "$BUILD_VERSION"
        env:
          BUILD_VERSION: ${{ needs.validate.outputs.version }}

      - name: Collect artifacts
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p artifacts
          BUNDLE_DIR="source/src-tauri/target/release/bundle"

          find "$BUNDLE_DIR/appimage" -name "*.AppImage" -exec cp {} "artifacts/cadente-${VERSION}-linux-x64.AppImage" \; 2>/dev/null || true
          find "$BUNDLE_DIR/deb" -name "*.deb" -exec cp {} "artifacts/cadente-${VERSION}-linux-x64.deb" \; 2>/dev/null || true
          find "$BUNDLE_DIR/rpm" -name "*.rpm" -exec cp {} "artifacts/cadente-${VERSION}-linux-x64.rpm" \; 2>/dev/null || true
          find "$BUNDLE_DIR/appimage" -name "*.AppImage.tar.gz" -exec cp {} "artifacts/cadente-${VERSION}-linux-x64.AppImage.tar.gz" \; 2>/dev/null || true
          find "$BUNDLE_DIR/appimage" -name "*.AppImage.tar.gz.sig" -exec cp {} "artifacts/cadente-${VERSION}-linux-x64.AppImage.tar.gz.sig" \; 2>/dev/null || true

          echo "📦 Artifacts collected:"
          ls -la artifacts/

      - name: Scrub credentials and non-cacheable outputs
        if: always()
        run: |
          rm -rf source/.git
          rm -rf source/dist
          rm -rf source/src-tauri/target/release/bundle
          rm -f /tmp/build-linux.log

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Clone private repo at specific SHA
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          echo "::add-mask::$(pwd)/source"

          git clone --depth=1 \
            "https://x-access-token:${PRIVATE_TOKEN}@github.com/jeancatarina/catarina-claude.git" \
            source 2>&1 | head -1 || true

          cd source
          EXPECTED_SHA="${{ needs.validate.outputs.sha }}"
          git fetch --depth=1 origin "$EXPECTED_SHA" 2>/dev/null
          git checkout "$EXPECTED_SHA" 2>/dev/null

          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA mismatch! Expected ${EXPECTED_SHA:0:8}, got ${ACTUAL_SHA:0:8}. Aborting."
            exit 1
          fi
          echo "✅ Checked out: ${ACTUAL_SHA:0:8}"

          git remote set-url origin "https://REDACTED@github.com/redacted/redacted.git"
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          unset PRIVATE_TOKEN

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Patch Windows crate type for Tauri build
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path('src-tauri/Cargo.toml')
          text = path.read_text()
          original = 'crate-type = ["staticlib", "cdylib", "rlib"]'
          if text.count(original) != 1:
              raise SystemExit('Expected exactly one Tauri crate-type declaration')
          path.write_text(text.replace(original, 'crate-type = ["rlib"]'))
          PYEOF

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/src-tauri
            source/crates/cadente-launcher
          shared-key: cadente
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tail -5

      - name: Build Tauri app
        working-directory: source
        shell: bash
        env:
          npm_config_ignore_scripts: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          BUILD_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_CHANNEL: stable
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_WRITE_TOKEN || secrets.CATARINA_PRIVATE_LOG_TOKEN || secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          persist_private_build_log() {
            local log_file="$1" label="$2" repo_dir safe_workflow safe_job dest_dir dest_rel
            safe_workflow="$(printf '%s' "${GITHUB_WORKFLOW:-workflow}" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_job="$(printf '%s' "${GITHUB_JOB:-job}" | tr -cs 'A-Za-z0-9._-' '-')"
            dest_rel=".cadente-build-logs/public-actions/${safe_workflow}/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}/${safe_job}-${label}.log"
            if [ -z "${PRIVATE_LOG_TOKEN:-}" ]; then
              echo "::error::Build failed; private log token is not configured."
              return
            fi
            echo "::add-mask::${PRIVATE_LOG_TOKEN}"
            repo_dir="$(mktemp -d)"
            if git clone --depth=1 "https://x-access-token:${PRIVATE_LOG_TOKEN}@github.com/${PRIVATE_REPO}.git" "$repo_dir" >/dev/null 2>&1; then
              dest_dir="$repo_dir/$(dirname "$dest_rel")"
              mkdir -p "$dest_dir"
              cp "$log_file" "$repo_dir/$dest_rel"
              git -C "$repo_dir" config user.name "github-actions[bot]"
              git -C "$repo_dir" config user.email "github-actions[bot]@users.noreply.github.com"
              git -C "$repo_dir" add -f "$dest_rel"
              git -C "$repo_dir" commit -m "ci: store private build log for ${GITHUB_RUN_ID:-local} ${safe_job}" >/dev/null 2>&1 || true
              if git -C "$repo_dir" push >/dev/null 2>&1; then
                echo "::error::Build failed. Full log committed privately at ${dest_rel}."
              else
                echo "::error::Build failed. Could not push private build log."
              fi
            else
              echo "::error::Build failed. Could not clone private log repository."
            fi
            rm -rf "$repo_dir"
          }
          echo "Building windows x86_64..."
          # The launcher and the app are packaged together (one layout on every platform);
          # nothing here prints source text: all output goes to the private log.
          build_windows() {
            # `set -e` does not apply inside an `if` condition: fail explicitly.
            cargo build --release --manifest-path crates/cadente-launcher/Cargo.toml --bin cadente || return 1
            digest="$(python3 "$GITHUB_WORKSPACE/.github/scripts/stamp-launcher-identity.py" --source . --build "$BUILD_VERSION" --print --bin crates/cadente-launcher/target/release/cadente.exe)" || return 1
            bash scripts/packaging/bundle-with-launcher.sh --launcher crates/cadente-launcher/target/release/cadente.exe \
              --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --digest "$digest" --formats nsis,msi || return 1
          }
          if build_windows > /tmp/build-windows.log 2>&1; then
            echo "Windows build succeeded ($(wc -l < /tmp/build-windows.log) log lines suppressed)"
          else
            EXIT_CODE=$?
            persist_private_build_log /tmp/build-windows.log windows-x64
            rm -f /tmp/build-windows.log
            exit $EXIT_CODE
          fi
          rm -f /tmp/build-windows.log

      - name: Verify the Windows installers install and run before they are published
        working-directory: source
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'src-tauri/target/release/bundle'
          $nsis = (Get-ChildItem "$bundle/nsis" -Filter *.exe | Select-Object -First 1).FullName
          $msi = (Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1).FullName
          ./scripts/packaging/verify-built-package.ps1 -Kind nsis -File $nsis -Version $env:BUILD_VERSION
          ./scripts/packaging/verify-built-package.ps1 -Kind msi -File $msi -Version $env:BUILD_VERSION

      # What a launcher installs as a version: the installed tree, with the launcher
      # beside the Core, zipped and signed. The installer archive is not a Core.
      - name: Create and sign the portable package
        working-directory: source
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          npm_config_ignore_scripts: "true"
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe | Select-Object -First 1).FullName
          $tree = Join-Path $env:RUNNER_TEMP 'cadente-portable'
          Remove-Item $tree -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$tree" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }
          foreach ($need in 'cadente.exe', 'cadente-core.exe', 'baseline_version\metadata.json', 'launcher.json') {
            if (-not (Test-Path (Join-Path $tree $need))) { throw "the portable tree lacks $need" }
          }
          New-Item -ItemType Directory -Force -Path '../artifacts' | Out-Null
          $zip = (Resolve-Path '../artifacts').Path + "\cadente-$($env:VERSION)-windows-x64.portable.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Get-ChildItem $tree -Exclude 'uninstall*.exe' | Compress-Archive -DestinationPath $zip
          Get-ChildItem $tree -Filter 'uninstall*.exe' | ForEach-Object { Start-Process $_.FullName -ArgumentList '/S' -Wait | Out-Null }
          Write-Output "portable package zipped: $(Split-Path $zip -Leaf)"

      # Signed from bash: PowerShell drops the empty `--password ""` argument.
      - name: Sign the portable package
        working-directory: source
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          npm_config_ignore_scripts: "true"
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          zip="../artifacts/cadente-${VERSION}-windows-x64.portable.zip"
          npx tauri signer sign --password "" "$zip"
          test -s "$zip.sig"
          echo "portable package signed: $(basename "$zip")"

      - name: Collect artifacts
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p artifacts
          BUNDLE_DIR="source/src-tauri/target/release/bundle"

          find "$BUNDLE_DIR/msi" -name "*.msi" -exec cp {} "artifacts/cadente-${VERSION}-windows-x64.msi" \; 2>/dev/null || true
          find "$BUNDLE_DIR/nsis" -name "*.exe" -exec cp {} "artifacts/cadente-${VERSION}-windows-x64.exe" \; 2>/dev/null || true
          find "$BUNDLE_DIR/msi" -name "*.msi.zip" -exec cp {} "artifacts/cadente-${VERSION}-windows-x64.msi.zip" \; 2>/dev/null || true
          find "$BUNDLE_DIR/msi" -name "*.msi.zip.sig" -exec cp {} "artifacts/cadente-${VERSION}-windows-x64.msi.zip.sig" \; 2>/dev/null || true
          find "$BUNDLE_DIR/nsis" -name "*.nsis.zip" -exec cp {} "artifacts/cadente-${VERSION}-windows-x64.nsis.zip" \; 2>/dev/null || true
          find "$BUNDLE_DIR/nsis" -name "*.nsis.zip.sig" -exec cp {} "artifacts/cadente-${VERSION}-windows-x64.nsis.zip.sig" \; 2>/dev/null || true

          echo "📦 Artifacts collected:"
          ls -la artifacts/

      - name: Scrub credentials and non-cacheable outputs
        if: always()
        shell: bash
        run: |
          rm -rf source/.git
          rm -rf source/dist
          rm -rf source/src-tauri/target/release/bundle
          rm -f /tmp/build-windows.log

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: artifacts/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Step 3: Create release with all artifacts
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [validate, guardrails, build-macos, smoke-macos-intel, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List all artifacts
        run: ls -la all-artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd all-artifacts
          sha256sum * > ../SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > ../SHA256SUMS.txt
          echo "📋 Checksums:"
          cat ../SHA256SUMS.txt
          cp ../SHA256SUMS.txt ./SHA256SUMS.txt

      - name: Generate update.json
        shell: bash
        env:
          RELEASE_NOTES: ${{ needs.validate.outputs.release_notes }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/cadente-hub/cadente-hub.github.io/releases/download/${TAG}"

          # Read signature from .sig file — FAIL if missing
          read_sig() {
            local file="all-artifacts/$1"
            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "::error::Missing signature file: $1"
              echo ""
            fi
          }

          DARWIN_AARCH64_SIG=$(read_sig "cadente-${VERSION}-macos-arm64.app.tar.gz.sig")
          DARWIN_X86_64_SIG=$(read_sig "cadente-${VERSION}-macos-x64.app.tar.gz.sig")
          LINUX_X86_64_SIG=$(read_sig "cadente-${VERSION}-linux-x64.AppImage.tar.gz.sig")

          # Windows: try NSIS first (default Tauri target), then MSI
          WINDOWS_SIG=$(read_sig "cadente-${VERSION}-windows-x64.nsis.zip.sig")
          WIN_UPDATER_FILE="cadente-${VERSION}-windows-x64.nsis.zip"
          if [ -z "$WINDOWS_SIG" ]; then
            WINDOWS_SIG=$(read_sig "cadente-${VERSION}-windows-x64.msi.zip.sig")
            WIN_UPDATER_FILE="cadente-${VERSION}-windows-x64.msi.zip"
          fi

          # Validate ALL signatures exist — never publish without them
          MISSING=0
          for SIG_NAME in "darwin-aarch64:$DARWIN_AARCH64_SIG" "darwin-x86_64:$DARWIN_X86_64_SIG" "linux-x86_64:$LINUX_X86_64_SIG" "windows-x86_64:$WINDOWS_SIG"; do
            PLATFORM="${SIG_NAME%%:*}"
            SIG_VALUE="${SIG_NAME#*:}"
            if [ -z "$SIG_VALUE" ]; then
              echo "::error::Empty signature for ${PLATFORM}. Updater will reject this update."
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} platform(s) missing signatures. Aborting update.json generation."
            exit 1
          fi

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Cadente v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${DARWIN_AARCH64_SIG}",
                "url": "${BASE_URL}/cadente-${VERSION}-macos-arm64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${DARWIN_X86_64_SIG}",
                "url": "${BASE_URL}/cadente-${VERSION}-macos-x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${LINUX_X86_64_SIG}",
                "url": "${BASE_URL}/cadente-${VERSION}-linux-x64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "${BASE_URL}/${WIN_UPDATER_FILE}"
              }
            }
          }
          EOF

          # Validate JSON is parseable
          python3 -c "import json; json.load(open('update.json'))" || { echo "::error::Generated invalid JSON"; exit 1; }
          python3 - <<'PYEOF'
          import json
          import os

          with open("update.json") as fh:
              data = json.load(fh)
          data["notes"] = os.environ["RELEASE_NOTES"]
          with open("update.json", "w") as fh:
              json.dump(data, fh, indent=2)
              fh.write("\n")
          PYEOF
          echo "✅ update.json generated with all signatures:"
          python3 -c "import json; d=json.load(open('update.json')); [print(f'  {k}: sig={v[\"signature\"][:20]}...') for k,v in d['platforms'].items()]"

      - name: Add the Windows portable package to the manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "update.json" "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.tag }}" <<'PYEOF'
          import json, sys, pathlib
          manifest, version, tag = sys.argv[1:4]
          sig = pathlib.Path(f"all-artifacts/cadente-{version}-windows-x64.portable.zip.sig")
          if not sig.exists() or not sig.read_text().strip():
              sys.exit("::error::the Windows portable package is missing or unsigned")
          data = json.load(open(manifest))
          data["platforms"]["windows-x86_64-portable"] = {
              "signature": sig.read_text().strip(),
              "url": f"https://github.com/cadente-hub/cadente-hub.github.io/releases/download/{tag}/cadente-{version}-windows-x64.portable.zip",
          }
          with open(manifest, "w") as fh:
              json.dump(data, fh, indent=2)
              fh.write("\n")
          PYEOF
          python3 -c "import json; d=json.load(open('update.json')); print(sorted(d['platforms']))"

      - name: Generate launcher-identity.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          if tar -xzOf "all-artifacts/cadente-${VERSION}-macos-arm64.app.tar.gz" Cadente.app/Contents/SharedSupport/launcher.json > /tmp/launcher.json 2>/dev/null; then
            jq --arg build "$VERSION" '{build:$build,digest:.digest}' /tmp/launcher.json > launcher-identity.json
          else
            echo "::warning::Bundle carries no launcher identity; launcher-identity.json not updated"
          fi

      - name: Validate generated stable release
        run: |
          python3 scripts/release-asset-guard.py \
            --manifest update.json \
            --artifacts-dir all-artifacts \
            --macos-arm64-archive "all-artifacts/cadente-${{ needs.validate.outputs.version }}-macos-arm64.app.tar.gz" \
            --macos-x64-archive "all-artifacts/cadente-${{ needs.validate.outputs.version }}-macos-x64.app.tar.gz"

      - name: Create release on cadente-hub.github.io
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
          RELEASE_NOTES: ${{ needs.validate.outputs.release_notes }}
        run: |
          echo "::add-mask::${GH_TOKEN}"
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          SHA="${{ needs.validate.outputs.sha }}"

          # Delete existing release if re-running
          gh release delete "$TAG" --repo cadente-hub/cadente-hub.github.io --yes 2>/dev/null || true

          {
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "### Downloads"
            echo "- **macOS Apple Silicon**: \`cadente-${VERSION}-macos-arm64.dmg\`"
            echo "- **macOS Intel**: \`cadente-${VERSION}-macos-x64.dmg\`"
            echo "- **Linux**: \`cadente-${VERSION}-linux-x64.AppImage\` or \`.deb\`"
            echo "- **Windows**: \`cadente-${VERSION}-windows-x64.exe\` or \`.msi\`"
            echo ""
            echo "---"
            echo "*Built via Secure Public Builder*"
          } > release-notes.md

          gh release create "$TAG" \
            --repo cadente-hub/cadente-hub.github.io \
            --title "Cadente v${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            all-artifacts/*

      - name: Update update.json in site repo
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
        run: |
          echo "::add-mask::${GH_TOKEN}"
          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/cadente-hub/cadente-hub.github.io.git site-repo
          cd site-repo
          cp ../update.json ./update.json
          if [ -f ../launcher-identity.json ]; then cp ../launcher-identity.json ./launcher-identity.json; fi
          if [ -d "dist" ]; then cp ../update.json ./dist/update.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          [ -f launcher-identity.json ] && git add launcher-identity.json
          git commit -m "chore: update update.json for v${{ needs.validate.outputs.version }}" || echo "No changes"
          git push

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
        run: |
          echo "::add-mask::${GH_TOKEN}"
          VERSION="${{ needs.validate.outputs.version }}"

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CATARINA_RELEASE_TOKEN not set, skipping Homebrew update"
            exit 0
          fi

          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/cadente-hub/homebrew-apps.git homebrew-repo
          cd homebrew-repo

          ARM64_DMG="../all-artifacts/cadente-${VERSION}-macos-arm64.dmg"
          X64_DMG="../all-artifacts/cadente-${VERSION}-macos-x64.dmg"

          if [ ! -f "$ARM64_DMG" ] || [ ! -f "$X64_DMG" ]; then
            echo "::error::Missing DMG artifacts — cannot generate cask without SHA256s"
            exit 1
          fi
          ARM64_SHA=$(shasum -a 256 "$ARM64_DMG" | awk '{print $1}')
          X64_SHA=$(shasum -a 256 "$X64_DMG" | awk '{print $1}')

          {
            echo 'cask "cadente" do'
            echo "  version \"${VERSION}\""
            echo ''
            echo '  if Hardware::CPU.arm?'
            echo '    url "https://github.com/cadente-hub/cadente-hub.github.io/releases/download/v#{version}/cadente-#{version}-macos-arm64.dmg"'
            echo "    sha256 \"${ARM64_SHA}\""
            echo '  else'
            echo '    url "https://github.com/cadente-hub/cadente-hub.github.io/releases/download/v#{version}/cadente-#{version}-macos-x64.dmg"'
            echo "    sha256 \"${X64_SHA}\""
            echo '  end'
            echo ''
            echo '  name "Cadente"'
            echo '  desc "AI-powered desktop assistant — chat, terminal, Git, API testing, and more"'
            echo '  homepage "https://cadente-hub.github.io"'
            echo ''
            echo '  livecheck do'
            echo '    url "https://github.com/cadente-hub/cadente-hub.github.io/releases/latest"'
            echo '    strategy :github_latest'
            echo '  end'
            echo ''
            echo '  auto_updates true'
            echo '  depends_on macos: ">= :catalina"'
            echo ''
            echo '  app "Cadente.app"'
            echo ''
            echo '  # Strip macOS quarantine + re-sign ad-hoc locally so the app opens without'
            echo '  # "is damaged" Gatekeeper error. Required for unsigned apps — robust on both'
            echo '  # Intel and Apple Silicon (M1–M4) regardless of original signature state.'
            echo '  postflight do'
            echo '    system_command "/usr/bin/xattr",'
            echo '                   args: ["-cr", "#{appdir}/Cadente.app"],'
            echo '                   sudo: true'
            echo '    system_command "/usr/bin/codesign",'
            echo '                   args: ["--force", "--deep", "--sign", "-", "#{appdir}/Cadente.app"],'
            echo '                   sudo: true'
            echo '    system_command "/usr/bin/open",'
            echo '                   args: ["#{appdir}/Cadente.app"],'
            echo '                   sudo: false'
            echo '  end'
            echo ''
            echo '  zap trash: ['
            echo '    "~/Library/Application Support/com.cadente.app",'
            echo '    "~/Library/Caches/com.cadente.app",'
            echo '    "~/Library/Preferences/com.cadente.app.plist",'
            echo '    "~/Library/Saved Application State/com.cadente.app.savedState",'
            echo '  ]'
            echo 'end'
          } > Casks/cadente.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cadente.rb
          git diff --cached --quiet && echo "No cask changes" && exit 0
          git commit -m "chore: bump cadente to v${VERSION}"
          git push

  # ─────────────────────────────────────────────────────────────
  # Auto-debug: dispatch full-log builds on the private repo
  # when any platform fails. Runs only on failure.
  # ─────────────────────────────────────────────────────────────
  debug-on-failure:
    needs: [validate, guardrails, build-macos, smoke-macos-intel, build-linux, build-windows]
    if: failure()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - job: build-macos
            targets: '["aarch64-apple-darwin","x86_64-apple-darwin"]'
          - job: build-linux
            targets: '["linux"]'
          - job: build-windows
            targets: '["windows"]'
    steps:
      - name: Dispatch debug builds to private repo
        env:
          GH_TOKEN: ${{ secrets.DEBUG_DISPATCH_TOKEN }}
        run: |
          echo "::add-mask::${GH_TOKEN}"
          SHA="${{ needs.validate.outputs.sha }}"

          for TARGET in $(echo '${{ matrix.targets }}' | jq -r '.[]'); do
            echo "🔍 Dispatching debug build for ${TARGET} @ ${SHA:0:8}"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/jeancatarina/catarina-claude/dispatches" \
              -d "{
                \"event_type\": \"debug-build\",
                \"client_payload\": {
                  \"target\": \"${TARGET}\",
                  \"sha\": \"${SHA}\"
                }
              }"
          done
          echo ""
          echo "📋 Check debug logs at: https://github.com/jeancatarina/catarina-claude/actions/workflows/debug-build.yml"
