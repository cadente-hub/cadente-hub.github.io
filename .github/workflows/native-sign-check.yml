name: native-sign-check

# Proves the release key can sign what the app verifies, in about two minutes, before a release is built.
# The job holds the release key, so it compiles only xtask and uses no third-party action or cache.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Private repo commit SHA (40 hex)"
        required: true
        type: string

permissions:
  contents: read

env:
  PRIVATE_REPO: jeancatarina/catarina-claude

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/clone-private.sh
          sparse-checkout-cone-mode: false
          path: _builder
          persist-credentials: false

      - name: Clone the private repository at the commit
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          SHA: ${{ inputs.sha }}
        run: |
          cp _builder/.github/scripts/clone-private.sh "$RUNNER_TEMP/clone-private.sh"
          rm -rf _builder
          bash "$RUNNER_TEMP/clone-private.sh" src "$SHA"

      - name: Build the packaging tool
        working-directory: src
        run: |
          rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" > /dev/null 2>&1
          cargo build --quiet --locked -p xtask > "$RUNNER_TEMP/xtask-build.log" 2>&1 || { echo "::error::xtask did not build"; exit 1; }

      - name: Sign a file with the release key
        working-directory: src
        env:
          CADENTE_RELEASE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "check" > "$RUNNER_TEMP/check.txt"
          ./target/debug/xtask sign "$RUNNER_TEMP/check.txt"
          test -s "$RUNNER_TEMP/check.txt.minisig" && echo "signed with the release key"
          # A signature is public: anyone can check it against the key the app trusts.
          cat "$RUNNER_TEMP/check.txt.minisig"
