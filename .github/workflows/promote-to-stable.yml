name: Promote to Stable

on:
  workflow_dispatch:
    inputs:
      unstable_version:
        description: "Unstable version to promote (e.g. 0.2.87-beta.12)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-to-stable
  cancel-in-progress: false

env:
  PRIVATE_REPO: jeancatarina/catarina-claude

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ inputs.unstable_version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "::error::Expected X.Y.Z-beta.N, got: $VERSION"
            exit 1
          fi

      - name: Derive tags
        id: versions
        run: |
          UNSTABLE="${{ inputs.unstable_version }}"
          STABLE="${UNSTABLE%-beta.*}"
          echo "unstable_tag=v${UNSTABLE}" >> "$GITHUB_OUTPUT"
          echo "stable_tag=v${STABLE}" >> "$GITHUB_OUTPUT"
          echo "stable_version=${STABLE}" >> "$GITHUB_OUTPUT"

      - name: Verify unstable release exists
        id: unstable
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          STABLE_VERSION: ${{ steps.versions.outputs.stable_version }}
        run: |
          gh release view "${{ steps.versions.outputs.unstable_tag }}" \
            --repo "${{ github.repository }}" \
            --json tagName,assets,body >/tmp/release.json

          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.request

          data = json.load(open('/tmp/release.json'))
          assets = data.get('assets', [])
          if not assets:
              raise SystemExit("::error::Unstable release has no assets to promote.")

          # Release notes embed a short, customer-facing commit abbreviation.
          # Resolve it to the full SHA the private repo needs to check out.
          body = data.get('body') or ''
          match = re.search(r'\bCommit:\s*`([0-9a-f]{7,40})`', body, re.IGNORECASE)
          if not match:
              raise SystemExit("::error::Could not find source commit SHA in unstable release notes.")

          short_sha = match.group(1)
          private_repo = os.environ['PRIVATE_REPO']
          request = urllib.request.Request(
              f"https://api.github.com/repos/{private_repo}/commits/{short_sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['PRIVATE_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request) as response:
              sha = json.load(response)["sha"]

          # Carry the beta's own changelog into the stable release instead of
          # leaving it blank: swap the beta-specific header/channel lines for
          # their stable equivalents and pass the rest through unchanged.
          notes = body.strip()
          notes = re.sub(r'^## Cadente v\S+', f"## Cadente v{os.environ['STABLE_VERSION']}", notes, count=1)
          notes = re.sub(r'^- Channel: `unstable`$', '- Channel: `stable`', notes, count=1, flags=re.MULTILINE)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={sha}\n")
              output.write("notes<<CADENTE_PROMOTE_NOTES\n")
              output.write(notes + "\n")
              output.write("CADENTE_PROMOTE_NOTES\n")
          print(f"Found {len(assets)} assets from {sha[:8]} (resolved from {short_sha})")
          PY

      - name: Ensure stable release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.versions.outputs.stable_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Stable release ${{ steps.versions.outputs.stable_tag }} already exists."
            exit 1
          fi

      - name: Trigger stable rebuild from unstable SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          RELEASE_NOTES: ${{ steps.unstable.outputs.notes }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.versions.outputs.stable_version }}"
          SHA="${{ steps.unstable.outputs.sha }}"
          TIMESTAMP="$(date +%s)"

          if [ -z "$DISPATCH_SECRET" ]; then
            echo "::error::DISPATCH_SECRET is not configured."
            exit 1
          fi

          # build-release.yml signs release notes into the HMAC (4-part form)
          # when present, and falls back to the 3-part form otherwise — mirror
          # that here so the dispatch verifies on the receiving end.
          if [ -n "$RELEASE_NOTES" ]; then
            RELEASE_NOTES_SHA="$(printf '%s\n' "$RELEASE_NOTES" | shasum -a 256 | awk '{print $1}')"
            SIGNATURE="$(echo -n "${VERSION}:${SHA}:${TIMESTAMP}:${RELEASE_NOTES_SHA}" | openssl dgst -sha256 -hmac "$DISPATCH_SECRET" | awk '{print $2}')"
          else
            RELEASE_NOTES_SHA=""
            SIGNATURE="$(echo -n "${VERSION}:${SHA}:${TIMESTAMP}" | openssl dgst -sha256 -hmac "$DISPATCH_SECRET" | awk '{print $2}')"
          fi

          jq -n \
            --arg event_type "build-release" \
            --arg version "$VERSION" \
            --arg sha "$SHA" \
            --arg signature "$SIGNATURE" \
            --arg timestamp "$TIMESTAMP" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg release_notes_sha "$RELEASE_NOTES_SHA" \
            '{event_type:$event_type, client_payload:({version:$version, sha:$sha, signature:$signature, timestamp:$timestamp} + (if $release_notes != "" then {release_notes:$release_notes, release_notes_sha:$release_notes_sha} else {} end))}' \
            >/tmp/build-release-dispatch.json

          gh api "repos/${{ github.repository }}/dispatches" \
            --method POST \
            --input /tmp/build-release-dispatch.json

          echo "Stable rebuild requested for ${{ steps.versions.outputs.stable_tag }}."
          echo "build-release.yml will verify the signed dispatch and publish update.json."
