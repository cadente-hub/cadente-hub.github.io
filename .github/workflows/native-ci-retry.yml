name: native-ci-retry

# Y13 (ADR 0091 T12): when a native-ci run ends red and only the infrastructure failed (a clone, the
# toolchain, apt, a cache, an artifact), its failed jobs run once more, without a person. A test, a
# lint, the ruler, a build or a smoke that failed stays red: `infra-retry.sh` reads the failed steps of
# every failed job and says `retry` only when none of them is the code's. One retry per run (attempt 1),
# so an infrastructure that stays down does not loop. The job cannot live in native-ci itself: GitHub
# reruns the failed jobs of a run only after the run is complete.
on:
  workflow_run:
    workflows: [native-ci]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  retry:
    name: retry the infrastructure
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/infra-retry.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Rerun the failed jobs when only the infrastructure failed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/scripts/infra-retry.sh run
