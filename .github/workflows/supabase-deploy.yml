name: Supabase deploy

# Applies SQL migrations through the Supabase Management API. Needs one repository secret:
#   SUPABASE_ACCESS_TOKEN  — a personal access token (supabase.com/dashboard/account/tokens)
# The Paddle functions (get-prices, paddle-webhook) left with the Pro plan (ADR 0077 §2.10, B17):
# the 1.1.0 is free, so nothing here deploys or checks them.
#
# The deploy job runs the Supabase CLI with the read-only deploy key; the write to the private
# repository happens in `record`, which runs no third-party code. The public log carries outcomes
# only: no SQL, no database errors, no policies.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Private repo commit SHA to deploy"
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: awglxdeqzkursbmotjpm
  PRIVATE_REPO: jeancatarina/catarina-claude

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; skipping deploy. Add it under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup builder scripts
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/clone-private.sh
          sparse-checkout-cone-mode: false
          path: _builder
          persist-credentials: false

      - name: Clone private repository
        if: steps.creds.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
        run: |
          cp _builder/.github/scripts/clone-private.sh "$RUNNER_TEMP/clone-private.sh"
          rm -rf _builder
          bash "$RUNNER_TEMP/clone-private.sh" . "$SHA"

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: latest

      - name: Apply migrations
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            [ -e "$file" ] || continue
            echo "Applying $(basename "$file")"
            body=$(jq -Rs '{query: .}' < "$file")
            status=$(curl -sS -o /tmp/migration.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$body")
            rm -f /tmp/migration.json
            if [ "$status" -ge 300 ]; then
              # The database error quotes the SQL; read it in the Supabase dashboard.
              echo "::error::Migration $(basename "$file") failed (HTTP $status)"
              exit 1
            fi
          done

      - name: Audit profiles access
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          query=$(jq -n --arg q "
            select 'policy' as kind, policyname as name, cmd, roles::text as detail, qual as rule
              from pg_policies where schemaname = 'public' and tablename = 'profiles'
            union all
            select 'grant', grantee, privilege_type, table_name, null
              from information_schema.role_table_grants
              where table_schema = 'public' and table_name = 'profiles' and grantee in ('anon', 'authenticated')
            union all
            select 'rls', relname, case when relrowsecurity then 'enabled' else 'DISABLED' end, null, null
              from pg_class where oid = 'public.profiles'::regclass;" '{query: $q}')
          curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$query" > /tmp/audit.json
          # The policies themselves stay out of the public log; only the verdict is printed.
          if jq -e '.[] | select(.kind == "grant" and (.cmd == "UPDATE" or .cmd == "INSERT" or .cmd == "DELETE"))' /tmp/audit.json >/dev/null; then
            rm -f /tmp/audit.json
            echo "::error::anon/authenticated can still write public.profiles"
            exit 1
          fi
          if jq -e '.[] | select(.kind == "rls" and .cmd != "enabled")' /tmp/audit.json >/dev/null; then
            rm -f /tmp/audit.json
            echo "::error::Row level security is disabled on public.profiles"
            exit 1
          fi
          echo "profiles: $(jq '[.[] | select(.kind == "policy")] | length' /tmp/audit.json) policies, row level security on, no write grant to anon/authenticated"
          rm -f /tmp/audit.json

  record:
    # Runs no third-party code: the only job here that writes to the private repository.
    needs: deploy
    if: needs.deploy.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record deployed SHA
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_WRITE_TOKEN:-}" ]; then
            echo "::warning::CATARINA_PRIVATE_READ_TOKEN not set; cannot record supabase-deployed SHA."
            exit 0
          fi
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          LOGS_DIR="$(mktemp -d)"
          if git clone --depth=1 --branch ci-logs "https://x-access-token:${PRIVATE_WRITE_TOKEN}@github.com/${PRIVATE_REPO}.git" "$LOGS_DIR" >/dev/null 2>&1; then
            echo "$SHA" > "$LOGS_DIR/supabase-deployed"
            git -C "$LOGS_DIR" config user.name "github-actions[bot]"
            git -C "$LOGS_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$LOGS_DIR" add supabase-deployed
            if ! git -C "$LOGS_DIR" diff --cached --quiet; then
              git -C "$LOGS_DIR" commit -m "ci: update supabase-deployed to $SHA" >/dev/null 2>&1
              for attempt in 1 2 3 4 5; do
                if git -C "$LOGS_DIR" push origin ci-logs >/dev/null 2>&1; then
                  break
                fi
                git -C "$LOGS_DIR" pull --rebase origin ci-logs >/dev/null 2>&1 || true
                sleep "$attempt"
              done
            fi
          fi
          rm -rf "$LOGS_DIR"
