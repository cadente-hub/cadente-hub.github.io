name: native-ci
run-name: native-ci ${{ inputs.sha }}${{ inputs.channel == 'stable' && ' stable' || '' }}

# One run per commit of the private main (ADR 0082 W3): lint, tests and the ruler on the three systems,
# and beside them the packages. `publish` waits for the three systems green, the basic smoke and the
# signature, so a beta leaves the same run that proved its commit. The stable channel comes from
# native-promote through native-release, which dispatches this workflow with `channel: stable`.
# The long measurement (P1, P2, P4, P5 and P6) runs beside and after `publish` and gives the commit
# `native-ci/perf`, which native-promote requires (W10, ADR 0082 §7, as Zed's nightly leaves perf out).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Private repo commit SHA (40 hex)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: false
        default: beta
        type: choice
        options: [beta, stable]
      force_build:
        description: "Branch runs only: compile even when the commit only changes documents"
        required: false
        default: false
        type: boolean
      plant_failure:
        description: "Branch runs only: add a failing test, to prove that publish waits for green"
        required: false
        default: false
        type: boolean
      lock_update:
        description: "Branch runs only (W4 proof): change one dependency of Cargo.lock in the tests job, as name@version"
        required: false
        default: ""
        type: string
      plant_size:
        description: "Branch runs only (O1 proof): break R5 or R6 in the Linux lint"
        required: false
        default: none
        type: choice
        options: [none, new-file-401, above-ceiling, copied-block]
      warm_up:
        description: "Compile every job and save the caches, publish nothing (after a change of cache key)"
        required: false
        default: false
        type: boolean
  # Safety net for a push that dispatched no run: every 3 hours, and only for a HEAD no run has seen.
  schedule:
    - cron: '0 */3 * * *'

# Queue instead of cancelling: each run tests the private main's HEAD, and cancelling a run that is
# almost green would hold the beta back for every new commit. A run from another branch (a test of this
# workflow) queues apart from main's.
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: false

# The lint, tests, ruler and package jobs compile hundreds of third-party crates, and a build script can
# read every secret its job references. So they hold only the read-only deploy key and print no compiler
# or test output: the full log leaves them encrypted. `resolve`, `report` and `summary` compile nothing;
# only they write to the private repository. `sign` holds only the release key and compiles only xtask;
# `publish` holds only the release token and compiles nothing.
permissions:
  contents: read

env:
  PRIVATE_REPO: jeancatarina/catarina-claude
  # The v4 parity ruler drives three live windows and takes every test thread for 100 to 190 s, so it
  # runs in a job of its own: there it no longer holds back the other 2000 tests, and it reports first.
  RULER: test(=live::parity::v4_parity_actions_only_shrink_the_pending_list)

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve_sha.outputs.sha }}
      skip: ${{ steps.resolve_sha.outputs.skip }}
      channel: ${{ steps.resolve_sha.outputs.channel }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      base: ${{ steps.changes.outputs.base }}
      toolchain_changed: ${{ steps.changes.outputs.toolchain_changed }}
      toolchain: ${{ steps.changes.outputs.toolchain }}
      release: ${{ steps.version.outputs.release }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate SHA
        id: resolve_sha
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          CHANNEL="${INPUT_CHANNEL:-beta}"
          case "$CHANNEL" in beta|stable) ;; *) echo "::error::Unknown channel: $CHANNEL"; exit 1 ;; esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$INPUT_SHA"
          else
            # schedule trigger: resolve HEAD of private main
            SHA=$(git ls-remote "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" refs/heads/main | awk '{print $1}')
            if [ -z "$SHA" ]; then
              echo "::error::Could not resolve main HEAD for ${PRIVATE_REPO}"
              exit 1
            fi
            # A commit any run already took (green, red or still running) has native-ci statuses. A red
            # one is not run again: a failure is fixed by a new commit, never retried (ADR 0076 R2), and
            # rerunning it every hour held the queue in front of the next push.
            SEEN=$(curl -sf "https://api.github.com/repos/${PRIVATE_REPO}/commits/${SHA}/statuses?per_page=100" \
              -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" 2>/dev/null \
              | jq '[.[] | select(.context | startswith("native-ci/"))] | length' 2>/dev/null || echo 0)
            if [ "${SEEN:-0}" -gt 0 ]; then
              echo "SHA $SHA already has a native-ci run. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid SHA format (must be 40 hex digits): $SHA"
            exit 1
          fi

          # The clone stays for the next steps; it has every commit and tree, and the blobs of $SHA.
          git clone --filter=blob:none "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" "$RUNNER_TEMP/private" >/dev/null 2>&1
          cd "$RUNNER_TEMP/private"
          git checkout "$SHA" >/dev/null 2>&1
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::SHA $SHA is not an ancestor of main."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # W2 (ADR 0082): the diff from the last ancestor with the three statuses green. When it touches
      # only docs/ (but docs/conformance/, which a launcher test reads), design/ or the root .md files,
      # and no include_str!, include_bytes! or rerun-if-changed names a changed file, nothing compiles
      # and no beta leaves. Warp's ci.yml (`needs-build` of dorny/paths-filter) and Zed's run_tests.yml
      # (`orchestrate`) skip the same way, listing the documents they know.
      - name: Changes since the last green commit
        id: changes
        if: steps.resolve_sha.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/private
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          CHANNEL: ${{ steps.resolve_sha.outputs.channel }}
          # A warm-up run compiles whatever the commit changed: it exists to save the caches.
          FORCE_BUILD: ${{ (github.ref != 'refs/heads/main' && inputs.force_build) || inputs.warm_up }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          BASE=""
          for C in $(git rev-list --first-parent --max-count=40 "${SHA}^" 2>/dev/null); do
            GREEN="$(curl -sf "https://api.github.com/repos/${PRIVATE_REPO}/commits/${C}/status?per_page=100" \
              -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" 2>/dev/null \
              | jq '[.statuses[] | select(.state == "success" and (.context == "native-ci/macos-15" or .context == "native-ci/ubuntu-latest" or .context == "native-ci/windows-latest"))] | length' 2>/dev/null || echo 0)"
            if [ "${GREEN:-0}" = 3 ]; then BASE="$C"; break; fi
          done
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # W1: the run after a change of the pinned Rust rebuilds everything and stays out of the p90.
          PREVIOUS="${BASE:-$(git rev-parse "${SHA}^" 2>/dev/null || true)}"
          TOOLCHAIN_CHANGED=false
          if [ -n "$PREVIOUS" ] && [ "$(git rev-parse "${PREVIOUS}:rust-toolchain.toml" 2>/dev/null)" != "$(git rev-parse "${SHA}:rust-toolchain.toml")" ]; then
            TOOLCHAIN_CHANGED=true
          fi
          echo "toolchain_changed=$TOOLCHAIN_CHANGED" >> "$GITHUB_OUTPUT"
          # W6: the jobs that compile install this channel while they clone.
          echo "toolchain=$(git show "${SHA}:rust-toolchain.toml" | sed -n 's/^channel = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"

          DOCS_ONLY=false
          if [ "$CHANNEL" = "beta" ] && [ -n "$BASE" ] && [ "$FORCE_BUILD" != "true" ]; then
            CHANGED="$(git diff --no-renames --name-only "$BASE" "$SHA")"
            CODE="$(printf '%s\n' "$CHANGED" | grep -vE '^(docs/|design/|[^/]+\.md$)' | grep -c . || true)"
            CONFORMANCE="$(printf '%s\n' "$CHANGED" | grep -c '^docs/conformance/' || true)"
            if [ -n "$CHANGED" ] && [ "$CODE" = 0 ] && [ "$CONFORMANCE" = 0 ]; then
              READS="$(grep -rhE --include='*.rs' 'include_(str|bytes)!|rerun-if-changed' . 2>/dev/null || true)"
              READ_BY_BUILD=""
              while IFS= read -r FILE; do
                if printf '%s' "$READS" | grep -qF "$FILE"; then READ_BY_BUILD="$FILE"; break; fi
              done <<< "$CHANGED"
              if [ -z "$READ_BY_BUILD" ]; then
                DOCS_ONLY=true
              else
                echo "A document changed here is read by the build; compiling."
              fi
            fi
            echo "$(printf '%s\n' "$CHANGED" | grep -c . || true) files changed since ${BASE:0:12}; documents only: $DOCS_ONLY"
          else
            echo "Compiling: channel $CHANNEL, last green ancestor '${BASE:0:12}', force_build '$FORCE_BUILD'."
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

      - name: Mark a toolchain change
        if: steps.changes.outputs.toolchain_changed == 'true'
        run: echo "::notice::rust-toolchain.toml changed; this run rebuilds everything and stays out of the p90 (ADR 0082, decisão 3)."

      - name: Number the release
        id: version
        if: steps.resolve_sha.outputs.skip == 'false' && steps.changes.outputs.docs_only != 'true'
        working-directory: ${{ runner.temp }}/private
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          CHANNEL: ${{ steps.resolve_sha.outputs.channel }}
          WARM_UP: ${{ inputs.warm_up }}
        run: |
          set -euo pipefail
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)"
          printf '%s' "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::crate version is not X.Y.Z: $BASE"; exit 1; }
          RELEASE=true
          if [ "$CHANNEL" = "stable" ]; then
            VERSION="$BASE"
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::v${VERSION} already exists; raise the crate version first"; exit 1
            fi
          else
            LAST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' | sed -n "s/^v${BASE}-beta\.\([0-9]*\)$/\1/p" | sort -n | tail -1)"
            VERSION="${BASE}-beta.$(( ${LAST:-0} + 1 ))"
            # A commit becomes one beta: a second run of it tests again and publishes nothing.
            if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" --jq '.[] | select(.prerelease) | .body' | grep -qxF "commit: ${SHA}"; then
              echo "$SHA already has a beta; this run tests and publishes nothing."
              RELEASE=false
            fi
          fi
          # A warm-up run (W4) builds the packages to save their caches and publishes nothing.
          PUBLISH="$RELEASE"
          if [ "$WARM_UP" = "true" ]; then RELEASE=true; PUBLISH=false; echo "Warm-up: packages build, nothing is published."; fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION from $SHA (publishes: $RELEASE)"

      # A run from another branch tests this workflow and leaves the commit's statuses alone, and so does
      # a warm-up run, which tests a commit that already has its verdict.
      - name: Publish the statuses
        if: steps.resolve_sha.outputs.skip == 'false' && github.ref == 'refs/heads/main' && !inputs.warm_up
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          BASE: ${{ steps.changes.outputs.base }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          if [ "$DOCS_ONLY" = "true" ]; then
            STATE=success; DESCRIPTION="sem código desde ${BASE:0:12}"
          else
            STATE=pending; DESCRIPTION="native-ci running"
          fi
          # W10: a run that builds packages also measures them, and `perf` writes the verdict.
          CONTEXTS="macos-15 ubuntu-latest windows-latest"
          [ "$DOCS_ONLY" != "true" ] && [ "$RELEASE" = "true" ] && CONTEXTS="$CONTEXTS perf"
          for OS in $CONTEXTS; do
            BODY="$(jq -cn --arg state "$STATE" --arg description "$DESCRIPTION" --arg context "native-ci/$OS" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, target_url: $url, description: $description, context: $context}')"
            curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
              -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$BODY" >/dev/null 2>&1 || echo "::warning::Could not record the status of $OS"
            echo "$OS: $STATE $DESCRIPTION"
          done

  # W4 (ADR 0082): the repository has 10 GB of cache, and one generation of every Rust cache takes about
  # 8.5 GB. A commit that changes Cargo.lock saves a new generation of each kind while the old one is still
  # there; at the end of the run the total passed 10 GB, and GitHub evicted caches main still used (the
  # Linux and Windows package caches, before run 41445092862). This job keeps one generation of each kind
  # while the run saves: the old one goes as soon as the new one lands. It compiles nothing.
  cache-guard:
    name: cache guard
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/prune-rust-caches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Keep one generation of each Rust cache while the run saves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          while :; do
            PENDING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '[.jobs[] | select((.name | test("^(lint|tests|package) ")) and .status != "completed")] | length' 2>/dev/null || echo 1)"
            bash .github/scripts/prune-rust-caches.sh | grep -v '^cache in use' || true
            [ "$PENDING" = 0 ] && break
            sleep 20
          done
          bash .github/scripts/prune-rust-caches.sh

  # Each system runs lint, tests and ruler side by side; the run takes as long as the slowest job, not
  # their sum. `cargo clippy --all-targets -D warnings` also type-checks every target, so no separate
  # `cargo check`.
  lint:
    name: lint ${{ matrix.os }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    # Without a limit a hung step holds the run, and the queue behind it, for six hours.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MATRIX_OS: ${{ matrix.os }}
      JOB_KIND: lint
    steps:
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      # W6 (ADR 0082): the three builder files come straight from this commit of the public repository;
      # the checkout action took 6 to 11 s on Windows.
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      # W6 (ADR 0082): only the toolchain rust-toolchain.toml pins, with its components (installing
      # `stable` first, as before, added a second toolchain nothing built with), and apt only for what
      # the image lacks (the index update alone took 10 to 30 s); both run while the commit is cloned.
      - name: Clone private repository, Rust toolchain and system libraries
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          NEXTEST: "true"
        run: |
          bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "" \
            libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev

      # Clippy compiles the dependencies in check mode, which shares nothing with the test build.
      - name: Rust cache
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize log file
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          touch "$RUNNER_TEMP/ci-build.log"
          if [ "$CACHE_HIT" = "true" ]; then CACHE=inteiro; elif [ -d target ] && [ -n "$(ls -A target 2>/dev/null)" ]; then CACHE=parcial; else CACHE=nenhum; fi
          { echo "cache=$CACHE"; echo "work_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"

      # Compiler and test output names files, lines, tests and screens of the private source: it goes
      # only to ci-build.log. The public log says which step failed, how long cargo took, and no more.
      - name: Check formatting (cargo fmt)
        run: |
          echo "Passo: cargo fmt --all --check"
          if cargo fmt --all --check >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo fmt" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      # R5 and R6 (ADR 0083 O1): no .rs or .slint above 400 lines or its ceiling in .config/lines.toml,
      # and no clone beyond .config/clones.toml (jscpd 4.3.0, the DSH's configuration, in .jscpd.json).
      # Only on Linux: both read files, not the system. Their output names private files, so it goes only
      # to the sealed log.
      - name: Node on the image
        id: node
        if: runner.os == 'Linux'
        run: echo "major=$(node --version 2>/dev/null | sed -E 's/^v([0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Node 22
        if: runner.os == 'Linux' && steps.node.outputs.major != '22'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: File size and duplication (cargo xtask lines, jscpd)
        if: runner.os == 'Linux'
        env:
          PLANT_SIZE: ${{ github.ref != 'refs/heads/main' && inputs.plant_size || 'none' }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/ci-build.log"
          # Branch runs only: each plant must make this step fail (the O1 proof). awk stops at the first
          # entry; `sed | head` broke the pipe and failed the step before the check ran.
          case "$PLANT_SIZE" in
            new-file-401)
              for N in $(seq 401); do echo "// linha $N"; done > crates/app/src/o1_probe.rs
              git add crates/app/src/o1_probe.rs ;;
            above-ceiling)
              FIRST="$(awk -F'"' '/^"/ {print $2; exit}' .config/lines.toml)"
              echo "// uma linha acima do teto" >> "$FIRST" ;;
            copied-block)
              FIRST="$(awk -F'"' '/^"/ && $2 ~ /[.]rs$/ && $2 !~ /\/tests\// {print $2; exit}' .config/lines.toml)"
              { echo "mod o1_probe {"; sed -n '100,180p' "$FIRST"; echo "}"; } > crates/app/src/o1_probe.rs ;;
          esac
          echo "Passo: cargo xtask lines"
          if cargo xtask lines >> "$LOG" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo xtask lines" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi
          echo "Passo: jscpd 4.3.0 (.jscpd.json)"
          set +e
          npx --yes jscpd@4.3.0 --config .jscpd.json --reporters console,json --output "$RUNNER_TEMP/jscpd" crates xtask build >> "$LOG" 2>&1
          JSCPD_EXIT=$?
          set -e
          CLONES="$(jq '.statistics.total.clones' "$RUNNER_TEMP/jscpd/jscpd-report.json" 2>/dev/null || echo "")"
          CEILING="$(sed -n 's/^clones = \([0-9]*\)$/\1/p' .config/clones.toml)"
          echo "jscpd: $CLONES clones, teto $CEILING" >> "$LOG"
          if [ "$JSCPD_EXIT" -eq 0 ] && [ -n "$CLONES" ] && [ -n "$CEILING" ] && [ "$CLONES" -le "$CEILING" ]; then
            echo "Resultado: OK"
            if [ "$CLONES" -lt "$CEILING" ]; then echo "::notice::Há menos clones que o teto da .config/clones.toml; baixe o teto."; fi
          else
            echo "Resultado: FALHOU"
            echo "jscpd" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Clippy (cargo clippy)
        run: |
          echo "Passo: cargo clippy --workspace --all-targets -- -D warnings"
          CLIPPY_RAW="$RUNNER_TEMP/clippy_raw.log"
          START=$(date +%s)
          set +e
          cargo clippy --workspace --all-targets --timings --message-format short -- -D warnings > "$CLIPPY_RAW" 2>&1
          CLIPPY_EXIT=$?
          set -e
          echo "compile_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          cat "$CLIPPY_RAW" >> "$RUNNER_TEMP/ci-build.log"
          sed 's/\x1b\[[0-9;]*m//g' "$CLIPPY_RAW" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
          if [ $CLIPPY_EXIT -eq 0 ]; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "clippy" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Prove invariants and retry gates reject regressions
        run: |
          set -euo pipefail
          echo "invariants" > "$RUNNER_TEMP/failed_step"
          PROBE="$PWD/.ci-gate-probe"
          trap 'rm -rf "$PROBE"' EXIT
          mkdir -p "$PROBE/src"
          printf '[package]\nname = "cadente-core"\nversion = "0.0.0"\nedition = "2021"\nautotests = false\n[[bin]]\nname = "gate-probe"\npath = "src/main.rs"\ntest = false\n[[test]]\nname = "it"\npath = "src/main.rs"\n[workspace]\n' > "$PROBE/Cargo.toml"
          printf 'fn main() { let _ = std::process::Command::new("forbidden"); }\n' > "$PROBE/src/main.rs"
          if cargo clippy --manifest-path "$PROBE/Cargo.toml" -- -A clippy::all -D clippy::disallowed_methods > "$RUNNER_TEMP/lint-probe.log" 2>&1; then
            echo '::error::The invariant gate accepted a forbidden process call'
            exit 1
          fi
          grep -q 'disallowed method' "$RUNNER_TEMP/lint-probe.log"
          cat > "$PROBE/src/main.rs" <<'RS'
          fn main() {}
          #[test]
          fn fails_only_on_first_attempt() {
              let path = std::env::var("GATE_ATTEMPTS").unwrap();
              let count = std::fs::read_to_string(&path).unwrap_or_default().parse::<u32>().unwrap_or(0) + 1;
              std::fs::write(path, count.to_string()).unwrap();
              assert!(count > 1, "first attempt fails; retry would hide it");
          }
          RS
          for PROFILE in default ci; do
            export GATE_ATTEMPTS="attempts-$PROFILE"
            if cargo nextest run --manifest-path "$PROBE/Cargo.toml" --config-file "$PWD/.config/nextest.toml" --profile "$PROFILE" > "$RUNNER_TEMP/retry-probe-$PROFILE.log" 2>&1; then
              echo "::error::The $PROFILE profile hid a failing test"
              exit 1
            fi
            if [ ! -f "$PROBE/$GATE_ATTEMPTS" ]; then
              cat "$RUNNER_TEMP/retry-probe-$PROFILE.log" >> "$RUNNER_TEMP/ci-build.log"
              echo "::error::The $PROFILE profile did not run the probe test"
              exit 1
            fi
            test "$(cat "$PROBE/$GATE_ATTEMPTS")" = 1
          done
          rm -f "$RUNNER_TEMP/failed_step"

      # Runs on a timeout or cancellation too: the log of a hung step is the one most needed. The
      # cargo --timings report names the crates, so it is sealed on every run.
      - name: Seal the build log and the timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          if [ -f target/cargo-timings/cargo-timing.html ]; then
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/sealed/timings.enc.json" || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            FAILED_STEP="passo desconhecido"
            [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
            {
              echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
              echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
            } > "$RUNNER_TEMP/sealed.log"
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
            rm -f "$RUNNER_TEMP/sealed.log"
            echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."
          fi

      - name: Upload the sealed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-lint
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-lint-${{ matrix.os }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  # W5 (ADR 0082): one test build per system. This job compiles the tests once, stores the nextest
  # archive for the ruler (and, on Windows, for the second half of the tests), and runs its part.
  # Windows runs the suite about 1.6 times slower, so its tests run in two halves.
  tests:
    name: tests ${{ matrix.os }}${{ matrix.part && format(' {0}/2', matrix.part) || '' }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15 }
          - { os: ubuntu-latest }
          - { os: windows-latest, part: "1" }
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MATRIX_OS: ${{ matrix.os }}
      JOB_KIND: tests${{ matrix.part && format('-{0}', matrix.part) || '' }}
      PART: ${{ matrix.part }}
      PLANT_FAILURE: ${{ github.ref != 'refs/heads/main' && inputs.plant_failure && matrix.os == 'ubuntu-latest' }}
    steps:
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      # W6 (ADR 0082): the three builder files come straight from this commit of the public repository;
      # the checkout action took 6 to 11 s on Windows.
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      # W6 (ADR 0082): only the toolchain rust-toolchain.toml pins, with its components (installing
      # `stable` first, as before, added a second toolchain nothing built with), and apt only for what
      # the image lacks (the index update alone took 10 to 30 s); both run while the commit is cloned.
      - name: Clone private repository, Rust toolchain and system libraries
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          NEXTEST: "true"
        run: |
          bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "" \
            libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev

      # Branch runs only (W3 proof): a failing unit test in the smallest crate, so the run turns red and
      # publish does not run. The test name is the only thing the public log can show of it.
      - name: Plant a failing test
        if: env.PLANT_FAILURE == 'true'
        run: printf '\n#[test]\nfn planted_failure_for_the_publish_gate() {\n    panic!("planted by the native-ci branch run");\n}\n' >> crates/frame-journal/src/lib.rs

      # W6: the tests start Node MCP servers; Node 22 is installed only when the image lacks it.
      - name: Node on the image
        id: node
        run: echo "major=$(node --version 2>/dev/null | sed -E 's/^v([0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Node 22
        if: steps.node.outputs.major != '22'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # W4 (ADR 0082): what changes the test build lives in a Cargo config file of the checkout, passed with
      # --config, and not in the job's environment. rust-cache hashes every .cargo/config.toml of the
      # workspace into the part of the key it falls back from, so a change here restores the previous
      # generation instead of compiling ~900 crates cold, and local builds stay as they are.
      # No debug info: nothing in CI reads a backtrace. On Windows, `strip = debuginfo` makes rustc pass
      # /DEBUG:NONE, so link.exe writes no PDB for each of the 54 test binaries. TEMP moves to D:, the
      # runner's local disk, where the tests' SQLite stores sync each commit.
      # Branch runs only (W4 proof): a Cargo.lock that changes one dependency must restore the previous
      # generation of the cache and compile only that crate and what depends on it.
      - name: Change one dependency of Cargo.lock
        if: github.ref != 'refs/heads/main' && inputs.lock_update != ''
        env:
          LOCK_UPDATE: ${{ inputs.lock_update }}
        run: |
          printf '%s' "$LOCK_UPDATE" | grep -qE '^[A-Za-z0-9_-]+@[0-9A-Za-z.+-]+$' || { echo "::error::lock_update must be name@version"; exit 1; }
          cargo update --precise "${LOCK_UPDATE#*@}" "${LOCK_UPDATE%@*}" 2>&1 | grep -E 'Updating|Downgrading|Locking' || true

      - name: CI build settings
        run: |
          mkdir -p .ci/.cargo
          { echo "# native-ci (ADR 0082 W4); only CI reads this file, through --config."; echo "[profile.dev]"; echo "debug = 0"; } > .ci/.cargo/config.toml
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo 'strip = "debuginfo"' >> .ci/.cargo/config.toml
            mkdir -p "$RUNNER_TEMP/tmp"
            WIN_TMP="$(cygpath -w "$RUNNER_TEMP/tmp")"
            { echo "TMP=$WIN_TMP"; echo "TEMP=$WIN_TMP"; } >> "$GITHUB_ENV"
          fi

      - name: Rust cache
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize log file
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          touch "$RUNNER_TEMP/ci-build.log"
          if [ "$CACHE_HIT" = "true" ]; then CACHE=inteiro; elif [ -d target ] && [ -n "$(ls -A target 2>/dev/null)" ]; then CACHE=parcial; else CACHE=nenhum; fi
          { echo "cache=$CACHE"; echo "work_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"

      # W8 (ADR 0082): the workspace crates of the test build come from a sccache folder per system, as
      # in the packages (Zed's release.yml). A branch measured it (runs 41710337347 and 41714436183): 121,
      # 119 and 134 MB, 27 of the 74 workspace compilations (a test binary is not cached). It fits since
      # the two Mac package caches became one (the repository went from 9.58 to 8.69 GB). The wrapper goes
      # in the build step alone, after rust-cache computed its key, and cargo does not fingerprint it, so
      # the cached dependencies stay fresh and only the workspace crates pass through sccache.
      - name: Install sccache
        uses: taiki-e/install-action@sccache

      - name: Restore the sccache folder
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-tests-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sccache-tests-${{ runner.os }}-

      - name: Build the tests (cargo nextest archive)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '2G' }}
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          echo "Passo: cargo nextest archive --workspace"
          RAW="$RUNNER_TEMP/archive_raw.log"
          START=$(date +%s)
          set +e
          cargo nextest archive --config .ci/.cargo/config.toml --workspace --timings --archive-file "$RUNNER_TEMP/nextest.tar.zst" > "$RAW" 2>&1
          EXIT=$?
          set -e
          echo "compile_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          cat "$RAW" >> "$RUNNER_TEMP/ci-build.log"
          sed 's/\x1b\[[0-9;]*m//g' "$RAW" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
          if [ $EXIT -eq 0 ]; then
            echo "archive_mb=$(( $(wc -c < "$RUNNER_TEMP/nextest.tar.zst") / 1048576 ))" >> "$RUNNER_TEMP/metrics.env"
            echo "Resultado: OK ($(( $(wc -c < "$RUNNER_TEMP/nextest.tar.zst") / 1048576 )) MB de arquivo)"
            # Hit and miss counts only; the names of what compiled stay in the sealed timings.
            STATS="$(sccache --show-stats --stats-format json 2>/dev/null || echo '{}')"
            HITS="$(printf '%s' "$STATS" | jq -r '[.stats.cache_hits.counts // {} | .[]] | add // 0')"
            MISSES="$(printf '%s' "$STATS" | jq -r '[.stats.cache_misses.counts // {} | .[]] | add // 0')"
            SIZE="$(du -sm "$SCCACHE_DIR" 2>/dev/null | cut -f1)"
            echo "sccache: ${HITS} acertos, ${MISSES} faltas, ${SIZE:-0} MB na pasta"
            { echo "sccache_hits=$HITS"; echo "sccache_misses=$MISSES"; echo "sccache_mb=${SIZE:-0}"; } >> "$RUNNER_TEMP/metrics.env"
            sccache --stop-server > /dev/null 2>&1 || true
          else
            echo "Resultado: FALHOU"
            echo "cargo nextest archive" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Save the sccache folder
        if: github.ref == 'refs/heads/main' && vars.SCCACHE_SAVE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-tests-${{ runner.os }}-${{ github.run_id }}

      - name: Mark the archive upload
        run: echo "upload_start=$(date +%s)" >> "$RUNNER_TEMP/metrics.env"

      # Already compressed with zstd, so the artifact stores it as is.
      - name: Upload the test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Documentation tests (cargo test --doc)
        run: |
          START="$(sed -n 's/^upload_start=//p' "$RUNNER_TEMP/metrics.env")"
          echo "upload_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          echo "Passo: cargo test --workspace --doc"
          if cargo test --config .ci/.cargo/config.toml --workspace --doc >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo test --doc" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Run tests (cargo nextest)
        run: |
          echo "Passo: cargo nextest run --workspace --profile ci (sem a régua)${PART:+, metade $PART de 2}"
          NEXTEST_RAW="$RUNNER_TEMP/nextest_raw.log"
          START=$(date +%s)
          set +e
          cargo nextest run --config .ci/.cargo/config.toml --workspace --profile ci -E "not ${RULER}" ${PART:+--partition "hash:${PART}/2"} > "$NEXTEST_RAW" 2>&1
          NEXTEST_EXIT=$?
          set -e
          echo "test_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          cat "$NEXTEST_RAW" >> "$RUNNER_TEMP/ci-build.log"
          # Only the counts are public; the names of the tests that failed are in the private log.
          sed 's/\x1b\[[0-9;]*m//g' "$NEXTEST_RAW" | grep -E '^ *Summary \[' | sed -E 's/^ *//' || true

          if [ $NEXTEST_EXIT -eq 0 ]; then
            echo "Resultado: OK"
          else
            for dir in "${TMPDIR:-}" "${TMP:-}" "${TEMP:-}" /tmp; do
              if [ -n "$dir" ] && [ -f "$dir/parity-tails.log" ]; then
                { echo; echo "--- Telas da régua ($dir/parity-tails.log)"; cat "$dir/parity-tails.log"; } >> "$RUNNER_TEMP/ci-build.log"
                break
              fi
            done
            echo "Resultado: FALHOU"
            echo "cargo nextest" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Seal the build log and the timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          if [ -f target/cargo-timings/cargo-timing.html ]; then
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/sealed/timings.enc.json" || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            FAILED_STEP="passo desconhecido"
            [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
            {
              echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
              echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
            } > "$RUNNER_TEMP/sealed.log"
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
            rm -f "$RUNNER_TEMP/sealed.log"
            echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."
          fi

      - name: Upload the sealed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-tests${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-tests-${{ matrix.os }}${{ matrix.part && format('-{0}-2', matrix.part) || '' }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  # The parity ruler on each system and the second half of the Windows tests, from the archive the tests
  # job of the same system stores (W5): they compile nothing. They start with the run, prepare the
  # machine while that job compiles, and wait for its archive.
  from-archive:
    name: ${{ matrix.kind }} ${{ matrix.os }}${{ matrix.part && format(' {0}/2', matrix.part) || '' }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, kind: ruler, producer: "tests macos-15" }
          - { os: ubuntu-latest, kind: ruler, producer: "tests ubuntu-latest" }
          - { os: windows-latest, kind: ruler, producer: "tests windows-latest 1/2" }
          - { os: windows-latest, kind: tests, part: "2", producer: "tests windows-latest 1/2" }
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MATRIX_OS: ${{ matrix.os }}
      JOB_KIND: ${{ matrix.kind }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
      PART: ${{ matrix.part }}
      KIND: ${{ matrix.kind }}
      PRODUCER: ${{ matrix.producer }}
    steps:
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      # W6 (ADR 0082): the three builder files come straight from this commit of the public repository;
      # the checkout action took 6 to 11 s on Windows.
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      # The tests read fixtures from the workspace, so the archive runs over the same checkout.
      - name: Clone private repository
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
        run: bash "$RUNNER_TEMP/scripts/clone-private.sh" . "$SHA"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        # W6 (ADR 0082): apt only for what the image lacks; the index update alone took 10 to 30 s.
        run: |
          PKGS="libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev"
          # shellcheck disable=SC2086
          dpkg -s $PKGS > /dev/null 2>&1 || { sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y $PKGS; }

      # W6: the tests start Node MCP servers; Node 22 is installed only when the image lacks it.
      - name: Node on the image
        id: node
        run: echo "major=$(node --version 2>/dev/null | sed -E 's/^v([0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Node 22
        if: steps.node.outputs.major != '22'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Windows temp settings
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          WIN_TMP="$(cygpath -w "$RUNNER_TEMP/tmp")"
          { echo "TMP=$WIN_TMP"; echo "TEMP=$WIN_TMP"; } >> "$GITHUB_ENV"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Wait for the test archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: nextest-${{ matrix.os }}
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/ci-build.log"
          echo "work_start=$(date +%s)" >> "$RUNNER_TEMP/metrics.env"
          START=$(date +%s)
          echo "archive" > "$RUNNER_TEMP/failed_step"
          while :; do
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT}" --jq '.artifacts[0].id // empty' 2>/dev/null || true)"
            [ -n "$ID" ] && break
            STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"${PRODUCER}\") | .status" 2>/dev/null || true)"
            if [ "$STATE" = "completed" ]; then
              ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT}" --jq '.artifacts[0].id // empty' 2>/dev/null || true)"
              [ -n "$ID" ] && break
              echo "::error::${PRODUCER} ended without the test archive (it failed to build the tests)"
              exit 1
            fi
            sleep 10
          done
          echo "wait_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          START=$(date +%s)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > "$RUNNER_TEMP/nextest.zip"
          if command -v unzip >/dev/null; then
            unzip -q -o "$RUNNER_TEMP/nextest.zip" -d "$RUNNER_TEMP"
          else
            7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/nextest.zip" >/dev/null
          fi
          rm -f "$RUNNER_TEMP/nextest.zip"
          { echo "download_s=$(( $(date +%s) - START ))"; echo "archive_mb=$(( $(wc -c < "$RUNNER_TEMP/nextest.tar.zst") / 1048576 ))"; } >> "$RUNNER_TEMP/metrics.env"
          rm -f "$RUNNER_TEMP/failed_step"
          echo "Arquivo de testes: $(( $(wc -c < "$RUNNER_TEMP/nextest.tar.zst") / 1048576 )) MB"

      # Extracted into the checkout, the binaries sit at the paths they were built for, so the
      # `CARGO_BIN_EXE_*` the tests carry still point at them.
      - name: Run from the archive (cargo nextest)
        run: |
          if [ "$KIND" = "ruler" ]; then
            echo "Passo: cargo nextest run --archive-file (só a régua)"
            FILTER="kind(lib) & ${RULER}"
          else
            echo "Passo: cargo nextest run --archive-file (sem a régua, metade $PART de 2)"
            FILTER="not ${RULER}"
          fi
          NEXTEST_RAW="$RUNNER_TEMP/nextest_raw.log"
          START=$(date +%s)
          set +e
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --extract-to . --extract-overwrite \
            --workspace-remap . --profile ci -E "$FILTER" ${PART:+--partition "hash:${PART}/2"} > "$NEXTEST_RAW" 2>&1
          NEXTEST_EXIT=$?
          set -e
          echo "test_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          cat "$NEXTEST_RAW" >> "$RUNNER_TEMP/ci-build.log"
          PUBLIC="$(sed 's/\x1b\[[0-9;]*m//g' "$NEXTEST_RAW" | grep -E '^ *(Finished |Summary \[)' | sed -E 's/^ *//' || true)"
          printf '%s\n' "$PUBLIC"
          # A filter that matches nothing must not pass as a green ruler.
          RAN_OK=true
          if [ "$KIND" = "ruler" ] && ! printf '%s' "$PUBLIC" | grep -qE '\] 1 test run: 1 passed'; then RAN_OK=false; fi
          if [ $NEXTEST_EXIT -eq 0 ] && [ "$RAN_OK" = true ]; then
            echo "Resultado: OK"
          else
            if [ $NEXTEST_EXIT -eq 0 ]; then echo "::error::The ruler filter did not run exactly one test"; fi
            for dir in "${TMPDIR:-}" "${TMP:-}" "${TEMP:-}" /tmp; do
              if [ -n "$dir" ] && [ -f "$dir/parity-tails.log" ]; then
                { echo; echo "--- Telas da régua ($dir/parity-tails.log)"; cat "$dir/parity-tails.log"; } >> "$RUNNER_TEMP/ci-build.log"
                break
              fi
            done
            echo "Resultado: FALHOU"
            [ "$KIND" = "ruler" ] && echo "régua" > "$RUNNER_TEMP/failed_step" || echo "cargo nextest" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Seal the build log
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          FAILED_STEP="passo desconhecido"
          [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
          {
            echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
            echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/sealed.log"
          node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
            "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
          rm -f "$RUNNER_TEMP/sealed.log"
          echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."

      - name: Upload the sealed log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-${{ matrix.kind }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.kind }}-${{ matrix.os }}${{ matrix.part && format('-{0}-2', matrix.part) || '' }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  # Compiles nothing: decrypts the sealed logs and timings into the private ci-logs branch, records one
  # commit status per system (green only when its lint, tests and ruler are), decides the Supabase
  # deploy and keeps one generation of each Rust cache.
  report:
    name: report
    needs: [resolve, lint, tests, from-archive]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      green: ${{ steps.statuses.outputs.green }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-log-crypto.cjs
            .github/scripts/persist-private-log.sh
            .github/scripts/prune-rust-caches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the sealed logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-log-*
          path: ${{ runner.temp }}/sealed

      - name: Store the logs and timings in the private repository
        env:
          CI_LOG_PRIVATE_KEY: ${{ secrets.CI_LOG_PRIVATE_KEY }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/persist-private-log.sh
          shopt -s nullglob
          OUT="$RUNNER_TEMP/plain"
          mkdir -p "$OUT"
          for DIR in "$RUNNER_TEMP"/sealed/ci-log-*; do
            NAME="$(basename "$DIR")"
            NAME="${NAME#ci-log-}"
            [ -f "$DIR/ci-log.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/ci-log.enc.json" "$OUT/$NAME.log" || true
            [ -f "$DIR/timings.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/timings.enc.json" "$OUT/timings-$NAME.html" || true
          done
          for LOG in "$OUT"/*.log; do echo "log completo de $(basename "$LOG" .log): ci-logs/public-actions/${GITHUB_RUN_ID}/$(basename "$LOG")"; done
          persist_private_files "$OUT" "public-actions/${GITHUB_RUN_ID}" "native-ci logs and timings"
          rm -rf "$OUT"

      - name: Record the commit statuses
        id: statuses
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && !inputs.warm_up }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name | test("^(lint|tests|ruler) (macos-15|ubuntu-latest|windows-latest)( [0-9]/[0-9])?$"))
                  | (.name | split(" ")) as $n
                  | [$n[1], ($n[0] + (if $n[2] then " " + $n[2] else "" end)), (.conclusion // "cancelled"), ([.steps[] | select(.conclusion == "failure") | .name][0] // "")] | @tsv' \
            > "$RUNNER_TEMP/jobs.tsv"
          GREEN=true
          for OS in macos-15 ubuntu-latest windows-latest; do
            # A system is green only when its lint, tests (both halves on Windows) and ruler ran and passed.
            TOTAL="$(awk -F'\t' -v os="$OS" '$1 == os' "$RUNNER_TEMP/jobs.tsv" | wc -l | tr -d ' ')"
            PASSED="$(awk -F'\t' -v os="$OS" '$1 == os && $3 == "success"' "$RUNNER_TEMP/jobs.tsv" | wc -l | tr -d ' ')"
            if [ "$TOTAL" -ge 3 ] && [ "$PASSED" = "$TOTAL" ]; then
              STATE=success; DESCRIPTION="native-ci passed"; CONCLUSION=success
            else
              STATE=failure; CONCLUSION=failure; GREEN=false
              DESCRIPTION="$(awk -F'\t' -v os="$OS" '$1 == os && $3 != "success" { printf "%s%s: %s", sep, $2, ($4 != "" ? $4 : $3); sep = "; " }' "$RUNNER_TEMP/jobs.tsv")"
              DESCRIPTION="Failed at ${DESCRIPTION:-a job that did not run}"
            fi
            [ "$OS" = "ubuntu-latest" ] && echo "ubuntu=$CONCLUSION" >> "$GITHUB_OUTPUT"
            echo "$OS: $STATE ${DESCRIPTION}"
            # A run from another branch tests this workflow and leaves the commit's statuses alone.
            [ "$ON_MAIN" = "true" ] || continue
            BODY="$(jq -cn --arg state "$STATE" --arg description "${DESCRIPTION:0:140}" --arg context "native-ci/$OS" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, target_url: $url, description: $description, context: $context}')"
            curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
              -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$BODY" >/dev/null 2>&1 || echo "::warning::Could not record the status of $OS"
          done
          echo "green=$GREEN" >> "$GITHUB_OUTPUT"

      - name: Trigger Supabase deploy
        # Only main deploys; a run from another branch tests this workflow.
        if: github.ref == 'refs/heads/main' && steps.statuses.outputs.ubuntu == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          api() { curl -sf -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${PRIVATE_REPO}/$1"; }
          echo "Verificando se houve alterações em supabase/ desde o último deploy..."
          LAST_DEPLOYED_SHA="$(api "contents/supabase-deployed?ref=ci-logs" 2>/dev/null | jq -r '.content // empty' | base64 -d 2>/dev/null | tr -d ' \n\r' || true)"
          SHOULD_DEPLOY="false"
          if [ -z "$LAST_DEPLOYED_SHA" ]; then
            api "contents/supabase?ref=${SHA}" >/dev/null 2>&1 && SHOULD_DEPLOY="true"
          elif COMPARE="$(api "compare/${LAST_DEPLOYED_SHA}...${SHA}" 2>/dev/null)"; then
            # The compare API lists at most 300 files; a longer diff counts as a change.
            if printf '%s' "$COMPARE" | jq -e '(.files | length) >= 300 or any(.files[]; .filename | startswith("supabase/"))' >/dev/null; then
              SHOULD_DEPLOY="true"
            fi
          else
            SHOULD_DEPLOY="true"
          fi

          if [ "$SHOULD_DEPLOY" = "true" ]; then
            echo "Alterações detectadas em supabase/; disparando supabase-deploy.yml..."
            gh workflow run supabase-deploy.yml -R "$GITHUB_REPOSITORY" -f sha="$SHA" || echo "::warning::Não foi possível disparar supabase-deploy.yml"
          else
            echo "Nenhuma alteração em supabase/ desde $LAST_DEPLOYED_SHA."
          fi

      # The repository has 10 GB of cache. Each Cargo.lock change saved a new generation beside the old
      # one, the total reached 9.9 GB and GitHub evicted caches still in use, so builds started cold.
      - name: Keep one generation of each Rust cache
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-rust-caches.sh

  # The packages build beside lint, tests and ruler (W3). Each secret lives in the job that needs it, and
  # never next to third-party code it does not need: this job compiles ~700 crates with only the
  # read-only deploy key, and its output stays out of the public log.
  #
  # W10 (ADR 0082): one job per system, as Zed's release.yml has one bundle job per target
  # (`bundle_mac_aarch64`, `bundle_linux_x86_64`, `bundle_windows_x86_64`), so the smoke of a system
  # waits only for its own package. With one matrix job every smoke waited for the slowest package: in
  # run 41690859507 the x86_64 Mac package waited 5.1 min for a macOS runner, and the three smokes
  # started at 9.1 min instead of 3.6. The jobs share their steps through YAML anchors. The two Mac
  # targets build in one job, so the run asks for five macOS runners at the start (lint, tests, ruler,
  # this job and the macOS P6), the organization's limit on the Free plan: with a job per Mac target the
  # sixth waited for a free one (run 41714436183: the Apple Silicon package waited 4.8 min, until the
  # lint ended, and the Intel one more than 16 min).
  # The Intel Mac build compiles on Apple Silicon: the macos-15-intel runner took 31 to 45 min for the
  # same build that takes 9 to 16 here, and no step runs the x64 binary on the build machine.
  package-macos:
    name: package ${{ matrix.target }}${{ matrix.second && format(' {0}', matrix.second) || '' }}
    needs: resolve
    if: &package-if needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true' && needs.resolve.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: &read-only
      contents: read
    strategy:
      matrix:
        include:
          # One cache for both Mac targets (`apple-darwin-package`), as the build shares one target/.
          # The sccache folder holds the workspace crates of both targets: at 150 MB the Intel build pushed
          # out the Apple Silicon one, and the Core compiled again (371 s, run 41730877722).
          - { os: macos-15, target: aarch64-apple-darwin, second: x86_64-apple-darwin, cache: apple-darwin, sccache: 300M }
    defaults: &bash
      run:
        shell: bash
    # No XTASK_FREE_DISK: deleting the compiled dependencies before rust-cache saved them left a 173 MB
    # cache, and every release compiled all ~700 crates again.
    env: &package-env
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      APPLE_SIGNING_IDENTITY: "-"
      SHA: ${{ needs.resolve.outputs.sha }}
    steps: &package-steps
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      # W6 (ADR 0082): the three builder files come straight from this commit of the public repository;
      # the checkout action took 6 to 11 s on Windows. The fourth is the basic smoke's (W10).
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem .github/scripts/smoke-measure.py; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      # W6 (ADR 0082): only the pinned toolchain, with the cross target, and the system libraries the
      # image lacks, both installed while the commit is cloned. The checkout is the workspace, so
      # rust-cache reads the pinned rustc too; from a subfolder it read the image's `stable`, and every new
      # stable changed the key.
      - name: Clone the private repository at the commit, Rust toolchain and system libraries
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          TARGETS: ${{ matrix.target }} ${{ matrix.second }}
        run: |
          bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "$TARGETS" \
            libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev dpkg-dev

      # Both Mac targets build on the same runner type, so the target goes into the cache key. The key
      # names the job `package` itself, as it did when the four targets were one matrix job: rust-cache
      # adds the job id to `key` (`v0-rust-<target>-package-<os>-...`), and the new job ids would have
      # missed every cache of main (W4).
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: ${{ matrix.cache || matrix.target }}-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # W8 (ADR 0082): a cache by content (sccache, as Zed's release.yml uses) keeps the workspace crates
      # too, which rust-cache leaves out: a commit that only touches the app takes the Core from it. The
      # cache is a folder on the runner that actions/cache stores whole, one generation per target (the
      # cache guard and report keep only the newest), and `SCCACHE_CACHE_SIZE` bounds it inside the 10 GB.
      - name: Install sccache
        uses: taiki-e/install-action@sccache

      - name: Restore the sccache folder
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ matrix.cache || matrix.target }}-${{ github.run_id }}
          restore-keys: sccache-${{ matrix.cache || matrix.target }}-

      - name: AppImage tool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      # W6: the image has no NSIS, and Chocolatey took about 20 s to install it; its folder is cached.
      - name: Installer tool cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-windows-v1

      - name: Installer tool (Windows)
        if: runner.os == 'Windows'
        run: |
          # Chocolatey's feed fails now and then (504) and still exits 0, so the build ran 20 min
          # to stop at "makensis: program not found". The image may already have NSIS; otherwise
          # retry, and stop here if makensis is still missing.
          NSIS="/c/Program Files (x86)/NSIS"
          for attempt in 1 2 3; do
            [ -x "$NSIS/makensis.exe" ] && break
            choco install nsis -y --no-progress || true
            [ -x "$NSIS/makensis.exe" ] || sleep $((attempt * 20))
          done
          [ -x "$NSIS/makensis.exe" ] || { echo "::error::NSIS (makensis) did not install"; exit 1; }
          "$NSIS/makensis.exe" -VERSION
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Keep the build machine's paths out of the binaries
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          ROOT="$PWD"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT="$(cygpath -w "$ROOT")"
            CARGO_DIR="$(cygpath -w "$CARGO_DIR")"
          fi
          echo "RUSTFLAGS=--remap-path-prefix=${ROOT}=cadente --remap-path-prefix=${CARGO_DIR}=cargo" >> "$GITHUB_ENV"
          if [ "$CACHE_HIT" = "true" ]; then CACHE=inteiro; elif [ -d target ] && [ -n "$(ls -A target 2>/dev/null)" ]; then CACHE=parcial; else CACHE=nenhum; fi
          { echo "cache=$CACHE"; echo "work_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"

      # W10 (ADR 0082): the Mac job builds both Mac targets, Apple Silicon first. Its artifacts go up
      # before the Intel build starts, so the macOS smoke (which waits for the artifact, not for this
      # job) starts as early as with a job of its own. The steps of one target are anchored and run
      # again for the second; a job with one target skips the second pass (`T` empty).
      - name: First target
        env:
          FIRST: ${{ matrix.target }}
        run: echo "T=$FIRST" >> "$GITHUB_ENV"

      # The same build `xtask bundle` starts, with the version it passes, so the bundle finds it done;
      # only here can cargo write the --timings report.
      - &package-build
        name: Build (cargo build --release)
        if: env.T != ''
        env:
          CADENTE_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: ${{ matrix.sccache || vars.SCCACHE_CACHE_SIZE || '2G' }}
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          set -euo pipefail
          echo "Passo: cargo build --release --target $T"
          START=$(date +%s)
          if cargo build --release -p cadente-app -p cadente-launcher --target "$T" --timings >> "$RUNNER_TEMP/release-build.log" 2>&1; then
            BEFORE="$(sed -n 's/^compile_s=//p' "$RUNNER_TEMP/metrics.env" | tail -1)"
            echo "compile_s=$(( ${BEFORE:-0} + $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
            cp target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/timings-$T.html" 2>/dev/null || true
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/release-build.log" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            exit 1
          fi

      # The xtask binary runs directly, not through `cargo xtask` (`cargo run`): cargo run and the rustup proxy
      # change PATH for the process, cc-rs tracks PATH (`rerun-if-env-changed`), and the bundle's own cargo
      # build then recompiled ring and everything above it, the Core included (run 41442022328).
      - &package-bundle
        name: Bundle
        if: env.T != ''
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: ${{ matrix.sccache || vars.SCCACHE_CACHE_SIZE || '2G' }}
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          set -euo pipefail
          echo "Passo: xtask bundle --target $T"
          if cargo build --quiet -p xtask >> "$RUNNER_TEMP/release-build.log" 2>&1 \
            && ./target/debug/xtask bundle --target "$T" >> "$RUNNER_TEMP/release-build.log" 2>&1; then
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/release-build.log" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            exit 1
          fi

      - &package-sign
        name: Ad-hoc signature of the update binary (macOS)
        if: runner.os == 'macOS' && env.T != ''
        run: |
          BIN="target/$T/release/cadente-native-ui"
          codesign --verify "$BIN" 2>/dev/null || codesign --force --sign - "$BIN"

      - &package-dist
        name: Upload the installer
        if: env.T != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.T }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/cadente-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

      # The update payload is packed and signed in `sign`, which holds the release key.
      - &package-bin
        name: Upload the update binary
        if: env.T != ''
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ env.T }}
          path: |
            target/${{ env.T }}/release/cadente-native-ui
            target/${{ env.T }}/release/cadente-native-ui.exe
          if-no-files-found: error
          retention-days: 1

      # W10 (ADR 0082, decisão 1 emendada; Zed's release_nightly.yml publishes with no performance
      # job): the basic smoke runs here, on the runner that built the installer, and holds the beta. The
      # package installs, the launcher finds the Core it ships, and the Core opens, draws, keeps the tray
      # in the menu bar on macOS (D1) and closes (D3), with a short `--measure` and no sessions. The long
      # measurement (P1, P2, P4, P5 and P6) runs in the `perf` jobs, beside and after `publish`, and
      # gives the commit the `native-ci/perf` status that native-promote requires.
      #
      # W6 (ADR 0082): the .deb closure the smoke installs on Linux comes from a cache of this runner
      # image, as the DSH keeps Wine's (`ci-master.yml`, "Install Wine": `--download-only` once, then
      # `dpkg -i` with no repository access). The mirror is the slow part: 73.6 MB at 166 kB/s held this
      # step 7 min 39 s in run 41700377757, and 8 min in run 41448416563.
      - &smoke-debs-key
        name: Cache key of the system packages (Linux)
        id: debs
        if: runner.os == 'Linux'
        run: echo "key=smoke-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - &smoke-debs-restore
        name: Restore the system packages (Linux)
        id: debs-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: ~/smoke-debs
          key: ${{ steps.debs.outputs.key }}

      - &smoke-install
        name: Install the package
        id: install
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)
              hdiutil attach dist/*.dmg -mountpoint /Volumes/CadenteSmoke -nobrowse -quiet
              cp -R /Volumes/CadenteSmoke/Cadente.app "$RUNNER_TEMP/"
              hdiutil detach /Volumes/CadenteSmoke -quiet
              DIR="$RUNNER_TEMP/Cadente.app/Contents/MacOS"
              test -f "$RUNNER_TEMP/Cadente.app/Contents/SharedSupport/baseline_version/metadata.json"
              EXE="" ;;
            Linux)
              # W6: apt only for what the image lacks, and from the cached closure when it is there; if the
              # closure cannot satisfy the package (its dependencies changed), apt installs from the mirror.
              PKGS="xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0"
              DEBS="$HOME/smoke-debs"
              # shellcheck disable=SC2086
              if dpkg -s $PKGS > /dev/null 2>&1 && sudo dpkg -i ./dist/*.deb > /dev/null 2>&1; then
                echo "pacotes do sistema: já na imagem"
              elif compgen -G "$DEBS/*.deb" > /dev/null && sudo DEBIAN_FRONTEND=noninteractive dpkg -i "$DEBS"/*.deb ./dist/*.deb > /dev/null 2>&1; then
                echo "pacotes do sistema: do cache ($(ls "$DEBS" | wc -l) .deb)"
              else
                sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
                sudo apt-get -o Acquire::Retries=3 update
                # shellcheck disable=SC2086
                sudo apt-get -o Acquire::Retries=3 install -y -f --download-only $PKGS ./dist/*.deb
                mkdir -p "$DEBS"
                find /var/cache/apt/archives -maxdepth 1 -name '*.deb' ! -name 'cadente*' -exec cp {} "$DEBS/" \;
                # shellcheck disable=SC2086
                sudo apt-get -o Acquire::Retries=3 install -y -f $PKGS ./dist/*.deb
                echo "pacotes do sistema: do espelho ($(ls "$DEBS" | wc -l) .deb guardados)"
                echo "debs_new=true" >> "$GITHUB_OUTPUT"
              fi
              DIR=/usr/bin
              test -f /usr/lib/Cadente/baseline_version/metadata.json
              EXE="" ;;
            Windows)
              INSTALLER="$(ls dist/cadente-*-windows-x64.exe | head -1)"
              "$INSTALLER" //S
              for _ in $(seq 1 60); do [ -f "$LOCALAPPDATA/Programs/Cadente/cadente-core.exe" ] && break; sleep 2; done
              DIR="$LOCALAPPDATA/Programs/Cadente"
              test -f "$DIR/baseline_version/metadata.json"
              EXE=".exe" ;;
          esac
          test -x "$DIR/cadente$EXE"
          test -x "$DIR/cadente-core$EXE"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      # Saved by main only, once per runner image; the cache guard keeps one generation.
      - &smoke-debs-save
        name: Save the system packages (Linux)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.install.outputs.debs_new == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/smoke-debs
          key: ${{ steps.debs.outputs.key }}

      - &smoke-launcher
        name: The launcher finds the Core it ships
        env:
          DIR: ${{ steps.install.outputs.dir }}
          EXE: ${{ steps.install.outputs.exe }}
          EXPECTED: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          FOUND="$("$DIR/cadente$EXE" --system-install)"
          echo "$FOUND"
          printf '%s' "$FOUND" | grep -q "\"version\":\"$EXPECTED\""

      - &smoke-measure
        name: The Core opens, draws and measures
        env:
          DIR: ${{ steps.install.outputs.dir }}
          EXE: ${{ steps.install.outputs.exe }}
          # The package job has no `part`: there this step is the basic smoke (W10).
          MEASURE: ${{ matrix.measure || '5 60' }}
          P2_MEASURE: ${{ matrix.p2 }}
          TARGET: ${{ matrix.target }}
          PART: ${{ matrix.part || 'basic' }}
        run: |
          set -euo pipefail
          # Only the reports reach stdout. The Core's stderr stays in a file that this public log
          # never prints (xvfb-run would mix it into stdout).
          ERR="$RUNNER_TEMP/core-stderr.log"
          export ERR
          # measure <binary> <output> <home> [beta]: the Core's status. It has $LIMIT s (300), and 20 s to
          # exit once its report is out (D3: it closes). The last beta may not exit on Windows
          # (1.1.0-beta.7 waited forever for its runtime there); for it the report is enough.
          measure() {
            local OUT="$2" STATUS=0 WAITED=0 REPORTED=""
            export OUT CADENTE_HOME="$3"
            # shellcheck disable=SC2086,SC2016
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a -s "-screen 0 1440x900x24" sh -c 'exec "$0" "$@" > "$OUT" 2>> "$ERR"' "$1" --measure $MEASURE &
            else
              "$1" --measure $MEASURE > "$OUT" 2>> "$ERR" &
            fi
            local PID=$!
            while kill -0 "$PID" 2>/dev/null; do
              if [ -z "$REPORTED" ] && grep -q '"states"' "$OUT" 2>/dev/null; then REPORTED=$WAITED; fi
              if [ -n "$REPORTED" ] && [ $((WAITED - REPORTED)) -ge 20 ]; then
                kill "$PID" 2>/dev/null || true
                [ "${4:-}" = beta ] && return 0
                echo "::error::$1 wrote its report and did not exit within 20 s (D3)"
                return 1
              fi
              if [ "$WAITED" -ge "${LIMIT:-300}" ]; then
                kill "$PID" 2>/dev/null || true
                echo "::error::$1 did not finish the measurement within ${LIMIT:-300} s"
                return 1
              fi
              sleep 1
              WAITED=$((WAITED + 1))
            done
            wait "$PID" || STATUS=$?
            return "$STATUS"
          }
          POWER=""
          if [ "$RUNNER_OS" = "macOS" ] && [ "$PART" != basic ]; then
            # P1: the energy of each state, from the kernel's per-task accounting, once a second.
            POWER="$RUNNER_TEMP/power.plist"
            python3 -c 'import time; print(int(time.time() * 1000))' > "$POWER.start"
            sudo powermetrics --samplers tasks --show-process-energy -i 1000 -f plist -o "$POWER" \
              > /dev/null 2> "$RUNNER_TEMP/powermetrics.err" &
          fi
          # `basic` (W10): D1 and D3 only, with no sessions and short idle states, about 30 s.
          STATUS=0
          if [ "$PART" = basic ]; then
            CADENTE_MEASURE_CHATS=0 CADENTE_MEASURE_TERMINALS=0 CADENTE_MEASURE_IDLE_S=2 CADENTE_MEASURE_CLOSED_S=2 \
              CADENTE_MEASURE_MIN_FRAMES=0 CADENTE_MEASURE_WARM_UP=0 LIMIT=180 \
              measure "$DIR/cadente-core$EXE" "$RUNNER_TEMP/measure.out" "$RUNNER_TEMP/cadente-home" || STATUS=$?
          fi
          # `full`: P1, P2, P4 and P5.
          if [ "$PART" = full ]; then
            MEASURE="$P2_MEASURE" LIMIT=420 measure "$DIR/cadente-core$EXE" "$RUNNER_TEMP/measure.out" "$RUNNER_TEMP/cadente-home" || STATUS=$?
          fi
          # `p6`: the last beta and this version alternately (B A A B A B B A), without the sessions of P5,
          # after one discarded round of each (hyperfine's `--warmup 1` in Zed's `tooling/perf`).
          P6_BETA="" P6_NEW=""
          OLD="$(ls "$RUNNER_TEMP"/beta/cadente "$RUNNER_TEMP"/beta/cadente.exe 2>/dev/null | head -1 || true)"
          if [ "$PART" = p6 ] && [ -n "$OLD" ]; then
            chmod +x "$OLD"
            # Both run from the same kind of place and are started once before: the same binary
            # from the installed package and from a copy in the runner's temp folder are not the
            # same first start (Zed's gpui-bench skill: no cold baseline against a warm candidate).
            mkdir -p "$RUNNER_TEMP/new"
            NEW="$RUNNER_TEMP/new/cadente-core$EXE"
            cp "$DIR/cadente-core$EXE" "$NEW"
            # The first start of a binary is cold too (its pages, and Defender's scan on Windows:
            # the beta's first run spent 55 ms/s and the next three 83 to 86, run 41521469409).
            for WARM in "$OLD" "$NEW"; do
              CADENTE_HOME="$RUNNER_TEMP/home-warm" "$WARM" --dump-plugins > /dev/null 2>> "$ERR" || true
            done
            export CADENTE_MEASURE_CHATS=0 CADENTE_MEASURE_TERMINALS=0 CADENTE_MEASURE_CLOSED_S=10 CADENTE_MEASURE_MIN_FRAMES=0 CADENTE_MEASURE_WARM_UP=0
            for RUN in warm-beta warm-new beta-1 new-1 new-2 beta-2 new-3 beta-3 beta-4 new-4; do
              OUT="$RUNNER_TEMP/p6-$RUN.out"
              case "$RUN" in
                warm-beta) measure "$OLD" "$OUT" "$RUNNER_TEMP/home-$RUN" beta || echo "::warning::the last beta's warm-up round did not finish" ;;
                warm-new) measure "$NEW" "$OUT" "$RUNNER_TEMP/home-$RUN" || STATUS=$? ;;
                beta-*) measure "$OLD" "$OUT" "$RUNNER_TEMP/home-$RUN" beta || echo "::warning::the last beta's run $RUN did not finish"
                  P6_BETA="$P6_BETA,$OUT" ;;
                new-*) measure "$NEW" "$OUT" "$RUNNER_TEMP/home-$RUN" || STATUS=$?
                  P6_NEW="$P6_NEW,$OUT" ;;
              esac
            done
            unset CADENTE_MEASURE_CHATS CADENTE_MEASURE_TERMINALS CADENTE_MEASURE_CLOSED_S CADENTE_MEASURE_MIN_FRAMES CADENTE_MEASURE_WARM_UP
          fi
          export P6_BETA P6_NEW SMOKE_PART="$PART"
          if [ -n "$POWER" ]; then
            sudo pkill -INT powermetrics || true
            sleep 2
            echo "powermetrics: $(wc -c < "$POWER" 2>/dev/null || echo 0) bytes"
            head -c 600 "$RUNNER_TEMP/powermetrics.err" || true
          fi
          if [ "$PART" != p6 ]; then
            echo "esta versão, rodada ${PART}:"
            cat "$RUNNER_TEMP/measure.out"
          fi
          for FILE in ${P6_BETA//,/ } ${P6_NEW//,/ }; do echo "$(basename "$FILE"):"; tail -1 "$FILE" || true; done
          RESULT=0
          python3 "$RUNNER_TEMP/scripts/smoke-measure.py" "$RUNNER_TEMP/measure.out" "$RUNNER_TEMP/measure.json" "$TARGET" \
            "$POWER" || RESULT=$?
          [ "$STATUS" = 0 ] || { echo "::error::the Core exited with $STATUS"; exit "$STATUS"; }
          exit "$RESULT"

      - &smoke-upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}-${{ matrix.part || 'basic' }}
          path: ${{ runner.temp }}/measure.json
          if-no-files-found: ignore

      # The installer of the first target leaves dist/, so the second upload holds only its own.
      - name: Second target
        env:
          SECOND: ${{ matrix.second }}
        run: |
          if [ -n "$SECOND" ]; then mkdir -p "$RUNNER_TEMP/dist-done" && mv dist/* "$RUNNER_TEMP/dist-done/"; fi
          echo "T=$SECOND" >> "$GITHUB_ENV"

      - *package-build
      - *package-bundle
      - *package-sign
      - *package-dist
      - *package-bin

      # Hit and miss counts only; the names of what compiled stay in the sealed timings.
      - name: sccache counts
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: |
          STATS="$(sccache --show-stats --stats-format json 2>/dev/null || echo '{}')"
          HITS="$(printf '%s' "$STATS" | jq -r '[.stats.cache_hits.counts // {} | .[]] | add // 0')"
          MISSES="$(printf '%s' "$STATS" | jq -r '[.stats.cache_misses.counts // {} | .[]] | add // 0')"
          SIZE="$(du -sm "$SCCACHE_DIR" 2>/dev/null | cut -f1)"
          echo "sccache: ${HITS} acertos, ${MISSES} faltas, ${SIZE:-0} MB na pasta"
          { echo "sccache_hits=$HITS"; echo "sccache_misses=$MISSES"; echo "sccache_mb=${SIZE:-0}"; } >> "$RUNNER_TEMP/metrics.env"
          sccache --stop-server > /dev/null 2>&1 || true

      # Saved only when the repository variable SCCACHE_SAVE is "true": the 10 GB hold one generation of the
      # ten rust-cache kinds (about 8.9 GB) and little more, so the folder size is measured first (W1).
      - name: Save the sccache folder
        if: github.ref == 'refs/heads/main' && vars.SCCACHE_SAVE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ matrix.cache || matrix.target }}-${{ github.run_id }}

      - name: Seal the build log and the timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          # The timings of the first target (the Apple Silicon build in the Mac job).
          if [ -f "$RUNNER_TEMP/timings-${{ matrix.target }}.html" ]; then
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/timings-${{ matrix.target }}.html" "$RUNNER_TEMP/sealed/timings.enc.json" || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            {
              echo "native-ci package ${{ matrix.target }} ${SHA}"
              echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat "$RUNNER_TEMP/release-build.log" 2>/dev/null || true
              # The basic smoke's Core stderr (W10), never printed in this public log.
              if [ -s "$RUNNER_TEMP/core-stderr.log" ]; then echo; echo "== core stderr (smoke básico)"; cat "$RUNNER_TEMP/core-stderr.log"; fi
            } > "$RUNNER_TEMP/sealed.log"
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
            rm -f "$RUNNER_TEMP/sealed.log"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-log-${{ matrix.target }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-package-${{ matrix.target }}${{ matrix.second && format('-{0}', matrix.second) || '' }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  package-linux:
    name: package ${{ matrix.target }}${{ matrix.second && format(' {0}', matrix.second) || '' }}
    needs: resolve
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: *read-only
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, second: "", cache: "", sccache: "" }
    defaults: *bash
    env: *package-env
    steps: *package-steps

  package-windows:
    name: package ${{ matrix.target }}${{ matrix.second && format(' {0}', matrix.second) || '' }}
    needs: resolve
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: *read-only
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, second: "", cache: "", sccache: "" }
    defaults: *bash
    env: *package-env
    steps: *package-steps

  smoke-macos:
    # D3 and D4 (ADR 0076), Phase P (ADR 0081 §3.5): on each system the package installs, the
    # launcher finds the Core it ships, and the Core opens, draws and measures (`--measure`): the
    # script of ADR 0078 §2.9, the idle open window, 100 Chats and 20 terminals opened and closed,
    # and 60 s with the window destroyed. Frames, CPU, wake-ups, memory and, on macOS, the energy
    # of powermetrics go to the job summary; the job fails on P4, P5 and P6. P6 measures the last
    # published beta and this version alternately on one runner: two hosted runners differ by more
    # than 10% (the script's CPU on Linux went from 390 to 620 ms/s between two runs of the same code).
    #
    # W10 (ADR 0082): two jobs per system, side by side. `full` is the full run (P1, P2, P4 and P5);
    # `p6` the rounds of P6, the last beta and this version on the same runner. In one job the two
    # took 13.9 min on macOS (4.7 of the full run, 9.2 of P6, run 41690859507), the longest step of
    # the run. In its own job P6 no longer has the full run before it to warm the runner, so each
    # binary runs one discarded round first, as Zed's `tooling/perf` profiles with hyperfine
    # `--warmup 1` (`hyp_profile`) and `triage_test` skips a test's first loop. Each smoke waits only
    # for the package of its own target.
    #
    # W10, decisão 1 emendada (ADR 0082 §7): these jobs no longer hold `publish`, as Zed's nightly
    # leaves `tooling/perf` out of the release. They measure the same as before, with the same rounds and
    # limits; `perf` turns their result into the commit's `native-ci/perf`, which native-promote requires
    # before a stable. The basic smoke that holds the beta runs in the package job.
    name: perf ${{ matrix.target }} ${{ matrix.part }}
    needs: [resolve, package-macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions: &smoke-permissions
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          # `measure`: the P6 runs; `p2`: the full run, whose counted script also runs until it drew
          # 500 frames (at most 90 s), after an uncounted warm-up (Zed's `tooling/perf`).
          - { part: full, os: macos-15, target: aarch64-apple-darwin, measure: "30 120", p2: "30 120", payload: darwin-aarch64.tar.gz }
    defaults: *bash
    steps: &smoke-steps
      # A job that starts before its package (the macOS P6) waits here for the package's artifact; a job
      # that needs the package finds it at once. A package that failed ends the wait.
      - name: Wait for the package of this target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            FOUND="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=dist-${TARGET}" --jq '.total_count' 2>/dev/null || echo 0)"
            [ "${FOUND:-0}" -gt 0 ] && exit 0
            ENDED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq "[.jobs[] | select((.name | startswith(\"package \")) and (.name | split(\" \") | index(\"${TARGET}\") != null) and .status == \"completed\") | .conclusion][0] // empty" 2>/dev/null || true)"
            if [ -n "$ENDED" ] && [ "$ENDED" != success ]; then echo "::error::package ${TARGET} ended ${ENDED}"; exit 1; fi
            sleep 10
          done
          echo "::error::package ${TARGET} did not upload its artifact within 40 min"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist

      - name: Stage the measurement script and the last beta
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PAYLOAD: ${{ matrix.payload }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts" "$RUNNER_TEMP/beta"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/smoke-measure.py" "$BASE/.github/scripts/smoke-measure.py"
          [ "$PART" = p6 ] || exit 0
          # The newest published release other than this version: the app payload the launcher installs.
          TAG="$(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --exclude-drafts --json tagName \
            --jq "[.[].tagName | select(. != \"v${VERSION}\")][0] // empty")"
          if [ -n "$TAG" ] && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "cadente-${TAG#v}-${PAYLOAD}" -D "$RUNNER_TEMP/beta"; then
            cd "$RUNNER_TEMP/beta"
            case "$PAYLOAD" in *.zip) unzip -oq ./*.zip ;; *) tar xzf ./*.tar.gz ;; esac
            echo "última beta: $TAG"; ls
          else
            echo "nenhuma beta para comparar"
          fi

      - *smoke-debs-key
      - *smoke-debs-restore
      - *smoke-install
      - *smoke-debs-save
      - *smoke-launcher
      - *smoke-measure
      - *smoke-upload

  # W10 (ADR 0082): the macOS P6 asks for its runner when the run starts and waits for the package
  # there. A macOS arm64 runner often comes only after 5 or 10 minutes ("Due to capacity constraints,
  # jobs targeting macOS arm64 runners may experience longer queue times"): the P6, the longest job,
  # waited 5.2 min after its package in run 41690859507 and 5.0 min in run 41706787306. Asked for at
  # the start, that wait runs beside the package build. The runner waits idle for about 3 minutes, at
  # no cost; the Linux and Windows runners come at once and wait for their package as before.
  smoke-macos-p6:
    name: perf ${{ matrix.target }} ${{ matrix.part }}
    needs: resolve
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: *smoke-permissions
    strategy:
      matrix:
        include:
          - { part: p6, os: macos-15, target: aarch64-apple-darwin, measure: "30 120", p2: "30 120", payload: darwin-aarch64.tar.gz }
    defaults: *bash
    steps: *smoke-steps

  smoke-linux:
    name: perf ${{ matrix.target }} ${{ matrix.part }}
    needs: [resolve, package-linux]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions: *smoke-permissions
    strategy:
      fail-fast: false
      matrix:
        part: &smoke-parts [full, p6]
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, measure: "5 60", p2: "30 60", payload: linux-x86_64.tar.gz }
    defaults: *bash
    steps: *smoke-steps

  smoke-windows:
    name: perf ${{ matrix.target }} ${{ matrix.part }}
    needs: [resolve, package-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions: *smoke-permissions
    strategy:
      fail-fast: false
      matrix:
        part: *smoke-parts
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, measure: "5 60", p2: "30 60", payload: windows-x86_64.zip }
    defaults: *bash
    steps: *smoke-steps

  sign:
    # Holds the release key. Compiles only xtask (no third-party action, no shared cache) and packs
    # the update payloads from the binaries the package jobs built. It runs beside the long measurement,
    # which `publish` does not wait for (W10).
    name: sign the payloads and the feed
    needs: [resolve, package-macos, package-linux, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/clone-private.sh
          sparse-checkout-cone-mode: false
          path: _builder
          persist-credentials: false

      - name: Clone the private repository for the packaging tool
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
        run: |
          cp _builder/.github/scripts/clone-private.sh "$RUNNER_TEMP/clone-private.sh"
          rm -rf _builder
          bash "$RUNNER_TEMP/clone-private.sh" src "${{ needs.resolve.outputs.sha }}"

      # Optimized: signing runs minisign's scrypt and the best gzip level once per payload, and the
      # unoptimized build spent 149 s there (run 41396863235) on the release's critical path.
      - name: Build the packaging tool
        working-directory: src
        run: |
          rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" > /dev/null 2>&1
          cargo build --quiet --locked --release -p xtask > "$RUNNER_TEMP/xtask-build.log" 2>&1 || { echo "::error::xtask did not build"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins

      - name: Sign the update payloads and the feed
        working-directory: src
        env:
          CADENTE_RELEASE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            mkdir -p "target/$TARGET/release"
            cp ../bins/bin-$TARGET/* "target/$TARGET/release/"
            # Artifacts drop the executable bit, and the tar of the payload records it.
            chmod +x target/$TARGET/release/cadente-native-ui*
            ./target/release/xtask payload --target "$TARGET"
          done
          ./target/release/xtask feed "$RELEASE_CHANNEL" dist/descriptor-*.json

      - name: Release notes
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "Cadente ${RELEASE_VERSION}"
            echo
            if [ -f src/docs/release/notes.md ]; then sed '1d' src/docs/release/notes.md; fi
            echo
            echo "commit: ${SHA}"
            echo
            echo "---"
            echo "*Built via Secure Public Builder*"
          } > src/dist/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: |
            src/dist/cadente-*.tar.gz
            src/dist/cadente-*.zip
            src/dist/*.minisig
            src/dist/feeds/
            src/dist/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    # Holds the release token and compiles nothing. It runs only when the three systems are green
    # (`report`), the packages passed the basic smoke and the payloads are signed. Only a run from main
    # publishes; on another branch this job lists what it would publish.
    name: publish
    # W10: the basic smoke ran in each package job, which `sign` needs; the long measurement does not hold it.
    needs: [resolve, report, sign]
    if: needs.report.outputs.green == 'true' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed

      - name: Checksums
        run: |
          set -euo pipefail
          mv signed/release-notes.md release-notes.md
          mv signed/feeds feeds
          mv signed/* dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: What a main run would publish
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Ensaio: um run de main publicaria v${RELEASE_VERSION} (${RELEASE_CHANNEL}) com:"
          ls -1 dist feeds

      - name: Create the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          if [ "$RELEASE_CHANNEL" = "stable" ]; then FLAGS="--latest"; else FLAGS="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cadente v${RELEASE_VERSION}" \
            --notes-file release-notes.md $FLAGS dist/*

      - name: Publish the feed on the site
        id: feed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cd site
          mkdir -p public/feeds
          cp ../feeds/* public/feeds/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feeds
          git commit -m "chore: publish ${RELEASE_CHANNEL} feed for v${RELEASE_VERSION}" || echo "No changes"
          # The site branch moves while a run lasts (a push of this workflow, another feed): rebase first.
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done
          # While no stable is out, the newest beta is what the site and Homebrew offer.
          STABLE_RELEASES="$(jq '.releases | length' public/feeds/stable.json 2>/dev/null || echo 0)"
          echo "stable_empty=$([ "$STABLE_RELEASES" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        if: github.ref == 'refs/heads/main' && (needs.resolve.outputs.channel == 'stable' || steps.feed.outputs.stable_empty == 'true')
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/cadente-hub/homebrew-apps.git" homebrew-repo
          cd homebrew-repo
          ARM64_SHA=$(sha256sum ../dist/cadente-${RELEASE_VERSION}-macos-arm64.dmg | awk '{print $1}')
          X64_SHA=$(sha256sum ../dist/cadente-${RELEASE_VERSION}-macos-x64.dmg | awk '{print $1}')
          cat > Casks/cadente.rb <<RUBY
          cask "cadente" do
            version "${RELEASE_VERSION}"

            if Hardware::CPU.arm?
              url "https://github.com/cadente-hub/cadente-hub.github.io/releases/download/v#{version}/cadente-#{version}-macos-arm64.dmg"
              sha256 "${ARM64_SHA}"
            else
              url "https://github.com/cadente-hub/cadente-hub.github.io/releases/download/v#{version}/cadente-#{version}-macos-x64.dmg"
              sha256 "${X64_SHA}"
            end

            name "Cadente"
            desc "AI-powered desktop assistant — chat, terminal, Git and more"
            homepage "https://cadente-hub.github.io"

            auto_updates true
            depends_on macos: ">= :big_sur"

            app "Cadente.app"

            # Unsigned app: drop the quarantine flag and sign ad-hoc so it opens without the "is damaged" error.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Cadente.app"],
                             sudo: true
              system_command "/usr/bin/codesign",
                             args: ["--force", "--deep", "--sign", "-", "#{appdir}/Cadente.app"],
                             sudo: true
            end

            zap trash: [
              "~/Library/Application Support/com.cadente.app",
              "~/Library/Caches/com.cadente.app",
              "~/Library/Preferences/com.cadente.app.plist",
              "~/Library/Saved Application State/com.cadente.app.savedState",
            ]
          end
          RUBY
          sed -i 's/^          //' Casks/cadente.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cadente.rb
          git diff --cached --quiet && { echo "No cask changes"; exit 0; }
          git commit -m "chore: bump cadente to v${RELEASE_VERSION}"
          git push

  # W10, decisão 1 emendada (ADR 0082 §7): the verdict of the long measurement, P1, P2, P4, P5 and P6 on
  # the three systems, as the commit status `native-ci/perf`. It holds nothing in this run; native-promote
  # refuses a beta whose commit lacks it green, so the measurement gates the stable channel, as Zed's stable
  # follows its nightly. Compiles nothing.
  perf:
    name: perf
    needs: [resolve, smoke-macos, smoke-macos-p6, smoke-linux, smoke-windows]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true' && needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record native-ci/perf
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && !inputs.warm_up }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name | startswith("perf ")) | [.name, (.conclusion // "cancelled")] | @tsv' \
            > "$RUNNER_TEMP/perf.tsv"
          # Six jobs: the full run and P6 on each system. One that did not run or did not pass fails the status.
          TOTAL="$(wc -l < "$RUNNER_TEMP/perf.tsv" | tr -d ' ')"
          PASSED="$(awk -F'\t' '$2 == "success"' "$RUNNER_TEMP/perf.tsv" | wc -l | tr -d ' ')"
          if [ "$TOTAL" = 6 ] && [ "$PASSED" = 6 ]; then
            STATE=success; DESCRIPTION="P1, P2, P4, P5 e P6 nos três sistemas"
          else
            STATE=failure
            DESCRIPTION="reprovou: $(awk -F'\t' '$2 != "success" { printf "%s%s (%s)", sep, $1, $2; sep = ", " }' "$RUNNER_TEMP/perf.tsv")"
            [ "$TOTAL" = 6 ] || DESCRIPTION="${DESCRIPTION}; ${TOTAL} de 6 jobs"
          fi
          {
            echo "## native-ci/perf: ${STATE}"
            echo
            echo "A medição longa não segura o beta; a promoção para a estável exige este status verde (ADR 0082 §7)."
            echo
            echo "| Job | Resultado |"
            echo "|---|---|"
            awk -F'\t' '{ printf "| %s | %s |\n", $1, $2 }' "$RUNNER_TEMP/perf.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ON_MAIN" != "true" ]; then
            echo "Ensaio: um run de main gravaria native-ci/perf=${STATE} (${DESCRIPTION}) em ${SHA}."
            exit 0
          fi
          BODY="$(jq -cn --arg state "$STATE" --arg description "${DESCRIPTION:0:140}" --arg context "native-ci/perf" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, target_url: $url, description: $description, context: $context}')"
          curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" -H "Accept: application/vnd.github+json" \
            -d "$BODY" > /dev/null
          echo "native-ci/perf: ${STATE} (${DESCRIPTION})"

  # W1 (ADR 0082): compiles nothing. Stores the package logs and timings in the private ci-logs branch,
  # writes the run summary (duration, preparation, cache, compile and test time of each job) and keeps
  # one line per main run there, from which it takes the p50 and p90 of the last 20 runs.
  summary:
    name: summary
    needs: [resolve, lint, tests, from-archive, report, package-macos, package-linux, package-windows, smoke-macos, smoke-macos-p6, smoke-linux, smoke-windows, sign, publish, perf]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-log-crypto.cjs
            .github/scripts/persist-private-log.sh
            .github/scripts/ci-summary.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The metrics are optional: a slow artifact service (180 s in run 41472042526) must not hold the run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          pattern: release-log-*
          path: ${{ runner.temp }}/sealed

      - uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          pattern: metrics-*
          path: ${{ runner.temp }}/metrics

      - name: Store the package logs and timings in the private repository
        env:
          CI_LOG_PRIVATE_KEY: ${{ secrets.CI_LOG_PRIVATE_KEY }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/persist-private-log.sh
          shopt -s nullglob
          OUT="$RUNNER_TEMP/plain"
          mkdir -p "$OUT"
          for DIR in "$RUNNER_TEMP"/sealed/release-log-*; do
            TARGET="$(basename "$DIR")"
            TARGET="${TARGET#release-log-}"
            [ -f "$DIR/ci-log.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/ci-log.enc.json" "$OUT/release-$TARGET.log" || true
            [ -f "$DIR/timings.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/timings.enc.json" "$OUT/timings-release-$TARGET.html" || true
          done
          for LOG in "$OUT"/*.log; do echo "log completo de $(basename "$LOG" .log): ci-logs/public-actions/${GITHUB_RUN_ID}/$(basename "$LOG")"; done
          persist_private_files "$OUT" "public-actions/${GITHUB_RUN_ID}" "native-ci package logs and timings"
          rm -rf "$OUT"

      - name: Run summary
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          COMPILED: ${{ needs.resolve.outputs.docs_only != 'true' }}
          TOOLCHAIN_CHANGED: ${{ needs.resolve.outputs.toolchain_changed }}
          # A warm-up run measures nothing a commit would see.
          RECORD_HISTORY: ${{ github.ref == 'refs/heads/main' && !inputs.warm_up }}
          METRICS_DIR: ${{ runner.temp }}/metrics
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_LOG_TOKEN}"
          HISTORY_DIR="$RUNNER_TEMP/history"
          # Only metrics/: the branch also keeps every sealed log and timings report.
          { git clone --depth=1 --filter=blob:none --sparse --branch ci-logs "https://x-access-token:${PRIVATE_LOG_TOKEN}@github.com/${PRIVATE_REPO}.git" "$HISTORY_DIR" \
            && git -C "$HISTORY_DIR" sparse-checkout set metrics; } >/dev/null 2>&1 || HISTORY_DIR=""
          export HISTORY_DIR
          bash .github/scripts/ci-summary.sh > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/summary.md"
          if [ "$RECORD_HISTORY" = "true" ] && [ -n "$HISTORY_DIR" ]; then
            git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
            git -C "$HISTORY_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5; do
              git -C "$HISTORY_DIR" add metrics/runs.tsv
              git -C "$HISTORY_DIR" commit -m "ci: record native-ci run ${GITHUB_RUN_ID}" >/dev/null 2>&1 || break
              git -C "$HISTORY_DIR" push origin ci-logs >/dev/null 2>&1 && break
              LINE="$(tail -1 "$HISTORY_DIR/metrics/runs.tsv")"
              git -C "$HISTORY_DIR" fetch --depth=1 origin ci-logs >/dev/null 2>&1 || true
              git -C "$HISTORY_DIR" reset --hard origin/ci-logs >/dev/null 2>&1 || true
              mkdir -p "$HISTORY_DIR/metrics"
              printf '%s\n' "$LINE" >> "$HISTORY_DIR/metrics/runs.tsv"
              sleep "$attempt"
            done
          fi
