name: native-ci
run-name: native-ci ${{ inputs.sha }}${{ inputs.channel == 'stable' && ' stable' || '' }}

# One run per commit of the private main (ADR 0082 W3): lint, tests and the ruler on the three systems,
# and beside them the packages. `publish` waits for the three systems green, the basic smoke and the
# signature, so a beta leaves the same run that proved its commit. The stable channel comes from
# native-promote through native-release, which dispatches this workflow with `channel: stable`.
# The long measurement (P1, P2, P4, P5 and P6) runs beside and after `publish` and gives the commit
# `native-ci/perf`, which native-promote requires (W10, ADR 0082 §7, as Zed's nightly leaves perf out).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Private repo commit SHA (40 hex)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: false
        default: beta
        type: choice
        options: [beta, stable]
      force_build:
        description: "Branch runs only: compile even when the commit only changes documents"
        required: false
        default: false
        type: boolean
      plant_failure:
        description: "Branch runs only: add a failing test, to prove that publish waits for green"
        required: false
        default: false
        type: boolean
      lock_update:
        description: "Branch runs only (W4 proof): change one dependency of Cargo.lock in the tests job, as name@version"
        required: false
        default: ""
        type: string
      plant_size:
        description: "Branch runs only (O1 proof): break R5 or R6 in the Linux lint"
        required: false
        default: none
        type: choice
        options: [none, new-file-401, above-ceiling, copied-block]
      stress_filter:
        description: "Y6 (ADR 0091): a nextest filter of the tests this commit touched, run 20 times on Linux (`--stress-count 20`, at most 60 s); empty = no stress run"
        required: false
        default: ""
        type: string
      only:
        description: "Y1 (ADR 0091): `lint` runs only the lint job (and windows_filter) on `preflight/<sha>` of the private repository, with no status, no package and no release"
        required: false
        default: ""
        type: string
      windows_filter:
        description: "Y1, only=lint: a nextest filter run on Windows when the diff builds path text by hand (T7); empty = none"
        required: false
        default: ""
        type: string
      warm_up:
        description: "Compile every job and save the caches, publish nothing (after a change of cache key)"
        required: false
        default: false
        type: boolean
  # Safety net for a push that dispatched no run: every 3 hours, and only for a HEAD no run has seen.
  schedule:
    - cron: '0 */3 * * *'

# One group per commit, as Zed's run_tests.yml does on main (`github.sha` in the group): every commit of the
# private main has its own run, in parallel, and none cancels or waits for another. A shared group holds one
# running and one pending run, and a third push cancelled the pending one, so a busy main never got a beta.
# The beta number is the commit count of the SHA (unique and growing along main) and `publish` never moves
# the feed backwards, so runs may finish in any order. Only a second dispatch of the same SHA queues behind
# the first. The schedule has no SHA: it gets its own group per run.
concurrency:
  group: native-ci-${{ github.ref }}-${{ inputs.only == 'lint' && 'preflight-' || '' }}${{ inputs.sha || github.run_id }}
  cancel-in-progress: false

# The lint, tests, ruler and package jobs compile hundreds of third-party crates, and a build script can
# read every secret its job references. So they hold only the read-only deploy key and print no compiler
# or test output: the full log leaves them encrypted. `resolve`, `report` and `summary` compile nothing;
# only they write to the private repository. `sign` holds only the release key and compiles only xtask;
# `publish` holds only the release token and compiles nothing.
permissions:
  contents: read

env:
  PRIVATE_REPO: jeancatarina/catarina-claude
  # The v4 parity ruler drives three live windows and takes every test thread for 100 to 190 s, so it
  # runs in a job of its own: there it no longer holds back the other 2000 tests, and it reports first.
  RULER: test(=live::parity::v4_parity_actions_only_shrink_the_pending_list)

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve_sha.outputs.sha }}
      skip: ${{ steps.resolve_sha.outputs.skip }}
      channel: ${{ steps.resolve_sha.outputs.channel }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      lint_only: ${{ steps.resolve_sha.outputs.lint_only }}
      base: ${{ steps.changes.outputs.base }}
      toolchain_changed: ${{ steps.changes.outputs.toolchain_changed }}
      toolchain: ${{ steps.changes.outputs.toolchain }}
      release: ${{ steps.version.outputs.release }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      delta_packages: ${{ steps.test_plan.outputs.delta_packages }}
      base_run_id: ${{ steps.test_plan.outputs.base_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-scripts
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve and validate SHA
        id: resolve_sha
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_ONLY: ${{ inputs.only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          CHANNEL="${INPUT_CHANNEL:-beta}"
          case "$CHANNEL" in beta|stable) ;; *) echo "::error::Unknown channel: $CHANNEL"; exit 1 ;; esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$INPUT_SHA"
          else
            # schedule trigger: resolve HEAD of private main
            SHA=$(git ls-remote "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" refs/heads/main | awk '{print $1}')
            if [ -z "$SHA" ]; then
              echo "::error::Could not resolve main HEAD for ${PRIVATE_REPO}"
              exit 1
            fi
            # A commit any run already took (green, red or still running) has native-ci statuses. A red
            # one is not run again: a failure is fixed by a new commit, never retried (ADR 0076 R2), and
            # rerunning it every hour held the queue in front of the next push.
            SEEN=$(curl -sf "https://api.github.com/repos/${PRIVATE_REPO}/commits/${SHA}/statuses?per_page=100" \
              -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" 2>/dev/null \
              | jq '[.[] | select(.context | startswith("native-ci/"))] | length' 2>/dev/null || echo 0)
            if [ "${SEEN:-0}" -gt 0 ]; then
              echo "SHA $SHA already has a native-ci run. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid SHA format (must be 40 hex digits): $SHA"
            exit 1
          fi

          # The clone stays for the next steps; it has every commit and tree, and the blobs of $SHA.
          # Y13 (ADR 0091): a refused or dropped connection is not the commit's fault: three tries.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/private"
            git clone --filter=blob:none "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" "$RUNNER_TEMP/private" >/dev/null 2>&1 && break
            if [ "$attempt" = 3 ]; then echo "::error::Could not clone the private repository after 3 attempts"; exit 1; fi
            sleep $((attempt * 5))
          done
          cd "$RUNNER_TEMP/private"
          git checkout "$SHA" >/dev/null 2>&1
          # Y1 (ADR 0091): `only=lint` takes a commit that is the tip of `preflight/<sha>` and not yet on
          # main; it runs the lint and writes nothing to the private repository.
          LINT_ONLY=false
          case "${INPUT_ONLY:-}" in
            "") ;;
            lint)
              LINT_ONLY=true
              TIP="$(git rev-parse "refs/remotes/origin/preflight/${SHA}" 2>/dev/null || true)"
              if [ "$TIP" != "$SHA" ]; then
                echo "::error::only=lint needs the branch preflight/${SHA} at ${SHA}."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown only: ${INPUT_ONLY}"; exit 1 ;;
          esac
          if [ "$LINT_ONLY" = false ] && ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::SHA $SHA is not an ancestor of main."
            exit 1
          fi
          echo "lint_only=$LINT_ONLY" >> "$GITHUB_OUTPUT"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # W2 (ADR 0082): the diff from the last ancestor with the three statuses green. When it touches
      # only docs/ (but docs/conformance/, which a launcher test reads), design/, .claude/ (the agents'
      # skills and their scripts, which cargo never reads) or the root .md files,
      # and no include_str!, include_bytes! or rerun-if-changed names a changed file, nothing compiles
      # and no beta leaves. Warp's ci.yml (`needs-build` of dorny/paths-filter) and Zed's run_tests.yml
      # (`orchestrate`) skip the same way, listing the documents they know.
      - name: Changes since the last green commit
        id: changes
        if: steps.resolve_sha.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/private
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          CHANNEL: ${{ steps.resolve_sha.outputs.channel }}
          # A warm-up run compiles whatever the commit changed: it exists to save the caches.
          FORCE_BUILD: ${{ (github.ref != 'refs/heads/main' && inputs.force_build) || inputs.warm_up || inputs.only == 'lint' }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          BASE=""
          for C in $(git rev-list --first-parent --max-count=40 "${SHA}^" 2>/dev/null); do
            GREEN="$(curl -sf "https://api.github.com/repos/${PRIVATE_REPO}/commits/${C}/status?per_page=100" \
              -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" 2>/dev/null \
              | jq '[.statuses[] | select(.state == "success" and (.context == "native-ci/macos-15" or .context == "native-ci/ubuntu-latest" or .context == "native-ci/windows-latest"))] | length' 2>/dev/null || echo 0)"
            if [ "${GREEN:-0}" = 3 ]; then BASE="$C"; break; fi
          done
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # W1: the run after a change of the pinned Rust rebuilds everything and stays out of the p90.
          PREVIOUS="${BASE:-$(git rev-parse "${SHA}^" 2>/dev/null || true)}"
          TOOLCHAIN_CHANGED=false
          if [ -n "$PREVIOUS" ] && [ "$(git rev-parse "${PREVIOUS}:rust-toolchain.toml" 2>/dev/null)" != "$(git rev-parse "${SHA}:rust-toolchain.toml")" ]; then
            TOOLCHAIN_CHANGED=true
          fi
          echo "toolchain_changed=$TOOLCHAIN_CHANGED" >> "$GITHUB_OUTPUT"
          # W6: the jobs that compile install this channel while they clone.
          echo "toolchain=$(git show "${SHA}:rust-toolchain.toml" | sed -n 's/^channel = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"

          DOCS_ONLY=false
          if [ "$CHANNEL" = "beta" ] && [ -n "$BASE" ] && [ "$FORCE_BUILD" != "true" ]; then
            CHANGED="$(git diff --no-renames --name-only "$BASE" "$SHA")"
            CODE="$(printf '%s\n' "$CHANGED" | grep -vE '^(docs/|design/|\.claude/|[^/]+\.md$)' | grep -c . || true)"
            CONFORMANCE="$(printf '%s\n' "$CHANGED" | grep -c '^docs/conformance/' || true)"
            if [ -n "$CHANGED" ] && [ "$CODE" = 0 ] && [ "$CONFORMANCE" = 0 ]; then
              READS="$(grep -rhE --include='*.rs' 'include_(str|bytes)!|rerun-if-changed' . 2>/dev/null || true)"
              READ_BY_BUILD=""
              while IFS= read -r FILE; do
                if printf '%s' "$READS" | grep -qF "$FILE"; then READ_BY_BUILD="$FILE"; break; fi
              done <<< "$CHANGED"
              if [ -z "$READ_BY_BUILD" ]; then
                DOCS_ONLY=true
              else
                echo "A document changed here is read by the build; compiling."
              fi
            fi
            echo "$(printf '%s\n' "$CHANGED" | grep -c . || true) files changed since ${BASE:0:12}; documents only: $DOCS_ONLY"
          else
            echo "Compiling: channel $CHANNEL, last green ancestor '${BASE:0:12}', force_build '$FORCE_BUILD'."
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

      - name: Mark a toolchain change
        if: steps.changes.outputs.toolchain_changed == 'true'
        run: echo "::notice::rust-toolchain.toml changed; this run rebuilds everything and stays out of the p90 (ADR 0082, decisão 3)."

      - name: Number the release
        id: version
        if: steps.resolve_sha.outputs.skip == 'false' && steps.changes.outputs.docs_only != 'true' && inputs.only != 'lint'
        working-directory: ${{ runner.temp }}/private
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          CHANNEL: ${{ steps.resolve_sha.outputs.channel }}
          WARM_UP: ${{ inputs.warm_up }}
        run: |
          set -euo pipefail
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)"
          printf '%s' "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::crate version is not X.Y.Z: $BASE"; exit 1; }
          RELEASE=true
          if [ "$CHANNEL" = "stable" ]; then
            VERSION="$BASE"
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::v${VERSION} already exists; raise the crate version first"; exit 1
            fi
          else
            # The number is the count of commits up to $SHA: no run asks the releases for "the last + 1", so
            # runs in parallel never take the same number, and an older commit never outranks a newer one.
            N="$(git rev-list --count "$SHA")"
            VERSION="${BASE}-beta.${N}"
            # A commit becomes one beta: a second run of it tests again and publishes nothing.
            if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" --jq '.[] | select(.prerelease) | .body' | grep -qxF "commit: ${SHA}"; then
              echo "$SHA already has a beta; this run tests and publishes nothing."
              RELEASE=false
            fi
            # Runs go in parallel, so a newer commit may have published already: building packages for this
            # one would be hours of runners for a beta that publish drops. It still tests, for its statuses.
            if [ "$RELEASE" = true ] && ! gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' \
                | bash "$GITHUB_WORKSPACE/ci-scripts/.github/scripts/beta-is-newest.sh" "$VERSION"; then
              echo "A beta as new as ${VERSION} is already out; this run tests and builds no package."
              RELEASE=false
            fi
            # Superseded main commit: origin/main already advanced past SHA, so skip beta packaging while
            # still running lint, tests, and ruler for its commit statuses.
            MAIN_HEAD="$(git rev-parse origin/main)"
            if [ "$RELEASE" = true ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$SHA" != "$MAIN_HEAD" ]; then
              echo "main is already at ${MAIN_HEAD:0:12}; skipping beta packages for superseded commit ${SHA:0:12} (tests still run)."
              RELEASE=false
            fi
          fi
          # A warm-up run (W4) builds the packages to save their caches and publishes nothing.
          PUBLISH="$RELEASE"
          if [ "$WARM_UP" = "true" ]; then RELEASE=true; PUBLISH=false; echo "Warm-up: packages build, nothing is published."; fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION from $SHA (publishes: $RELEASE)"

      - name: Compute test build plan (full vs delta)
        id: test_plan
        if: steps.resolve_sha.outputs.skip == 'false' && steps.changes.outputs.docs_only != 'true' && inputs.only != 'lint'
        working-directory: ${{ runner.temp }}/private
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          WARM_UP: ${{ inputs.warm_up }}
          PLANT_FAILURE: ${{ github.ref != 'refs/heads/main' && inputs.plant_failure }}
          LOCK_UPDATE: ${{ github.ref != 'refs/heads/main' && inputs.lock_update || '' }}
        run: |
          set -euo pipefail
          if [ "$WARM_UP" = "true" ] || [ "$PLANT_FAILURE" = "true" ] || [ -n "$LOCK_UPDATE" ]; then
            echo "delta_packages=" >> "$GITHUB_OUTPUT"
            echo "base_run_id=" >> "$GITHUB_OUTPUT"
            echo "Test plan: full (warm_up=$WARM_UP, plant_failure=$PLANT_FAILURE, lock_update=${LOCK_UPDATE:+set})."
            exit 0
          fi

          BASE_RUN_ID=""
          BASE_SHA=""
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/native-ci.yml/runs?branch=main&status=success&per_page=20" \
            --jq '.workflow_runs[] | "\(.id)\t\(.display_title)"' 2>/dev/null || true)"
          while IFS=$'\t' read -r RUN_ID TITLE; do
            [ -n "$RUN_ID" ] || continue
            CAND="$(printf '%s' "$TITLE" | sed -nE 's/^native-ci ([0-9a-f]{40})( stable)?$/\1/p')"
            [ -n "$CAND" ] && [ "$CAND" != "$SHA" ] || continue
            git cat-file -e "${CAND}^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$CAND" "$SHA" 2>/dev/null || continue
            DIST="$(git rev-list --count "${CAND}..${SHA}" 2>/dev/null || echo 999)"
            [ "$DIST" -le 30 ] || continue
            ARTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | .name]' 2>/dev/null || echo '[]')"
            if printf '%s' "$ARTS" | jq -e 'index("nextest-base-macos-15") and index("nextest-base-ubuntu-latest") and index("nextest-base-windows-latest")' >/dev/null; then
              BASE_RUN_ID="$RUN_ID"
              BASE_SHA="$CAND"
              break
            fi
          done <<< "$RUNS"

          if [ -z "$BASE_RUN_ID" ] || [ -z "$BASE_SHA" ]; then
            echo "delta_packages=" >> "$GITHUB_OUTPUT"
            echo "base_run_id=" >> "$GITHUB_OUTPUT"
            echo "Test plan: full (no recent main base run with all 3 nextest-base-* artifacts)."
            exit 0
          fi

          export BASE_SHA SHA
          DELTA="$(python3 - <<'PY'
          import os, re, subprocess, sys

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["SHA"]

          changed_raw = subprocess.check_output(
              ["git", "diff", "-z", "--no-renames", "--name-only", base_sha, head_sha]
          ).decode("utf-8", "replace")
          changed = [c for c in changed_raw.split("\0") if c]
          if not changed or len(changed) > 200:
              sys.exit(0)

          def strip_comments(raw):
              out = []
              in_q = None
              for ch in raw:
                  if ch in ('"', "'") and in_q is None:
                      in_q = ch
                  elif ch == in_q:
                      in_q = None
                  elif ch == "#" and in_q is None:
                      break
                  out.append(ch)
              return "".join(out).strip()

          def parse_members(root_toml):
              sec = None
              buf = []
              in_m = False
              for raw in open(root_toml, encoding="utf-8"):
                  s = strip_comments(raw)
                  if not s:
                      continue
                  m = re.match(r"^\[([^\[\]]+)\]$", s)
                  if m:
                      sec = m.group(1).strip()
                      in_m = False
                      continue
                  if sec == "workspace":
                      if not in_m and re.match(r"^members\s*=\s*\[", s):
                          in_m = True
                      if in_m:
                          buf.append(s)
                          if "]" in s:
                              break
              return re.findall(r'"([^"]+)"', " ".join(buf))

          def parse_manifest(member_dir):
              pkg = None
              dnames = set()
              dpaths = set()
              in_pkg = False
              in_deps = False
              subpkg = None
              for raw in open(os.path.join(member_dir, "Cargo.toml"), encoding="utf-8"):
                  s = strip_comments(raw)
                  if not s:
                      continue
                  m = re.match(r"^\[([^\[\]]+)\]$", s)
                  if m:
                      sec = m.group(1).strip()
                      in_pkg = (sec == "package")
                      subpkg = None
                      parts = [p.strip().strip("'\"") for p in sec.split(".")]
                      if any(p in ("dependencies", "dev-dependencies", "build-dependencies") for p in parts):
                          in_deps = True
                          for idx, p in enumerate(parts):
                              if p in ("dependencies", "dev-dependencies", "build-dependencies") and idx + 1 < len(parts):
                                  subpkg = parts[idx + 1]
                                  dnames.add(subpkg)
                                  dnames.add(subpkg.replace("_", "-"))
                      else:
                          in_deps = False
                      continue
                  if in_pkg:
                      pm = re.match(r'^name\s*=\s*"([^"]+)"', s)
                      if pm:
                          pkg = pm.group(1)
                  elif in_deps:
                      if subpkg is not None:
                          pm = re.match(r'^package\s*=\s*"([^"]+)"', s)
                          if pm:
                              dnames.add(pm.group(1))
                          pm2 = re.match(r'^path\s*=\s*"([^"]+)"', s)
                          if pm2:
                              dpaths.add(os.path.normpath(os.path.join(member_dir, pm2.group(1))))
                      else:
                          km = re.match(r"^([A-Za-z0-9_-]+)\s*=", s)
                          if km:
                              k = km.group(1)
                              dnames.add(k)
                              dnames.add(k.replace("_", "-"))
                              pm = re.search(r'\bpackage\s*=\s*"([^"]+)"', s)
                              if pm:
                                  dnames.add(pm.group(1))
                              pm2 = re.search(r'\bpath\s*=\s*"([^"]+)"', s)
                              if pm2:
                                  dpaths.add(os.path.normpath(os.path.join(member_dir, pm2.group(1))))
              return pkg, dnames, dpaths

          members = parse_members("Cargo.toml")
          dir_to_pkg = {}
          pkg_to_dir = {}
          raw_deps = {}
          for m in members:
              mn = os.path.normpath(m)
              pkg, dn, dp = parse_manifest(mn)
              if pkg:
                  dir_to_pkg[mn] = pkg
                  pkg_to_dir[pkg] = mn
                  raw_deps[pkg] = (dn, dp)

          pkg_set = set(pkg_to_dir)
          rdeps = {p: set() for p in pkg_set}
          for pkg, (dn, dp) in raw_deps.items():
              deps = {n for n in dn if n in pkg_set and n != pkg}
              deps |= {dir_to_pkg[p] for p in dp if p in dir_to_pkg and dir_to_pkg[p] != pkg}
              for d in deps:
                  rdeps[d].add(pkg)

          doc_re = re.compile(r"^(docs/(?!conformance/)|design/|\.claude/|[^/]+\.md$)")
          rs_reads = None
          sorted_dirs = sorted(dir_to_pkg, key=lambda d: len(d), reverse=True)
          seeds = set()

          for f in changed:
              if doc_re.match(f):
                  if rs_reads is None:
                      rs_reads = subprocess.run(
                          ["git", "grep", "-h", "-E", r"include_(str|bytes)!|rerun-if-changed", "--", "*.rs"],
                          capture_output=True, text=True, check=False,
                      ).stdout
                  if f in rs_reads:
                      sys.exit(0)
                  continue
              if f.startswith("crates/app/ui/"):
                  seeds.add("cadente-app-ui")
                  continue
              if f.startswith("crates/app/vendor/"):
                  sys.exit(0)
              matched = None
              for d in sorted_dirs:
                  prefix = d + "/"
                  if f.startswith(prefix):
                      rel = f[len(prefix):]
                      if rel in ("Cargo.toml", "build.rs") or rel.startswith("build/"):
                          sys.exit(0)
                      matched = dir_to_pkg[d]
                      break
              if matched is None:
                  sys.exit(0)
              seeds.add(matched)
              if f.startswith("crates/app/src/appearance/"):
                  seeds.add("cadente-app-ui")

          if not seeds:
              sys.exit(0)

          affected = set(seeds)
          queue = list(seeds)
          while queue:
              cur = queue.pop()
              for nxt in rdeps.get(cur, ()):
                  if nxt not in affected:
                      affected.add(nxt)
                      queue.append(nxt)

          if not affected or len(affected) >= 20:
              sys.exit(0)

          print(" ".join(sorted(affected)))
          PY
          )"

          if [ -z "$DELTA" ]; then
            echo "delta_packages=" >> "$GITHUB_OUTPUT"
            echo "base_run_id=" >> "$GITHUB_OUTPUT"
            echo "Test plan: full (diff touches shared build/root files or >=12 crates)."
          else
            COUNT="$(printf '%s\n' "$DELTA" | wc -w | tr -d ' ')"
            echo "delta_packages=$DELTA" >> "$GITHUB_OUTPUT"
            echo "base_run_id=$BASE_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Test plan: delta (${COUNT} packages) against base run ${BASE_RUN_ID} (base ${BASE_SHA:0:12})."
          fi

      # A run from another branch tests this workflow and leaves the commit's statuses alone, and so does
      # a warm-up run, which tests a commit that already has its verdict.
      - name: Publish the statuses
        if: steps.resolve_sha.outputs.skip == 'false' && github.ref == 'refs/heads/main' && !inputs.warm_up && inputs.only != 'lint'
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          BASE: ${{ steps.changes.outputs.base }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          if [ "$DOCS_ONLY" = "true" ]; then
            STATE=success; DESCRIPTION="sem código desde ${BASE:0:12}"
          else
            STATE=pending; DESCRIPTION="native-ci running"
          fi
          # `native-perf.yml` owns `native-ci/perf` once packages are published.
          CONTEXTS="macos-15 ubuntu-latest windows-latest"
          for OS in $CONTEXTS; do
            BODY="$(jq -cn --arg state "$STATE" --arg description "$DESCRIPTION" --arg context "native-ci/$OS" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, target_url: $url, description: $description, context: $context}')"
            curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
              -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$BODY" >/dev/null 2>&1 || echo "::warning::Could not record the status of $OS"
            echo "$OS: $STATE $DESCRIPTION"
          done

  # W4 (ADR 0082): the repository has 10 GB of cache, and one generation of every Rust cache takes about
  # 8.5 GB. A commit that changes Cargo.lock saves a new generation of each kind while the old one is still
  # there; at the end of the run the total passed 10 GB, and GitHub evicted caches main still used (the
  # Linux and Windows package caches, before run 41445092862). This job keeps one generation of each kind
  # while the run saves: the old one goes as soon as the new one lands. It compiles nothing.
  cache-guard:
    name: cache guard
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true' && needs.resolve.outputs.lint_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/prune-rust-caches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Keep one generation of each Rust cache while the run saves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          while :; do
            PENDING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '[.jobs[] | select((.name | test("^(lint|build-tests|package) ")) and .status != "completed")] | length' 2>/dev/null || echo 1)"
            bash .github/scripts/prune-rust-caches.sh | grep -v '^cache in use' || true
            [ "$PENDING" = 0 ] && break
            sleep 20
          done
          bash .github/scripts/prune-rust-caches.sh

  # Each system runs lint, tests and ruler side by side; the run takes as long as the slowest job, not
  # their sum. `cargo clippy --all-targets -D warnings` also type-checks every target, so no separate
  # `cargo check`.
  lint:
    name: lint ${{ matrix.os }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    # Without a limit a hung step holds the run, and the queue behind it, for six hours.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The pre-flight (`only: lint`) leaves macOS out: the plan Free has five macOS runners, a pre-flight
        # beside a run of main took one of them and the jobs of the run waited for a runner until GitHub
        # cancelled them after 15 minutes (44 of the last 120 red jobs). macOS lint still runs on main.
        os: ${{ fromJSON(inputs.only == 'lint' && '["ubuntu-latest","windows-latest"]' || '["macos-15","ubuntu-latest","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      DELTA_PACKAGES: ${{ needs.resolve.outputs.delta_packages }}
      LINT_ONLY: ${{ needs.resolve.outputs.lint_only }}
      MATRIX_OS: ${{ matrix.os }}
      JOB_KIND: lint
    steps:
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      # W6 (ADR 0082): the three builder files come straight from this commit of the public repository;
      # the checkout action took 6 to 11 s on Windows.
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      # W6 (ADR 0082): only the toolchain rust-toolchain.toml pins, with its components (installing
      # `stable` first, as before, added a second toolchain nothing built with), and apt only for what
      # the image lacks (the index update alone took 10 to 30 s); both run while the commit is cloned.
      - name: Clone private repository, Rust toolchain and system libraries
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          NEXTEST: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: |
          bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "" \
            libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev

      - &ci-cargo-config
        name: CI build settings
        run: |
          mkdir -p .ci/.cargo
          {
            echo "# native-ci (ADR 0082 W4); only CI reads this file, through --config."
            echo "[profile.dev]"
            echo "debug = 0"
            # Swatinem/rust-cache sets CARGO_INCREMENTAL=0, which drops dev codegen-units to 16;
            # 64 splits large crates (cadente-core, cadente-app-ui) across runner cores.
            echo "codegen-units = 64"
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo 'strip = "debuginfo"'
            fi
          } > .ci/.cargo/config.toml
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p "$RUNNER_TEMP/tmp"
            WIN_TMP="$(cygpath -w "$RUNNER_TEMP/tmp")"
            { echo "TMP=$WIN_TMP"; echo "TEMP=$WIN_TMP"; } >> "$GITHUB_ENV"
          fi

      # Read-only restore from the shared `tests` cache (saves 2.36 GB by removing dedicated lint caches
      # while reusing proc-macros and C/C++ build scripts compiled by build-tests).
      - name: Rust cache
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: "false"

      - name: Initialize log file
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          touch "$RUNNER_TEMP/ci-build.log"
          if [ "$CACHE_HIT" = "true" ]; then CACHE=inteiro; elif [ -d target ] && [ -n "$(ls -A target 2>/dev/null)" ]; then CACHE=parcial; else CACHE=nenhum; fi
          { echo "cache=$CACHE"; echo "work_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"

      # Compiler and test output names files, lines, tests and screens of the private source: it goes
      # only to ci-build.log. The public log says which step failed, how long cargo took, and no more.
      - name: Check formatting (cargo fmt)
        if: runner.os == 'Linux'
        run: |
          echo "Passo: cargo fmt --all --check"
          if cargo fmt --all --check >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo fmt" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      # R5 and R6 (ADR 0083 O1): no .rs or .slint above 400 lines or its ceiling in .config/lines.toml,
      # and no clone beyond .config/clones.toml (jscpd 4.3.0, the DSH's configuration, in .jscpd.json).
      # Only on Linux: both read files, not the system. Their output names private files, so it goes only
      # to the sealed log.
      - name: Node on the image
        id: node
        if: runner.os == 'Linux'
        run: echo "major=$(node --version 2>/dev/null | sed -E 's/^v([0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Node 22
        if: runner.os == 'Linux' && steps.node.outputs.major != '22'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: File size and duplication (cargo xtask lines, jscpd)
        if: runner.os == 'Linux'
        env:
          PLANT_SIZE: ${{ github.ref != 'refs/heads/main' && inputs.plant_size || 'none' }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/ci-build.log"
          # Branch runs only: each plant must make this step fail (the O1 proof). awk stops at the first
          # entry; `sed | head` broke the pipe and failed the step before the check ran.
          case "$PLANT_SIZE" in
            new-file-401)
              for N in $(seq 401); do echo "// linha $N"; done > crates/app/src/o1_probe.rs
              git add crates/app/src/o1_probe.rs ;;
            above-ceiling)
              FIRST="$(awk -F'"' '/^"/ {print $2; exit}' .config/lines.toml)"
              echo "// uma linha acima do teto" >> "$FIRST" ;;
            copied-block)
              FIRST="$(awk -F'"' '/^"/ && $2 ~ /[.]rs$/ && $2 !~ /\/tests\// {print $2; exit}' .config/lines.toml)"
              { echo "mod o1_probe {"; sed -n '100,180p' "$FIRST"; echo "}"; } > crates/app/src/o1_probe.rs ;;
          esac
          echo "Passo: cargo xtask lines"
          if cargo --config .ci/.cargo/config.toml xtask lines >> "$LOG" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo xtask lines" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi
          echo "Passo: jscpd 4.3.0 (.jscpd.json)"
          set +e
          npx --yes jscpd@4.3.0 --config .jscpd.json --reporters console,json --output "$RUNNER_TEMP/jscpd" crates xtask build >> "$LOG" 2>&1
          JSCPD_EXIT=$?
          set -e
          CLONES="$(jq '.statistics.total.clones' "$RUNNER_TEMP/jscpd/jscpd-report.json" 2>/dev/null || echo "")"
          CEILING="$(sed -n 's/^clones = \([0-9]*\)$/\1/p' .config/clones.toml)"
          echo "jscpd: $CLONES clones, teto $CEILING" >> "$LOG"
          if [ "$JSCPD_EXIT" -eq 0 ] && [ -n "$CLONES" ] && [ -n "$CEILING" ] && [ "$CLONES" -le "$CEILING" ]; then
            echo "Resultado: OK"
            if [ "$CLONES" -lt "$CEILING" ]; then echo "::notice::Há menos clones que o teto da .config/clones.toml; baixe o teto."; fi
          else
            echo "Resultado: FALHOU"
            echo "jscpd" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Clippy (cargo clippy)
        run: |
          CLIPPY_TARGETS="--workspace"
          if [ -n "$DELTA_PACKAGES" ] && [ "$LINT_ONLY" != "true" ]; then
            CLIPPY_TARGETS=""
            for P in $DELTA_PACKAGES; do CLIPPY_TARGETS="$CLIPPY_TARGETS -p $P"; done
          fi
          echo "Passo: cargo clippy ${CLIPPY_TARGETS} --all-targets -- -D warnings"
          CLIPPY_RAW="$RUNNER_TEMP/clippy_raw.log"
          START=$(date +%s)
          set +e
          cargo clippy --config .ci/.cargo/config.toml $CLIPPY_TARGETS --all-targets --timings --message-format short -- -D warnings > "$CLIPPY_RAW" 2>&1
          CLIPPY_EXIT=$?
          set -e
          echo "compile_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          cat "$CLIPPY_RAW" >> "$RUNNER_TEMP/ci-build.log"
          sed 's/\x1b\[[0-9;]*m//g' "$CLIPPY_RAW" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
          if [ $CLIPPY_EXIT -eq 0 ]; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "clippy" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Prove invariants and retry gates reject regressions
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "invariants" > "$RUNNER_TEMP/failed_step"
          PROBE="$PWD/.ci-gate-probe"
          trap 'rm -rf "$PROBE"' EXIT
          mkdir -p "$PROBE/src"
          printf '[package]\nname = "cadente-core"\nversion = "0.0.0"\nedition = "2021"\nautotests = false\n[[bin]]\nname = "gate-probe"\npath = "src/main.rs"\ntest = false\n[[test]]\nname = "it"\npath = "src/main.rs"\n[workspace]\n' > "$PROBE/Cargo.toml"
          printf 'fn main() { let _ = std::process::Command::new("forbidden"); }\n' > "$PROBE/src/main.rs"
          if cargo clippy --manifest-path "$PROBE/Cargo.toml" -- -A clippy::all -D clippy::disallowed_methods > "$RUNNER_TEMP/lint-probe.log" 2>&1; then
            echo '::error::The invariant gate accepted a forbidden process call'
            exit 1
          fi
          grep -q 'disallowed method' "$RUNNER_TEMP/lint-probe.log"
          cat > "$PROBE/src/main.rs" <<'RS'
          fn main() {}
          #[test]
          fn fails_only_on_first_attempt() {
              let path = std::env::var("GATE_ATTEMPTS").unwrap();
              let count = std::fs::read_to_string(&path).unwrap_or_default().parse::<u32>().unwrap_or(0) + 1;
              std::fs::write(path, count.to_string()).unwrap();
              assert!(count > 1, "first attempt fails; retry would hide it");
          }
          RS
          for PROFILE in default ci; do
            export GATE_ATTEMPTS="attempts-$PROFILE"
            if cargo nextest run --manifest-path "$PROBE/Cargo.toml" --config-file "$PWD/.config/nextest.toml" --profile "$PROFILE" > "$RUNNER_TEMP/retry-probe-$PROFILE.log" 2>&1; then
              echo "::error::The $PROFILE profile hid a failing test"
              exit 1
            fi
            if [ ! -f "$PROBE/$GATE_ATTEMPTS" ]; then
              cat "$RUNNER_TEMP/retry-probe-$PROFILE.log" >> "$RUNNER_TEMP/ci-build.log"
              echo "::error::The $PROFILE profile did not run the probe test"
              exit 1
            fi
            test "$(cat "$PROBE/$GATE_ATTEMPTS")" = 1
          done
          rm -f "$RUNNER_TEMP/failed_step"

      # Runs on a timeout or cancellation too: the log of a hung step is the one most needed. The
      # cargo --timings report names the crates, so it is sealed on every run.
      - name: Seal the build log and the timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          if [ -f target/cargo-timings/cargo-timing.html ]; then
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/sealed/timings.enc.json" || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            FAILED_STEP="passo desconhecido"
            [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
            {
              echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
              echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
            } > "$RUNNER_TEMP/sealed.log"
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
            rm -f "$RUNNER_TEMP/sealed.log"
            echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."
          fi

      - name: Upload the sealed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-lint
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-lint-${{ matrix.os }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  # Split build and execution (Wave 1/2): one `build-tests` job per OS compiles tests (full workspace
  # or affected delta closure against a recent green `nextest-base-*` archive), then fans out to
  # 3 parallel runners (`tests 1/2`, `tests 2/2`, `ruler`) with zero runner-slot polling.
  build-tests-macos:
    name: build-tests ${{ matrix.os }}
    needs: resolve
    if: &build-tests-if needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true' && needs.resolve.outputs.lint_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: &read-only
      contents: read
    strategy:
      matrix:
        os: [macos-15]
    defaults: &bash
      run:
        shell: bash
    env: &build-tests-env
      SHA: ${{ needs.resolve.outputs.sha }}
      DELTA_PACKAGES: ${{ needs.resolve.outputs.delta_packages }}
      MATRIX_OS: ${{ matrix.os }}
      JOB_KIND: build-tests
      PLANT_FAILURE: ${{ github.ref != 'refs/heads/main' && inputs.plant_failure && matrix.os == 'ubuntu-latest' }}
    steps: &build-tests-steps
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      - name: Clone private repository, Rust toolchain and system libraries
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          NEXTEST: "true"
        run: |
          bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "" \
            libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev

      # Branch runs only (W3 proof): a failing unit test in the smallest crate, so the run turns red and
      # publish does not run.
      - name: Plant a failing test
        if: env.PLANT_FAILURE == 'true'
        run: printf '\n#[test]\nfn planted_failure_for_the_publish_gate() {\n    panic!("planted by the native-ci branch run");\n}\n' >> crates/frame-journal/src/lib.rs

      # Branch runs only (W4 proof): change one Cargo.lock dependency.
      - name: Change one dependency of Cargo.lock
        if: github.ref != 'refs/heads/main' && inputs.lock_update != ''
        env:
          LOCK_UPDATE: ${{ inputs.lock_update }}
        run: |
          printf '%s' "$LOCK_UPDATE" | grep -qE '^[A-Za-z0-9_-]+@[0-9A-Za-z.+-]+$' || { echo "::error::lock_update must be name@version"; exit 1; }
          cargo update --precise "${LOCK_UPDATE#*@}" "${LOCK_UPDATE%@*}" 2>&1 | grep -E 'Updating|Downgrading|Locking' || true

      - *ci-cargo-config

      - name: Rust cache
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize log file
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          touch "$RUNNER_TEMP/ci-build.log"
          if [ "$CACHE_HIT" = "true" ]; then CACHE=inteiro; elif [ -d target ] && [ -n "$(ls -A target 2>/dev/null)" ]; then CACHE=parcial; else CACHE=nenhum; fi
          { echo "cache=$CACHE"; echo "work_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"

      - name: Build the tests (cargo nextest archive)
        id: build
        run: |
          PKG_FLAGS=""
          if [ -n "$DELTA_PACKAGES" ] && [ "$PLANT_FAILURE" != "true" ]; then
            for P in $DELTA_PACKAGES; do PKG_FLAGS="$PKG_FLAGS -p $P"; done
            MODE=delta
            ARCHIVE="$RUNNER_TEMP/nextest-delta.tar.zst"
            echo "Passo: cargo nextest archive (delta)"
          else
            PKG_FLAGS="--workspace"
            MODE=full
            ARCHIVE="$RUNNER_TEMP/nextest-base.tar.zst"
            echo "Passo: cargo nextest archive --workspace"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          RAW="$RUNNER_TEMP/archive_raw.log"
          START=$(date +%s)
          set +e
          cargo nextest archive --config .ci/.cargo/config.toml $PKG_FLAGS --timings --archive-file "$ARCHIVE" > "$RAW" 2>&1
          EXIT=$?
          set -e
          echo "compile_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          cat "$RAW" >> "$RUNNER_TEMP/ci-build.log"
          sed 's/\x1b\[[0-9;]*m//g' "$RAW" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
          if [ $EXIT -eq 0 ]; then
            MB=$(( $(wc -c < "$ARCHIVE") / 1048576 ))
            echo "archive_mb=$MB" >> "$RUNNER_TEMP/metrics.env"
            echo "Resultado: OK (${MB} MB de arquivo ${MODE})"
          else
            echo "Resultado: FALHOU"
            echo "cargo nextest archive" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Mark the archive upload
        run: echo "upload_start=$(date +%s)" >> "$RUNNER_TEMP/metrics.env"

      - name: Upload the base test archive
        if: steps.build.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: nextest-base-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest-base.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 5 || 1 }}

      - name: Upload the delta test archive
        if: steps.build.outputs.mode == 'delta'
        uses: actions/upload-artifact@v4
        with:
          name: nextest-delta-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest-delta.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Record archive upload duration
        run: |
          START="$(sed -n 's/^upload_start=//p' "$RUNNER_TEMP/metrics.env")"
          echo "upload_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"

      - name: Documentation tests (cargo test --doc)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          CRATES="$(python3 - <<'PY'
          import os, re

          def parse_members(root_toml):
              sec, buf, in_m = None, [], False
              for raw in open(root_toml, encoding="utf-8"):
                  s = re.sub(r"#.*", "", raw).strip()
                  m = re.match(r"^\[([^\[\]]+)\]$", s)
                  if m:
                      sec, in_m = m.group(1).strip(), False
                      continue
                  if sec == "workspace":
                      if not in_m and re.match(r"^members\s*=\s*\[", s):
                          in_m = True
                      if in_m:
                          buf.append(s)
                          if "]" in s:
                              break
              return re.findall(r'"([^"]+)"', " ".join(buf))

          non_code = {
              "text", "plain", "plaintext", "json", "jsonc", "toml", "yaml", "yml",
              "sh", "bash", "zsh", "shell", "console", "slint", "sql", "html", "css",
              "js", "ts", "md", "markdown", "ignore", "diff", "ini", "xml",
          }
          found = []
          for m in parse_members("Cargo.toml"):
              toml_path = os.path.join(m, "Cargo.toml")
              if not os.path.isfile(toml_path):
                  continue
              txt = open(toml_path, encoding="utf-8").read()
              pm = re.search(r'(?m)^name\s*=\s*"([^"]+)"', txt)
              if not pm:
                  continue
              lib_sec = re.search(r"(?ms)^\[lib\]\s*(.*?)(?=^\[|\Z)", txt)
              if lib_sec and re.search(r"(?m)^\s*doctest\s*=\s*false\b", lib_sec.group(1)):
                  continue
              src_dir = os.path.join(m, "src")
              if not os.path.isdir(src_dir):
                  continue
              hit = False
              for dp, _, fns in os.walk(src_dir):
                  if hit:
                      break
                  for fn in fns:
                      if not fn.endswith(".rs"):
                          continue
                      with open(os.path.join(dp, fn), encoding="utf-8", errors="replace") as f:
                          in_fence = False
                          for line in f:
                              dm = re.match(r"^\s*(?:///|//!)(.*)$", line)
                              if not dm:
                                  in_fence = False
                                  continue
                              fm = re.match(r"^```([^`]*)$", dm.group(1).strip())
                              if fm:
                                  if not in_fence:
                                      info = fm.group(1).strip()
                                      tokens = {t.strip().lower() for t in re.split(r"[\s,]+", info) if t.strip()}
                                      if not (tokens & non_code):
                                          hit = True
                                          break
                                      in_fence = True
                                  else:
                                      in_fence = False
              if hit:
                  found.append(pm.group(1))
          print(" ".join(sorted(set(found))))
          PY
          )"
          if [ -z "$CRATES" ]; then
            echo "Nenhum doc-test no workspace (0 crates); pulando cargo test --doc."
            exit 0
          fi
          COUNT="$(printf '%s\n' "$CRATES" | wc -w | tr -d ' ')"
          echo "Passo: cargo test --doc (${COUNT} crates)"
          for CRATE in $CRATES; do
            if ! cargo test --config .ci/.cargo/config.toml --doc -p "$CRATE" >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
              echo "Resultado: FALHOU"
              echo "cargo test --doc" > "$RUNNER_TEMP/failed_step"
              exit 1
            fi
          done
          echo "Resultado: OK"

      - name: Warm check metadata for lint (on cache miss only)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.build.outputs.mode == 'full'
        run: cargo check --config .ci/.cargo/config.toml --workspace --all-targets >> "$RUNNER_TEMP/ci-build.log" 2>&1 || true

      - name: Seal the build log and the timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          if [ -f target/cargo-timings/cargo-timing.html ]; then
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/sealed/timings.enc.json" || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            FAILED_STEP="passo desconhecido"
            [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
            {
              echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
              echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
            } > "$RUNNER_TEMP/sealed.log"
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
            rm -f "$RUNNER_TEMP/sealed.log"
            echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."
          fi

      - name: Upload the sealed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-build-tests
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-build-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  build-tests-linux:
    name: build-tests ${{ matrix.os }}
    needs: resolve
    if: *build-tests-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: *read-only
    strategy:
      matrix:
        os: [ubuntu-latest]
    defaults: *bash
    env: *build-tests-env
    steps: *build-tests-steps

  build-tests-windows:
    name: build-tests ${{ matrix.os }}
    needs: resolve
    if: *build-tests-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: *read-only
    strategy:
      matrix:
        os: [windows-latest]
    defaults: *bash
    env: *build-tests-env
    steps: *build-tests-steps

  # Per-OS test and ruler shards: start immediately when that OS's build-tests completes (no cross-OS
  # barriers, no waiting inside an allocated runner, especially no scarce macOS slot held idle).
  tests-macos:
    name: ${{ matrix.kind }} ${{ matrix.os }}${{ matrix.part && format(' {0}/{1}', matrix.part, matrix.total) || '' }}
    needs: [resolve, build-tests-macos]
    if: *build-tests-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: &tests-permissions
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, kind: tests, part: "1", total: "2" }
          - { os: macos-15, kind: tests, part: "2", total: "2" }
          - { os: macos-15, kind: ruler, part: "", total: "" }
    defaults: *bash
    env: &run-tests-env
      SHA: ${{ needs.resolve.outputs.sha }}
      DELTA_PACKAGES: ${{ needs.resolve.outputs.delta_packages }}
      BASE_RUN_ID: ${{ needs.resolve.outputs.base_run_id }}
      MATRIX_OS: ${{ matrix.os }}
      JOB_KIND: ${{ matrix.kind }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
      PART: ${{ matrix.part }}
      TOTAL: ${{ matrix.total }}
      KIND: ${{ matrix.kind }}
      STRESS_FILTER: ${{ inputs.stress_filter }}
      PLANT_FAILURE: ${{ github.ref != 'refs/heads/main' && inputs.plant_failure && matrix.os == 'ubuntu-latest' }}
    steps: &run-tests-steps
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      - name: Clone private repository
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
        run: bash "$RUNNER_TEMP/scripts/clone-private.sh" . "$SHA"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          PKGS="libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev"
          # shellcheck disable=SC2086
          dpkg -s $PKGS > /dev/null 2>&1 || { sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y $PKGS; }

      - name: Node on the image
        id: node
        run: echo "major=$(node --version 2>/dev/null | sed -E 's/^v([0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Node 22
        if: steps.node.outputs.major != '22'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Windows temp settings
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          WIN_TMP="$(cygpath -w "$RUNNER_TEMP/tmp")"
          { echo "TMP=$WIN_TMP"; echo "TEMP=$WIN_TMP"; } >> "$GITHUB_ENV"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Prepare test archive download
        id: dl
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/ci-build.log"
          { echo "work_start=$(date +%s)"; echo "dl_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"
          echo "archive" > "$RUNNER_TEMP/failed_step"

          IS_DELTA=false
          if [ -n "$DELTA_PACKAGES" ] && [ -n "$BASE_RUN_ID" ] && [ "$PLANT_FAILURE" != "true" ]; then
            IS_DELTA=true
          fi
          RULER_IN_DELTA=false
          if [ "$IS_DELTA" = true ] && printf ' %s ' "$DELTA_PACKAGES" | grep -qF ' cadente-app '; then
            RULER_IN_DELTA=true
          fi

          NEED_DELTA=false
          NEED_BASE_CROSS=false
          if [ "$IS_DELTA" = true ]; then
            if [ "$KIND" = "tests" ] || [ "$RULER_IN_DELTA" = true ] || { [ -n "$STRESS_FILTER" ] && [ "$MATRIX_OS" = "ubuntu-latest" ]; }; then
              NEED_DELTA=true
            fi
            if [ "$KIND" = "tests" ] || [ "$RULER_IN_DELTA" != true ] || { [ -n "$STRESS_FILTER" ] && [ "$MATRIX_OS" = "ubuntu-latest" ]; }; then
              NEED_BASE_CROSS=true
            fi
            echo "mode=delta" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
          echo "need_delta=$NEED_DELTA" >> "$GITHUB_OUTPUT"
          echo "need_base_cross=$NEED_BASE_CROSS" >> "$GITHUB_OUTPUT"
          echo "ruler_in_delta=$RULER_IN_DELTA" >> "$GITHUB_OUTPUT"

      - name: Download test archive (base)
        if: steps.dl.outputs.mode == 'full'
        uses: actions/download-artifact@v4
        with:
          name: nextest-base-${{ matrix.os }}
          path: ${{ runner.temp }}/base

      - name: Download test archive (delta)
        if: steps.dl.outputs.need_delta == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nextest-delta-${{ matrix.os }}
          path: ${{ runner.temp }}/delta

      - name: Download test archive (base run)
        if: steps.dl.outputs.need_base_cross == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=false
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/base"
            if gh run download "$BASE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "nextest-base-${MATRIX_OS}" -D "$RUNNER_TEMP/base"; then
              ok=true
              break
            fi
            echo "::warning::Could not download nextest-base-${MATRIX_OS} from run ${BASE_RUN_ID} (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          $ok || { echo "::error::Failed to download base test archive from run ${BASE_RUN_ID}"; exit 1; }

      - name: Finalize test archive download metrics
        run: |
          set -euo pipefail
          DL_START="$(sed -n 's/^dl_start=//p' "$RUNNER_TEMP/metrics.env" | tail -1)"
          TOTAL_BYTES=0
          for F in "$RUNNER_TEMP/base/nextest-base.tar.zst" "$RUNNER_TEMP/delta/nextest-delta.tar.zst"; do
            [ -f "$F" ] && TOTAL_BYTES=$(( TOTAL_BYTES + $(wc -c < "$F") ))
          done
          MB=$(( TOTAL_BYTES / 1048576 ))
          { echo "download_s=$(( $(date +%s) - DL_START ))"; echo "archive_mb=$MB"; } >> "$RUNNER_TEMP/metrics.env"
          rm -f "$RUNNER_TEMP/failed_step"
          echo "Arquivo(s) de testes (${{ steps.dl.outputs.mode }}): ${MB} MB"

      - name: Run from the archive (cargo nextest)
        env:
          MODE: ${{ steps.dl.outputs.mode }}
          RULER_IN_DELTA: ${{ steps.dl.outputs.ruler_in_delta }}
        run: |
          NEXTEST_RAW="$RUNNER_TEMP/nextest_raw.log"
          START=$(date +%s)
          NEXTEST_EXIT=0

          if [ "$KIND" = "ruler" ]; then
            echo "Passo: cargo nextest run --archive-file (só a régua, modo $MODE)"
            export CADENTE_RULER_TIMES_OUT="$RUNNER_TEMP/ruler-times.json"
            if [ "$MODE" = "delta" ] && [ "$RULER_IN_DELTA" = "true" ]; then
              ARCHIVE="$RUNNER_TEMP/delta/nextest-delta.tar.zst"
            else
              ARCHIVE="$RUNNER_TEMP/base/nextest-base.tar.zst"
            fi
            set +e
            cargo-nextest nextest run --archive-file "$ARCHIVE" --extract-to . --extract-overwrite \
              --workspace-remap . --profile ci -E "kind(lib) & ${RULER}" > "$NEXTEST_RAW" 2>&1
            NEXTEST_EXIT=$?
            set -e
            cat "$NEXTEST_RAW" >> "$RUNNER_TEMP/ci-build.log"
            PUBLIC="$(sed 's/\x1b\[[0-9;]*m//g' "$NEXTEST_RAW" | grep -E '^ *(Finished |Summary \[)' | sed -E 's/^ *//' || true)"
            printf '%s\n' "$PUBLIC"
          elif [ "$MODE" = "delta" ]; then
            echo "Passo: cargo nextest run --archive-file (delta + base complementar, metade $PART de $TOTAL)"
            DELTA_EXPR=""
            for P in $DELTA_PACKAGES; do
              [ -n "$DELTA_EXPR" ] && DELTA_EXPR="$DELTA_EXPR | "
              DELTA_EXPR="${DELTA_EXPR}package(${P})"
            done
            BASE_RAW="$RUNNER_TEMP/nextest_base_raw.log"
            DELTA_RAW="$RUNNER_TEMP/nextest_delta_raw.log"
            set +e
            cargo-nextest nextest run --archive-file "$RUNNER_TEMP/base/nextest-base.tar.zst" --extract-to . --extract-overwrite \
              --workspace-remap . --profile ci --no-tests=pass -E "not (${DELTA_EXPR}) & not ${RULER}" --partition "hash:${PART}/${TOTAL}" > "$BASE_RAW" 2>&1
            EXIT_BASE=$?
            cargo-nextest nextest run --archive-file "$RUNNER_TEMP/delta/nextest-delta.tar.zst" --extract-to . --extract-overwrite \
              --workspace-remap . --profile ci --no-tests=pass -E "not ${RULER}" --partition "hash:${PART}/${TOTAL}" > "$DELTA_RAW" 2>&1
            EXIT_DELTA=$?
            set -e
            cat "$BASE_RAW" "$DELTA_RAW" >> "$RUNNER_TEMP/ci-build.log"
            sed 's/\x1b\[[0-9;]*m//g' "$BASE_RAW" "$DELTA_RAW" | grep -E '^ *(Finished |Summary \[)' | sed -E 's/^ *//' || true
            PUBLIC=""
            [ "$EXIT_BASE" -eq 0 ] && [ "$EXIT_DELTA" -eq 0 ] || NEXTEST_EXIT=1
          else
            echo "Passo: cargo nextest run --archive-file (sem a régua, metade $PART de $TOTAL)"
            set +e
            cargo-nextest nextest run --archive-file "$RUNNER_TEMP/base/nextest-base.tar.zst" --extract-to . --extract-overwrite \
              --workspace-remap . --profile ci -E "not ${RULER}" --partition "hash:${PART}/${TOTAL}" > "$NEXTEST_RAW" 2>&1
            NEXTEST_EXIT=$?
            set -e
            cat "$NEXTEST_RAW" >> "$RUNNER_TEMP/ci-build.log"
            PUBLIC="$(sed 's/\x1b\[[0-9;]*m//g' "$NEXTEST_RAW" | grep -E '^ *(Finished |Summary \[)' | sed -E 's/^ *//' || true)"
            printf '%s\n' "$PUBLIC"
          fi

          echo "test_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
          RAN_OK=true
          if [ "$KIND" = "ruler" ] && ! printf '%s' "$PUBLIC" | grep -qE '\] 1 test run: 1 passed'; then RAN_OK=false; fi
          if [ "$NEXTEST_EXIT" -eq 0 ] && [ "$RAN_OK" = true ]; then
            echo "Resultado: OK"
          else
            if [ "$NEXTEST_EXIT" -eq 0 ]; then echo "::error::The ruler filter did not run exactly one test"; fi
            for dir in "${TMPDIR:-}" "${TMP:-}" "${TEMP:-}" /tmp; do
              if [ -n "$dir" ] && [ -f "$dir/parity-tails.log" ]; then
                { echo; echo "--- Telas da régua ($dir/parity-tails.log)"; cat "$dir/parity-tails.log"; } >> "$RUNNER_TEMP/ci-build.log"
                break
              fi
            done
            echo "Resultado: FALHOU"
            [ "$KIND" = "ruler" ] && echo "régua" > "$RUNNER_TEMP/failed_step" || echo "cargo nextest" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      # Y6 (ADR 0091): the tests this commit touched run 20 times in a row (`--stress-count 20`), once, on
      # Linux, in at most a minute.
      - name: Stress the tests of this commit (cargo nextest --stress-count 20)
        if: inputs.stress_filter != '' && matrix.kind == 'ruler' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        env:
          MODE: ${{ steps.dl.outputs.mode }}
        run: |
          echo "Passo: cargo nextest run --archive-file --stress-count 20 (testes do commit)"
          STRESS_RAW="$RUNNER_TEMP/nextest_stress.log"
          : > "$STRESS_RAW"
          STRESS_EXIT=0
          if [ "$MODE" = "delta" ]; then
            DELTA_EXPR=""
            for P in $DELTA_PACKAGES; do
              [ -n "$DELTA_EXPR" ] && DELTA_EXPR="$DELTA_EXPR | "
              DELTA_EXPR="${DELTA_EXPR}package(${P})"
            done
            set +e
            timeout 55 cargo-nextest nextest run --archive-file "$RUNNER_TEMP/delta/nextest-delta.tar.zst" --extract-to . --extract-overwrite \
              --workspace-remap . --profile ci --no-tests=pass --stress-count 20 -E "$STRESS_FILTER" >> "$STRESS_RAW" 2>&1
            E1=$?
            E2=0
            if [ "$E1" -eq 0 ] && [ -f "$RUNNER_TEMP/base/nextest-base.tar.zst" ]; then
              timeout 30 cargo-nextest nextest run --archive-file "$RUNNER_TEMP/base/nextest-base.tar.zst" --extract-to . --extract-overwrite \
                --workspace-remap . --profile ci --no-tests=pass --stress-count 20 -E "(${STRESS_FILTER}) & not (${DELTA_EXPR})" >> "$STRESS_RAW" 2>&1
              E2=$?
            fi
            set -e
            if [ "$E1" -eq 124 ] || [ "$E2" -eq 124 ]; then
              STRESS_EXIT=124
            elif [ "$E1" -ne 0 ] || [ "$E2" -ne 0 ]; then
              STRESS_EXIT=1
            fi
          else
            set +e
            timeout 55 cargo-nextest nextest run --archive-file "$RUNNER_TEMP/base/nextest-base.tar.zst" --extract-to . --extract-overwrite \
              --workspace-remap . --profile ci --no-tests=pass --stress-count 20 -E "$STRESS_FILTER" > "$STRESS_RAW" 2>&1
            STRESS_EXIT=$?
            set -e
          fi
          if [ "$STRESS_EXIT" -eq 124 ]; then
            echo "Resultado: IGNORADO (o filtro não cabe em 55 s; use um filtro mais estreito)"
            STRESS_EXIT=0
          fi
          cat "$STRESS_RAW" >> "$RUNNER_TEMP/ci-build.log"
          sed 's/\x1b\[[0-9;]*m//g' "$STRESS_RAW" | grep -E '^ *(Finished |Summary \[)' | sed -E 's/^ *//' || true
          if [ "$STRESS_EXIT" -eq 0 ]; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "estresse (20 vezes)" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Seal the build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          FAILED_STEP="passo desconhecido"
          [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: passou (resumo dos testes)"
            else
              echo "native-ci ${JOB_KIND} ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
            fi
            echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/ci-build.log" 2>/dev/null \
                | grep -E '^ *(PASS|FAIL|SLOW|FLAKY|LEAK|SKIP|TIMEOUT|Starting|Summary|Finished) ' || true
            else
              cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
            fi
          } > "$RUNNER_TEMP/sealed.log"
          node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
            "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
          rm -f "$RUNNER_TEMP/sealed.log"
          if [ "${{ job.status }}" = "success" ]; then echo "Passou; o resumo dos testes vai para o ci-logs do repositório privado."; else
            echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."; fi

      - name: Upload the sealed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-${{ matrix.kind }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the seconds of each ruler face
        if: always() && matrix.kind == 'ruler'
        uses: actions/upload-artifact@v4
        with:
          name: ruler-times-${{ matrix.os }}
          path: ${{ runner.temp }}/ruler-times.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.kind }}-${{ matrix.os }}${{ matrix.part && format('-{0}-{1}', matrix.part, matrix.total) || '' }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  tests-linux:
    name: ${{ matrix.kind }} ${{ matrix.os }}${{ matrix.part && format(' {0}/{1}', matrix.part, matrix.total) || '' }}
    needs: [resolve, build-tests-linux]
    if: *build-tests-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: *tests-permissions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, kind: tests, part: "1", total: "3" }
          - { os: ubuntu-latest, kind: tests, part: "2", total: "3" }
          - { os: ubuntu-latest, kind: tests, part: "3", total: "3" }
          - { os: ubuntu-latest, kind: ruler, part: "", total: "" }
    defaults: *bash
    env: *run-tests-env
    steps: *run-tests-steps

  tests-windows:
    name: ${{ matrix.kind }} ${{ matrix.os }}${{ matrix.part && format(' {0}/{1}', matrix.part, matrix.total) || '' }}
    needs: [resolve, build-tests-windows]
    if: *build-tests-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: *tests-permissions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, kind: tests, part: "1", total: "3" }
          - { os: windows-latest, kind: tests, part: "2", total: "3" }
          - { os: windows-latest, kind: tests, part: "3", total: "3" }
          - { os: windows-latest, kind: ruler, part: "", total: "" }
    defaults: *bash
    env: *run-tests-env
    steps: *run-tests-steps

  # Y1 (ADR 0091): the Windows tests of a pre-flight (`only=lint` with `windows_filter`): the diff built path
  # text by hand (T7), which lint does not catch. It clones `preflight/<sha>`, compiles the tests of the
  # filter and runs them; it writes no status and holds nothing but the read-only deploy key.
  preflight-windows:
    name: preflight windows
    needs: resolve
    if: needs.resolve.outputs.lint_only == 'true' && inputs.windows_filter != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done
      - name: Clone private repository, Rust toolchain and nextest
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          NEXTEST: "true"
        run: bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" ""
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: "false"
      - name: Run the Windows tests of the diff (cargo nextest)
        env:
          WINDOWS_FILTER: ${{ inputs.windows_filter }}
        run: |
          echo "Passo: cargo nextest run -E <filtro do diff> (Windows)"
          cargo nextest run --workspace --no-fail-fast --no-tests=pass -E "$WINDOWS_FILTER" > "$RUNNER_TEMP/preflight.log" 2>&1 \
            && echo "Resultado: OK" \
            || { echo "Resultado: FALHOU (o log não sai: nomes de arquivos privados)"; exit 1; }

  # Compiles nothing: decrypts the sealed logs and timings into the private ci-logs branch, records one
  # commit status per system (green only when its lint, build-tests, tests 1/2, tests 2/2 and ruler are),
  # decides the Supabase deploy and keeps one generation of each Rust cache.
  report:
    name: report
    needs: [resolve, lint, build-tests-macos, build-tests-linux, build-tests-windows, tests-macos, tests-linux, tests-windows]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      green: ${{ steps.statuses.outputs.green }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-log-crypto.cjs
            .github/scripts/persist-private-log.sh
            .github/scripts/prune-rust-caches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the sealed logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-log-*
          path: ${{ runner.temp }}/sealed

      - name: Store the logs and timings in the private repository
        env:
          CI_LOG_PRIVATE_KEY: ${{ secrets.CI_LOG_PRIVATE_KEY }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/persist-private-log.sh
          shopt -s nullglob
          OUT="$RUNNER_TEMP/plain"
          mkdir -p "$OUT"
          for DIR in "$RUNNER_TEMP"/sealed/ci-log-*; do
            NAME="$(basename "$DIR")"
            NAME="${NAME#ci-log-}"
            [ -f "$DIR/ci-log.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/ci-log.enc.json" "$OUT/$NAME.log" || true
            [ -f "$DIR/timings.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/timings.enc.json" "$OUT/timings-$NAME.html" || true
          done
          for LOG in "$OUT"/*.log; do echo "log completo de $(basename "$LOG" .log): ci-logs/public-actions/${GITHUB_RUN_ID}/$(basename "$LOG")"; done
          persist_private_files "$OUT" "public-actions/${GITHUB_RUN_ID}" "native-ci logs and timings"
          rm -rf "$OUT"

      - name: Record the commit statuses
        id: statuses
        if: needs.resolve.outputs.lint_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && !inputs.warm_up }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name | test("^(lint|build-tests|tests|ruler) (macos-15|ubuntu-latest|windows-latest)( [0-9]/[0-9])?$"))
                  | (.name | split(" ")) as $n
                  | [$n[1], ($n[0] + (if $n[2] then " " + $n[2] else "" end)), (.conclusion // "cancelled"), ([.steps[] | select(.conclusion == "failure") | .name][0] // "")] | @tsv' \
            > "$RUNNER_TEMP/jobs.tsv"
          GREEN=true
          for OS in macos-15 ubuntu-latest windows-latest; do
            # A system is green only when its lint, build-tests, tests 1/2, tests 2/2 and ruler ran and passed.
            TOTAL="$(awk -F'\t' -v os="$OS" '$1 == os' "$RUNNER_TEMP/jobs.tsv" | wc -l | tr -d ' ')"
            PASSED="$(awk -F'\t' -v os="$OS" '$1 == os && $3 == "success"' "$RUNNER_TEMP/jobs.tsv" | wc -l | tr -d ' ')"
            if [ "$TOTAL" -ge 5 ] && [ "$PASSED" = "$TOTAL" ]; then
              STATE=success; DESCRIPTION="native-ci passed"; CONCLUSION=success
            else
              STATE=failure; CONCLUSION=failure; GREEN=false
              DESCRIPTION="$(awk -F'\t' -v os="$OS" '$1 == os && $3 != "success" { printf "%s%s: %s", sep, $2, ($4 != "" ? $4 : $3); sep = "; " }' "$RUNNER_TEMP/jobs.tsv")"
              DESCRIPTION="Failed at ${DESCRIPTION:-a job that did not run}"
            fi
            [ "$OS" = "ubuntu-latest" ] && echo "ubuntu=$CONCLUSION" >> "$GITHUB_OUTPUT"
            echo "$OS: $STATE ${DESCRIPTION}"
            # A run from another branch tests this workflow and leaves the commit's statuses alone.
            [ "$ON_MAIN" = "true" ] || continue
            BODY="$(jq -cn --arg state "$STATE" --arg description "${DESCRIPTION:0:140}" --arg context "native-ci/$OS" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, target_url: $url, description: $description, context: $context}')"
            curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
              -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$BODY" >/dev/null 2>&1 || echo "::warning::Could not record the status of $OS"
          done
          echo "green=$GREEN" >> "$GITHUB_OUTPUT"

      - name: Trigger Supabase deploy
        # Only main deploys; a run from another branch tests this workflow.
        if: github.ref == 'refs/heads/main' && needs.resolve.outputs.lint_only != 'true' && steps.statuses.outputs.ubuntu == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          api() { curl -sf -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${PRIVATE_REPO}/$1"; }
          echo "Verificando se houve alterações em supabase/ desde o último deploy..."
          LAST_DEPLOYED_SHA="$(api "contents/supabase-deployed?ref=ci-logs" 2>/dev/null | jq -r '.content // empty' | base64 -d 2>/dev/null | tr -d ' \n\r' || true)"
          SHOULD_DEPLOY="false"
          if [ -z "$LAST_DEPLOYED_SHA" ]; then
            api "contents/supabase?ref=${SHA}" >/dev/null 2>&1 && SHOULD_DEPLOY="true"
          elif COMPARE="$(api "compare/${LAST_DEPLOYED_SHA}...${SHA}" 2>/dev/null)"; then
            # The compare API lists at most 300 files; a longer diff counts as a change.
            if printf '%s' "$COMPARE" | jq -e '(.files | length) >= 300 or any(.files[]; .filename | startswith("supabase/"))' >/dev/null; then
              SHOULD_DEPLOY="true"
            fi
          else
            SHOULD_DEPLOY="true"
          fi

          if [ "$SHOULD_DEPLOY" = "true" ]; then
            echo "Alterações detectadas em supabase/; disparando supabase-deploy.yml..."
            gh workflow run supabase-deploy.yml -R "$GITHUB_REPOSITORY" -f sha="$SHA" || echo "::warning::Não foi possível disparar supabase-deploy.yml"
          else
            echo "Nenhuma alteração em supabase/ desde $LAST_DEPLOYED_SHA."
          fi

      # The repository has 10 GB of cache. Each Cargo.lock change saved a new generation beside the old
      # one, the total reached 9.9 GB and GitHub evicted caches still in use, so builds started cold.
      - name: Keep one generation of each Rust cache
        if: github.ref == 'refs/heads/main' && needs.resolve.outputs.lint_only != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-rust-caches.sh

  # The Cadente extension for Chromium browsers (ADR 0097), Rust compiled to WebAssembly, built
  # once on Ubuntu and downloaded by all 4 package jobs (instead of compiling wasm32 4 times across
  # macOS/Linux/Windows). Failure here warns cleanly without stalling packaging.
  bridge-extension:
    name: bridge-extension
    needs: resolve
    if: &package-if needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.docs_only != 'true' && needs.resolve.outputs.release == 'true' && needs.resolve.outputs.lint_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: native-ci-pkg-${{ github.ref }}-bridge-extension-${{ inputs.channel == 'stable' && needs.resolve.outputs.sha || 'beta' }}
      cancel-in-progress: ${{ inputs.channel != 'stable' && !inputs.warm_up }}
    permissions: *read-only
    defaults: *bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      - name: Clone private repository and wasm32 target
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
        run: bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "wasm32-unknown-unknown"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: "false"

      - name: Build browser extension (WebAssembly)
        continue-on-error: true
        run: |
          exec > "$RUNNER_TEMP/ext.log" 2>&1
          set -uo pipefail
          VER="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          TARGET="x86_64-unknown-linux-musl"
          DIR="$RUNNER_TEMP/wasm-bindgen-$VER-$TARGET"
          ok=false
          if [ -n "$VER" ]; then
            for attempt in 1 2 3; do
              if curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$VER/wasm-bindgen-$VER-$TARGET.tar.gz" | tar xz -C "$RUNNER_TEMP"; then
                ok=true
                break
              fi
              sleep $((attempt * 10))
            done
          fi
          if ! $ok; then
            echo "::warning::wasm-bindgen ${VER:-?} did not download; package ships without browser extension"
            exit 0
          fi
          export PATH="$DIR:$PATH"
          cargo build --quiet -p xtask && ./target/debug/xtask bridge-extension || echo "::warning::bridge-extension failed; continuing without it"

      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: bridge-extension
          path: target/bridge-extension/chromium
          if-no-files-found: warn
          retention-days: 1

  # Parallel packaging across targets: Linux and Windows start immediately on abundant runners, while
  # macOS staggers within GitHub Free's 5-runner pool (`arm64` waits for `lint`, leaving 2 slots at t=0;
  # `x86_64` starts right when `tests-macos` releases its 3 slots).
  package-macos-arm64:
    name: package ${{ matrix.target }}
    needs: [resolve, lint]
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: native-ci-pkg-${{ github.ref }}-aarch64-apple-darwin-${{ inputs.channel == 'stable' && needs.resolve.outputs.sha || 'beta' }}
      cancel-in-progress: ${{ inputs.channel != 'stable' && !inputs.warm_up }}
    permissions: &package-permissions
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, smoke: "true" }
    defaults: *bash
    env: &package-env
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      APPLE_SIGNING_IDENTITY: "-"
      SHA: ${{ needs.resolve.outputs.sha }}
    steps: &package-steps
      - name: Start the clock
        run: echo "t0=$(date +%s)" > "$RUNNER_TEMP/metrics.env"

      - name: Stage builder scripts
        env:
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for F in .github/scripts/clone-private.sh .github/scripts/prepare-job.sh .github/scripts/ci-log-crypto.cjs .github/ci-log-key.pub.pem .github/scripts/smoke-measure.py; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/scripts/${F##*/}" "$BASE/$F"
          done

      - name: Clone the private repository at the commit, Rust toolchain and system libraries
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
          TOOLCHAIN: ${{ needs.resolve.outputs.toolchain }}
          TARGETS: ${{ matrix.target }}
        run: |
          bash "$RUNNER_TEMP/scripts/prepare-job.sh" "$SHA" "$TOOLCHAIN" "$TARGETS" \
            libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev dpkg-dev

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: ${{ matrix.target }}-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install sccache
        uses: taiki-e/install-action@sccache

      - name: Restore the sccache folder
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: sccache-${{ matrix.target }}-

      - name: AppImage tool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Installer tool cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-windows-v1

      - name: Installer tool (Windows)
        if: runner.os == 'Windows'
        run: |
          NSIS="/c/Program Files (x86)/NSIS"
          for attempt in 1 2 3; do
            [ -x "$NSIS/makensis.exe" ] && break
            choco install nsis -y --no-progress || true
            [ -x "$NSIS/makensis.exe" ] || sleep $((attempt * 20))
          done
          [ -x "$NSIS/makensis.exe" ] || { echo "::error::NSIS (makensis) did not install"; exit 1; }
          "$NSIS/makensis.exe" -VERSION
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Keep the build machine's paths out of the binaries
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          ROOT="$PWD"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT="$(cygpath -w "$ROOT")"
            CARGO_DIR="$(cygpath -w "$CARGO_DIR")"
          fi
          echo "RUSTFLAGS=--remap-path-prefix=${ROOT}=cadente --remap-path-prefix=${CARGO_DIR}=cargo" >> "$GITHUB_ENV"
          if [ "$CACHE_HIT" = "true" ]; then CACHE=inteiro; elif [ -d target ] && [ -n "$(ls -A target 2>/dev/null)" ]; then CACHE=parcial; else CACHE=nenhum; fi
          { echo "cache=$CACHE"; echo "work_start=$(date +%s)"; } >> "$RUNNER_TEMP/metrics.env"

      - name: Build (cargo build --release)
        env:
          CADENTE_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_PACKAGE_CACHE_SIZE || '260M' }}
          SCCACHE_IDLE_TIMEOUT: "0"
          T: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "Passo: cargo build --release --target $T"
          START=$(date +%s)
          if cargo build --release -p cadente-app -p cadente-launcher --features cadente-app/extra-grammars --target "$T" --timings >> "$RUNNER_TEMP/release-build.log" 2>&1; then
            echo "compile_s=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/metrics.env"
            cp target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/timings-$T.html" 2>/dev/null || true
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/release-build.log" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            exit 1
          fi

      - name: Download browser extension
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="target/bridge-extension/chromium"
          [ -f "$OUT/manifest.json" ] && exit 0
          ID=""
          for _ in $(seq 1 9); do
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=bridge-extension" --jq '.artifacts[0].id // empty' 2>/dev/null || true)"
            [ -n "$ID" ] && break
            STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "bridge-extension") | .status' 2>/dev/null || true)"
            [ "$STATE" = "completed" ] && break
            sleep 10
          done
          if [ -z "$ID" ]; then
            echo "::warning::bridge-extension artifact not available; packaging without browser extension"
            exit 0
          fi
          mkdir -p "$OUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > "$RUNNER_TEMP/bridge-ext.zip"
          if command -v unzip >/dev/null; then
            unzip -q -o "$RUNNER_TEMP/bridge-ext.zip" -d "$OUT"
          else
            7z x -y -o"$OUT" "$RUNNER_TEMP/bridge-ext.zip" >/dev/null
          fi
          rm -f "$RUNNER_TEMP/bridge-ext.zip"
          [ -f "$OUT/manifest.json" ] && echo "Resultado: OK (extensão baixada)" || echo "::warning::bridge-extension archive missing manifest.json"

      - name: Bundle
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_PACKAGE_CACHE_SIZE || '260M' }}
          SCCACHE_IDLE_TIMEOUT: "0"
          T: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "Passo: xtask bundle --skip-build --target $T"
          if cargo build --quiet -p xtask >> "$RUNNER_TEMP/release-build.log" 2>&1 \
            && ./target/debug/xtask bundle --skip-build --target "$T" >> "$RUNNER_TEMP/release-build.log" 2>&1; then
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/release-build.log" | grep -E '^ *Finished ' | sed -E 's/^ *//' | tail -1 || true
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            exit 1
          fi

      - name: Ad-hoc signature of the update binary (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/release/cadente-native-ui"
          codesign --verify "$BIN" 2>/dev/null || codesign --force --sign - "$BIN"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/cadente-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload the update binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cadente-native-ui
            target/${{ matrix.target }}/release/cadente-native-ui.exe
          if-no-files-found: error
          retention-days: 1

      - name: Cache key of the system packages (Linux)
        id: debs
        if: runner.os == 'Linux' && matrix.smoke == 'true'
        run: echo "key=smoke-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - name: Restore the system packages (Linux)
        id: debs-cache
        if: runner.os == 'Linux' && matrix.smoke == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/smoke-debs
          key: ${{ steps.debs.outputs.key }}

      - name: Install the package
        id: install
        if: matrix.smoke == 'true'
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)
              hdiutil attach dist/*.dmg -mountpoint /Volumes/CadenteSmoke -nobrowse -quiet
              cp -R /Volumes/CadenteSmoke/Cadente.app "$RUNNER_TEMP/"
              hdiutil detach /Volumes/CadenteSmoke -quiet
              DIR="$RUNNER_TEMP/Cadente.app/Contents/MacOS"
              test -f "$RUNNER_TEMP/Cadente.app/Contents/SharedSupport/baseline_version/metadata.json"
              EXE="" ;;
            Linux)
              PKGS="xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0"
              DEBS="$HOME/smoke-debs"
              # shellcheck disable=SC2086
              if dpkg -s $PKGS > /dev/null 2>&1 && sudo dpkg -i ./dist/*.deb > /dev/null 2>&1; then
                echo "pacotes do sistema: já na imagem"
              elif compgen -G "$DEBS/*.deb" > /dev/null && sudo DEBIAN_FRONTEND=noninteractive dpkg -i "$DEBS"/*.deb ./dist/*.deb > /dev/null 2>&1; then
                echo "pacotes do sistema: do cache ($(ls "$DEBS" | wc -l) .deb)"
              else
                sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
                sudo apt-get -o Acquire::Retries=3 update
                # shellcheck disable=SC2086
                sudo apt-get -o Acquire::Retries=3 install -y -f --download-only $PKGS ./dist/*.deb
                mkdir -p "$DEBS"
                find /var/cache/apt/archives -maxdepth 1 -name '*.deb' ! -name 'cadente*' -exec cp {} "$DEBS/" \;
                # shellcheck disable=SC2086
                sudo apt-get -o Acquire::Retries=3 install -y -f $PKGS ./dist/*.deb
                echo "pacotes do sistema: do espelho ($(ls "$DEBS" | wc -l) .deb guardados)"
              fi
              DIR=/usr/bin
              test -f /usr/lib/Cadente/baseline_version/metadata.json
              EXE="" ;;
            Windows)
              INSTALLER="$(ls dist/cadente-*-windows-x64.exe | head -1)"
              "$INSTALLER" //S
              for _ in $(seq 1 60); do [ -f "$LOCALAPPDATA/Programs/Cadente/cadente-core.exe" ] && break; sleep 2; done
              DIR="$LOCALAPPDATA/Programs/Cadente"
              test -f "$DIR/baseline_version/metadata.json"
              EXE=".exe" ;;
          esac
          test -x "$DIR/cadente$EXE"
          test -x "$DIR/cadente-core$EXE"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: The launcher finds the Core it ships
        if: matrix.smoke == 'true'
        env:
          DIR: ${{ steps.install.outputs.dir }}
          EXE: ${{ steps.install.outputs.exe }}
          EXPECTED: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          FOUND="$("$DIR/cadente$EXE" --system-install)"
          echo "$FOUND"
          printf '%s' "$FOUND" | grep -q "\"version\":\"$EXPECTED\""

      - name: The Core opens, draws and measures
        if: matrix.smoke == 'true'
        env:
          DIR: ${{ steps.install.outputs.dir }}
          EXE: ${{ steps.install.outputs.exe }}
          MEASURE: "5 60"
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ERR="$RUNNER_TEMP/core-stderr.log"
          export ERR
          measure() {
            local OUT="$2" STATUS=0 WAITED=0 REPORTED=""
            export OUT CADENTE_HOME="$3"
            # shellcheck disable=SC2086,SC2016
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a -s "-screen 0 1440x900x24" sh -c 'exec "$0" "$@" > "$OUT" 2>> "$ERR"' "$1" --measure $MEASURE &
            else
              "$1" --measure $MEASURE > "$OUT" 2>> "$ERR" &
            fi
            local PID=$!
            while kill -0 "$PID" 2>/dev/null; do
              if [ -z "$REPORTED" ] && grep -q '"states"' "$OUT" 2>/dev/null; then REPORTED=$WAITED; fi
              if [ -n "$REPORTED" ] && [ $((WAITED - REPORTED)) -ge 20 ]; then
                kill "$PID" 2>/dev/null || true
                echo "::error::$1 wrote its report and did not exit within 20 s (D3)"
                return 1
              fi
              if [ "$WAITED" -ge 180 ]; then
                kill "$PID" 2>/dev/null || true
                echo "::error::$1 did not finish the measurement within 180 s"
                return 1
              fi
              sleep 1
              WAITED=$((WAITED + 1))
            done
            wait "$PID" || STATUS=$?
            return "$STATUS"
          }
          STATUS=0
          CADENTE_MEASURE_CHATS=0 CADENTE_MEASURE_TERMINALS=0 CADENTE_MEASURE_IDLE_S=2 CADENTE_MEASURE_CLOSED_S=2 \
            CADENTE_MEASURE_MIN_FRAMES=0 CADENTE_MEASURE_WARM_UP=0 \
            measure "$DIR/cadente-core$EXE" "$RUNNER_TEMP/measure.out" "$RUNNER_TEMP/cadente-home" || STATUS=$?
          export SMOKE_PART=basic P2_EXTRA="" P6_BETA="" P6_NEW=""
          echo "esta versão, rodada basic:"
          cat "$RUNNER_TEMP/measure.out"
          RESULT=0
          python3 "$RUNNER_TEMP/scripts/smoke-measure.py" "$RUNNER_TEMP/measure.out" "$RUNNER_TEMP/measure.json" "$TARGET" "" || RESULT=$?
          [ "$STATUS" = 0 ] || { echo "::error::the Core exited with $STATUS"; exit "$STATUS"; }
          exit "$RESULT"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.smoke == 'true'
        with:
          name: smoke-${{ matrix.target }}-basic
          path: ${{ runner.temp }}/measure.json
          if-no-files-found: ignore
          retention-days: 1

      - name: sccache counts
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: |
          STATS="$(sccache --show-stats --stats-format json 2>/dev/null || echo '{}')"
          HITS="$(printf '%s' "$STATS" | jq -r '[.stats.cache_hits.counts // {} | .[]] | add // 0')"
          MISSES="$(printf '%s' "$STATS" | jq -r '[.stats.cache_misses.counts // {} | .[]] | add // 0')"
          SIZE="$(du -sm "$SCCACHE_DIR" 2>/dev/null | cut -f1)"
          echo "sccache: ${HITS} acertos, ${MISSES} faltas, ${SIZE:-0} MB na pasta"
          { echo "sccache_hits=$HITS"; echo "sccache_misses=$MISSES"; echo "sccache_mb=${SIZE:-0}"; } >> "$RUNNER_TEMP/metrics.env"
          sccache --stop-server > /dev/null 2>&1 || true

      - name: Save the sccache folder
        if: github.ref == 'refs/heads/main' && vars.SCCACHE_SAVE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ matrix.target }}-${{ github.run_id }}

      - name: Seal the build log and the timings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          if [ -f "$RUNNER_TEMP/timings-${{ matrix.target }}.html" ]; then
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/timings-${{ matrix.target }}.html" "$RUNNER_TEMP/sealed/timings.enc.json" || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            {
              echo "native-ci package ${{ matrix.target }} ${SHA}"
              echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat "$RUNNER_TEMP/release-build.log" 2>/dev/null || true
              if [ -s "$RUNNER_TEMP/core-stderr.log" ]; then echo; echo "== core stderr (smoke básico)"; cat "$RUNNER_TEMP/core-stderr.log"; fi
            } > "$RUNNER_TEMP/sealed.log"
            node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
              "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
            rm -f "$RUNNER_TEMP/sealed.log"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-log-${{ matrix.target }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-package-${{ matrix.target }}
          path: ${{ runner.temp }}/metrics.env
          if-no-files-found: ignore
          retention-days: 1

  package-macos-x86_64:
    name: package ${{ matrix.target }}
    needs: [resolve, lint, tests-macos]
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: native-ci-pkg-${{ github.ref }}-x86_64-apple-darwin-${{ inputs.channel == 'stable' && needs.resolve.outputs.sha || 'beta' }}
      cancel-in-progress: ${{ inputs.channel != 'stable' && !inputs.warm_up }}
    permissions: *package-permissions
    strategy:
      matrix:
        include:
          - { os: macos-15, target: x86_64-apple-darwin, smoke: "false" }
    defaults: *bash
    env: *package-env
    steps: *package-steps

  package-linux:
    name: package ${{ matrix.target }}
    needs: resolve
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: native-ci-pkg-${{ github.ref }}-x86_64-unknown-linux-gnu-${{ inputs.channel == 'stable' && needs.resolve.outputs.sha || 'beta' }}
      cancel-in-progress: ${{ inputs.channel != 'stable' && !inputs.warm_up }}
    permissions: *package-permissions
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, smoke: "true" }
    defaults: *bash
    env: *package-env
    steps: *package-steps

  package-windows:
    name: package ${{ matrix.target }}
    needs: resolve
    if: *package-if
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: native-ci-pkg-${{ github.ref }}-x86_64-pc-windows-msvc-${{ inputs.channel == 'stable' && needs.resolve.outputs.sha || 'beta' }}
      cancel-in-progress: ${{ inputs.channel != 'stable' && !inputs.warm_up }}
    permissions: *package-permissions
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: "true" }
    defaults: *bash
    env: *package-env
    steps: *package-steps

  sign:
    # Holds the release key. Compiles only xtask (no third-party action, no shared cache) and packs
    # the update payloads from the binaries the package jobs built.
    name: sign the payloads and the feed
    needs: [resolve, package-macos-arm64, package-macos-x86_64, package-linux, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/clone-private.sh
            .github/scripts/ci-log-crypto.cjs
            .github/ci-log-key.pub.pem
          sparse-checkout-cone-mode: false
          path: _builder
          persist-credentials: false

      - name: Clone the private repository for the packaging tool
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
        run: |
          cp _builder/.github/scripts/clone-private.sh "$RUNNER_TEMP/clone-private.sh"
          cp _builder/.github/scripts/ci-log-crypto.cjs _builder/.github/ci-log-key.pub.pem "$RUNNER_TEMP/"
          rm -rf _builder
          CLONE_DEPTH=400 bash "$RUNNER_TEMP/clone-private.sh" src "${{ needs.resolve.outputs.sha }}"

      # Optimized: signing runs minisign's scrypt and the best gzip level once per payload, and the
      # unoptimized build spent 149 s there (run 41396863235) on the release's critical path.
      - name: Build the packaging tool
        working-directory: src
        run: |
          rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" > /dev/null 2>&1
          cargo build --quiet --locked --release -p xtask > "$RUNNER_TEMP/xtask-build.log" 2>&1 || { echo "::error::xtask did not build"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins

      - name: Sign the update payloads and the feed
        working-directory: src
        env:
          CADENTE_RELEASE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Y13: the output of the signing also goes to a file, sealed below when the job fails.
          exec > >(tee -a "$RUNNER_TEMP/sign.log") 2>&1
          mkdir -p dist
          PIDS=""
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            mkdir -p "target/$TARGET/release"
            cp ../bins/bin-$TARGET/* "target/$TARGET/release/"
            # Artifacts drop the executable bit, and the tar of the payload records it.
            chmod +x target/$TARGET/release/cadente-native-ui*
            ./target/release/xtask payload --target "$TARGET" > "$RUNNER_TEMP/payload-$TARGET.log" 2>&1 &
            PIDS="$PIDS $!"
          done
          FAIL=0
          for PID in $PIDS; do
            wait "$PID" || FAIL=1
          done
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            cat "$RUNNER_TEMP/payload-$TARGET.log" 2>/dev/null || true
          done
          [ "$FAIL" -eq 0 ]
          ./target/release/xtask feed "$RELEASE_CHANNEL" dist/descriptor-*.json

      - name: Release notes
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          # The notes are what a person using the app wants to know, and nothing else (read like Zed's
          # "Release Notes:" and Warp's CHANGELOG lines). A commit says it with a trailer
          # `Release-Note: Added|Improved|Fixed|Changed|Removed <what the person sees>.`; `N/A` says none.
          # The gate checks the wording (release_note_check.py); the subject, the codes and the tools of a
          # commit never reach the customer. Only commits since the last release (the "commit:" line of
          # its body) count.
          # A stable release says everything since the last stable one (the whole history for the first),
          # because the betas in between were never shown as a release of their own; a beta says what
          # changed since the last release of any kind.
          if [ "$CHANNEL" = stable ]; then
            PREV="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.prerelease == false) | .body | capture("(?m)^commit: (?<c>[0-9a-f]{40})$").c][0] // ""')"
            LIMIT=5000
          else
            PREV="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" --jq '[.[].body | capture("(?m)^commit: (?<c>[0-9a-f]{40})$").c][0] // ""')"
            LIMIT=200
          fi
          if [ -n "$PREV" ] && git -C src cat-file -e "${PREV}^{commit}" 2>/dev/null; then RANGE="${PREV}..${SHA}"; else RANGE="${SHA}"; fi
          git -C src log --no-merges --format='%x1e%s%x1f%(trailers:key=Release-Note,valueonly,separator=%x1d)' "$RANGE" -n "$LIMIT" > "$RUNNER_TEMP/commits.txt"
          python3 - "$RUNNER_TEMP/commits.txt" "${RELEASE_VERSION}" "${SHA}" "$CHANNEL" > src/dist/release-notes.md <<'PY'
          import re, sys
          path, version, sha, channel = sys.argv[1:5]
          cap = 500 if channel == "stable" else 40
          titles = {"Added": "What's new", "Improved": "Improvements", "Changed": "Improvements", "Removed": "Improvements", "Fixed": "Fixes"}
          notes = {"What's new": [], "Improvements": [], "Fixes": []}
          for record in open(path, encoding="utf-8").read().split("\x1e"):
              _, _, trailers = record.partition("\x1f")
              for line in trailers.split("\x1d"):
                  line = line.strip()
                  title = titles.get(line.split(" ", 1)[0])
                  if title and line not in notes[title]:
                      notes[title].append(line)
          print(f"Cadente {version}\n")
          for title, lines in notes.items():
              if lines:
                  print(f"### {title}\n")
                  print("\n".join(f"- {line}" for line in lines[:cap]) + "\n")
          if not any(notes.values()):
              print("Internal changes, nothing visible.\n")
          print(f"commit: {sha}\n\n---\n*Built via Secure Public Builder*")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: |
            src/dist/cadente-*.tar.gz
            src/dist/cadente-*.zip
            src/dist/*.minisig
            src/dist/feeds/
            src/dist/release-notes.md
          if-no-files-found: error
          retention-days: 1

      # Y13 (ADR 0091 T12): a red sign job seals the build of the tool and the signing output.
      - name: Seal the log of the signing
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          {
            echo "native-ci sign ${{ needs.resolve.outputs.sha }}"
            echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for F in "$RUNNER_TEMP/xtask-build.log" "$RUNNER_TEMP/sign.log"; do
              [ -s "$F" ] && { echo; echo "== $(basename "$F")"; cat "$F"; }
            done
          } > "$RUNNER_TEMP/sealed.log" 2>&1 || true
          node "$RUNNER_TEMP/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/ci-log-key.pub.pem" \
            "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/sealed/ci-log.enc.json"
          rm -f "$RUNNER_TEMP/sealed.log"

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: release-log-sign
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: ignore
          retention-days: 1

  publish:
    # Holds the release token and compiles nothing. It runs only when the three systems are green
    # (`report`), the packages passed the basic smoke and the payloads are signed. Only a run from main
    # publishes; on another branch this job lists what it would publish.
    name: publish
    # W10: the basic smoke ran in each package job, which `sign` needs; the long measurement does not hold it.
    needs: [resolve, report, sign]
    if: needs.report.outputs.green == 'true' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # One run per commit: this one may finish after a newer commit's. A beta never goes out behind a
      # newer one (the feed, the release list and the cask only move forward), and the run stays green.
      - name: Is a newer beta already out?
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest=true
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            out="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName')"
            if ! printf '%s\n' "$out" | bash .github/scripts/beta-is-newest.sh "$RELEASE_VERSION"; then
              newest=false
              echo "A beta as new as ${RELEASE_VERSION} is already out: this run publishes nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed

      - name: Checksums
        run: |
          set -euo pipefail
          mv signed/release-notes.md release-notes.md
          mv signed/feeds feeds
          mv signed/* dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: What a main run would publish
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Ensaio: um run de main publicaria v${RELEASE_VERSION} (${RELEASE_CHANNEL}) com:"
          ls -1 dist feeds

      - name: Create the release
        if: github.ref == 'refs/heads/main' && steps.order.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          if [ "$RELEASE_CHANNEL" = "stable" ]; then FLAGS="--latest"; else FLAGS="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cadente v${RELEASE_VERSION}" \
            --notes-file release-notes.md $FLAGS dist/*

      - name: Publish the feed on the site
        id: feed
        if: github.ref == 'refs/heads/main' && steps.order.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A feed that already offers this beta or a newer one stays: runs finish in any order.
          feed_is_newer() {
            [ "$RELEASE_CHANNEL" = "beta" ] && [ -f public/feeds/beta.json ] || return 1
            ! jq -r '.releases[].version' public/feeds/beta.json | bash ../.github/scripts/beta-is-newest.sh "$RELEASE_VERSION"
          }
          # The site branch moves while a run lasts (a push of this workflow, another feed): rebase first.
          for attempt in 1 2 3 4; do
            if feed_is_newer; then echo "The feed already offers a beta as new as ${RELEASE_VERSION}; it stays."; break; fi
            mkdir -p public/feeds
            cp ../feeds/* public/feeds/
            git add public/feeds
            git commit -m "chore: publish ${RELEASE_CHANNEL} feed for v${RELEASE_VERSION}" || { echo "No changes"; break; }
            git push && break
            git reset --hard HEAD~1
            git pull --rebase origin main
          done
          # While no stable is out, the newest beta is what the site and Homebrew offer.
          STABLE_RELEASES="$(jq '.releases | length' public/feeds/stable.json 2>/dev/null || echo 0)"
          echo "stable_empty=$([ "$STABLE_RELEASES" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        if: github.ref == 'refs/heads/main' && steps.order.outputs.newest == 'true' && (needs.resolve.outputs.channel == 'stable' || steps.feed.outputs.stable_empty == 'true')
        env:
          GH_TOKEN: ${{ secrets.CATARINA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/cadente-hub/homebrew-apps.git" homebrew-repo
          cd homebrew-repo
          # The cask moves only forward too: a beta as old as the one it names stays out.
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            CURRENT="$(sed -n 's/^ *version "\(.*\)"/\1/p' Casks/cadente.rb | head -1)"
            if ! printf '%s\n' "$CURRENT" | bash ../.github/scripts/beta-is-newest.sh "$RELEASE_VERSION"; then
              echo "The cask already names ${CURRENT}; it stays."; exit 0
            fi
          fi
          ARM64_SHA=$(sha256sum ../dist/cadente-${RELEASE_VERSION}-macos-arm64.dmg | awk '{print $1}')
          X64_SHA=$(sha256sum ../dist/cadente-${RELEASE_VERSION}-macos-x64.dmg | awk '{print $1}')
          cat > Casks/cadente.rb <<RUBY
          cask "cadente" do
            version "${RELEASE_VERSION}"

            if Hardware::CPU.arm?
              url "https://github.com/cadente-hub/cadente-hub.github.io/releases/download/v#{version}/cadente-#{version}-macos-arm64.dmg"
              sha256 "${ARM64_SHA}"
            else
              url "https://github.com/cadente-hub/cadente-hub.github.io/releases/download/v#{version}/cadente-#{version}-macos-x64.dmg"
              sha256 "${X64_SHA}"
            end

            name "Cadente"
            desc "AI-powered desktop assistant — chat, terminal, Git and more"
            homepage "https://cadente-hub.github.io"

            auto_updates true
            depends_on macos: ">= :big_sur"

            app "Cadente.app"

            # Unsigned app: drop the quarantine flag and sign ad-hoc so it opens without the "is damaged" error.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Cadente.app"],
                             sudo: true
              system_command "/usr/bin/codesign",
                             args: ["--force", "--deep", "--sign", "-", "#{appdir}/Cadente.app"],
                             sudo: true
            end

            zap trash: [
              "~/Library/Application Support/com.cadente.app",
              "~/Library/Caches/com.cadente.app",
              "~/Library/Preferences/com.cadente.app.plist",
              "~/Library/Saved Application State/com.cadente.app.savedState",
            ]
          end
          RUBY
          sed -i 's/^          //' Casks/cadente.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cadente.rb
          git diff --cached --quiet && { echo "No cask changes"; exit 0; }
          git commit -m "chore: bump cadente to v${RELEASE_VERSION}"
          git push

      - name: Dispatch native-perf
        if: github.ref == 'refs/heads/main' && steps.order.outputs.newest == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          DEDICATED="$( [ "$CHANNEL" = "stable" ] && echo true || echo false )"
          gh workflow run native-perf.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f sha="$SHA" -f version="$VERSION" -f tag="$TAG" -f channel="$CHANNEL" -f dedicated="$DEDICATED"

  # W1 (ADR 0082): compiles nothing. Stores the package logs and timings in the private ci-logs branch,
  # writes the run summary (duration, preparation, cache, compile and test time of each job) and keeps
  # one line per main run there, from which it takes the p50 and p90 of the last 20 runs.
  summary:
    name: summary
    needs: [resolve, lint, build-tests-macos, build-tests-linux, build-tests-windows, tests-macos, tests-linux, tests-windows, report, bridge-extension, package-macos-arm64, package-macos-x86_64, package-linux, package-windows, sign, publish]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.lint_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-log-crypto.cjs
            .github/scripts/persist-private-log.sh
            .github/scripts/ci-summary.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The metrics are optional: a slow artifact service (180 s in run 41472042526) must not hold the run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          pattern: release-log-*
          path: ${{ runner.temp }}/sealed

      - uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          pattern: metrics-*
          path: ${{ runner.temp }}/metrics

      # Y12: the seconds each ruler face took on each system (written only by a ruler that passed).
      - uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          pattern: ruler-times-*
          path: ${{ runner.temp }}/ruler-times

      - name: Store the package logs and timings in the private repository
        env:
          CI_LOG_PRIVATE_KEY: ${{ secrets.CI_LOG_PRIVATE_KEY }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/persist-private-log.sh
          shopt -s nullglob
          OUT="$RUNNER_TEMP/plain"
          mkdir -p "$OUT"
          for DIR in "$RUNNER_TEMP"/sealed/release-log-*; do
            TARGET="$(basename "$DIR")"
            TARGET="${TARGET#release-log-}"
            [ -f "$DIR/ci-log.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/ci-log.enc.json" "$OUT/release-$TARGET.log" || true
            [ -f "$DIR/timings.enc.json" ] && node .github/scripts/ci-log-crypto.cjs decrypt "$DIR/timings.enc.json" "$OUT/timings-release-$TARGET.html" || true
          done
          for LOG in "$OUT"/*.log; do echo "log completo de $(basename "$LOG" .log): ci-logs/public-actions/${GITHUB_RUN_ID}/$(basename "$LOG")"; done
          persist_private_files "$OUT" "public-actions/${GITHUB_RUN_ID}" "native-ci package logs and timings"
          rm -rf "$OUT"

      - name: Run summary
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          COMPILED: ${{ needs.resolve.outputs.docs_only != 'true' }}
          TOOLCHAIN_CHANGED: ${{ needs.resolve.outputs.toolchain_changed }}
          # A warm-up run measures nothing a commit would see.
          RECORD_HISTORY: ${{ github.ref == 'refs/heads/main' && !inputs.warm_up }}
          METRICS_DIR: ${{ runner.temp }}/metrics
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_LOG_TOKEN}"
          HISTORY_DIR="$RUNNER_TEMP/history"
          # Only metrics/: the branch also keeps every sealed log and timings report.
          { git clone --depth=1 --filter=blob:none --sparse --branch ci-logs "https://x-access-token:${PRIVATE_LOG_TOKEN}@github.com/${PRIVATE_REPO}.git" "$HISTORY_DIR" \
            && git -C "$HISTORY_DIR" sparse-checkout set metrics; } >/dev/null 2>&1 || HISTORY_DIR=""
          export HISTORY_DIR
          # Y13: bounded memory (1 GiB of address space) so a huge log cannot take the runner down.
          ( ulimit -v 1048576; bash .github/scripts/ci-summary.sh > "$RUNNER_TEMP/summary.md" )
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/summary.md"
          if [ "$RECORD_HISTORY" = "true" ] && [ -n "$HISTORY_DIR" ]; then
            git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
            git -C "$HISTORY_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5; do
              # Y12 (ADR 0091): the slowest system's seconds per face of a ruler that passed, for
              # `.config/ruler-times.json`, which the plan of the shards reads (`shard_plan.rs`).
              mkdir -p "$HISTORY_DIR/metrics"
              python3 -I - "$RUNNER_TEMP/ruler-times" "$HISTORY_DIR/metrics/ruler-times.json" <<'PY' || true
          import glob, json, sys
          worst = {}
          files = glob.glob(sys.argv[1] + "/*/ruler-times.json")
          for path in files:
              try:
                  for face, secs in json.load(open(path)).items():
                      worst[face] = max(worst.get(face, 0.0), float(secs))
              except (ValueError, OSError):
                  pass
          if len(files) == 3 and worst:
              json.dump(dict(sorted(worst.items())), open(sys.argv[2], "w"), indent=1)
              open(sys.argv[2], "a").write("\n")
          PY
              git -C "$HISTORY_DIR" add metrics/runs.tsv
              [ ! -f "$HISTORY_DIR/metrics/ruler-times.json" ] || git -C "$HISTORY_DIR" add metrics/ruler-times.json
              git -C "$HISTORY_DIR" commit -m "ci: record native-ci run ${GITHUB_RUN_ID}" >/dev/null 2>&1 || break
              git -C "$HISTORY_DIR" push origin ci-logs >/dev/null 2>&1 && break
              LINE="$(tail -1 "$HISTORY_DIR/metrics/runs.tsv")"
              git -C "$HISTORY_DIR" fetch --depth=1 origin ci-logs >/dev/null 2>&1 || true
              git -C "$HISTORY_DIR" reset --hard origin/ci-logs >/dev/null 2>&1 || true
              mkdir -p "$HISTORY_DIR/metrics"
              printf '%s\n' "$LINE" >> "$HISTORY_DIR/metrics/runs.tsv"
              sleep "$attempt"
            done
          fi
