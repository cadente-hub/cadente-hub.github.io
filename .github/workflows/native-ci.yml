name: native-ci
run-name: native-ci ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Private repo commit SHA (40 hex)"
        required: true
        type: string
  schedule:
    - cron: '0 * * * *'

# Queue instead of cancelling: each run tests the private main's HEAD, and cancelling a run that is
# almost green would hold the unstable release back for every new commit. A run from another branch
# (a test of this workflow) queues apart from main's.
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: false

# The check jobs compile hundreds of third-party crates, and a build script can read every secret its
# job references. So they hold only the read-only deploy key and print no compiler or test output: the
# full log leaves them encrypted. `resolve` and `report` compile nothing; only they write to the
# private repository.
permissions:
  contents: read

env:
  PRIVATE_REPO: jeancatarina/catarina-claude

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve_sha.outputs.sha }}
      skip: ${{ steps.resolve_sha.outputs.skip }}
    steps:
      - name: Resolve and validate SHA
        id: resolve_sha
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$INPUT_SHA"
          else
            # schedule trigger: resolve HEAD of private main
            SHA=$(git ls-remote "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" refs/heads/main | awk '{print $1}')
            if [ -z "$SHA" ]; then
              echo "::error::Could not resolve main HEAD for ${PRIVATE_REPO}"
              exit 1
            fi
            # Check if there is already a successful run for this SHA
            PREV_SUCCESS=$(gh run list -R "$GITHUB_REPOSITORY" -w native-ci.yml --status success --json name --jq '.[].name' 2>/dev/null | grep -F "native-ci $SHA" || true)
            if [ -n "$PREV_SUCCESS" ]; then
              echo "SHA $SHA has already succeeded in native-ci. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid SHA format (must be 40 hex digits): $SHA"
            exit 1
          fi

          # Clone private repo and verify SHA is ancestor of main
          TMP_DIR="$(mktemp -d)"
          git clone --filter=blob:none "https://x-access-token:${PRIVATE_TOKEN}@github.com/${PRIVATE_REPO}.git" "$TMP_DIR" >/dev/null 2>&1
          cd "$TMP_DIR"
          git checkout "$SHA" >/dev/null 2>&1
          git fetch origin main >/dev/null 2>&1
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::SHA $SHA is not an ancestor of main."
            rm -rf "$TMP_DIR"
            exit 1
          fi
          rm -rf "$TMP_DIR"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Publish pending statuses
        if: steps.resolve_sha.outputs.skip == 'false'
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
        run: |
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          for OS in macos-15 ubuntu-latest windows-latest; do
            curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
              -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"state\":\"pending\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"native-ci on ${OS} running\",\"context\":\"native-ci/${OS}\"}" >/dev/null 2>&1 || true
          done

  check:
    name: ${{ matrix.os }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    # Without a limit a hung step holds the run, and the queue behind it, for six hours.
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MATRIX_OS: ${{ matrix.os }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/clone-private.sh
            .github/scripts/ci-log-crypto.cjs
            .github/ci-log-key.pub.pem
          sparse-checkout-cone-mode: false
          path: _builder
          persist-credentials: false

      - name: Stage builder scripts and clean checkout
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          cp _builder/.github/scripts/clone-private.sh _builder/.github/scripts/ci-log-crypto.cjs _builder/.github/ci-log-key.pub.pem "$RUNNER_TEMP/scripts/"
          rm -rf _builder

      - name: Clone private repository
        env:
          DEPLOY_KEY: ${{ secrets.CATARINA_PRIVATE_DEPLOY_KEY }}
        run: bash "$RUNNER_TEMP/scripts/clone-private.sh" . "$SHA"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        # apt hung once for over an hour on a mirror; retry the download and give up in time.
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libfontconfig1-dev libxkbcommon-dev libssl-dev pkg-config libdbus-1-dev

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Initialize log file
        run: |
          touch "$RUNNER_TEMP/ci-build.log"

      # Compiler and test output names files, lines, tests and screens of the private source: it goes
      # only to ci-build.log. The public log says which step failed and nothing more.
      - name: Check formatting (cargo fmt)
        run: |
          echo "Passo: cargo fmt --all --check"
          if cargo fmt --all --check >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo fmt" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Workspace check (cargo check)
        run: |
          echo "Passo: cargo check --workspace --all-targets"
          if RUSTFLAGS="-D warnings" cargo check --workspace --all-targets --message-format short >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo check" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Clippy (cargo clippy)
        run: |
          echo "Passo: cargo clippy --workspace --all-targets -- -D warnings"
          if cargo clippy --workspace --all-targets --message-format short -- -D warnings >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "clippy" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Prove invariants and retry gates reject regressions
        run: |
          set -euo pipefail
          echo "invariants" > "$RUNNER_TEMP/failed_step"
          PROBE="$PWD/.ci-gate-probe"
          trap 'rm -rf "$PROBE"' EXIT
          mkdir -p "$PROBE/src"
          printf '[package]\nname = "cadente-core"\nversion = "0.0.0"\nedition = "2021"\nautotests = false\n[[bin]]\nname = "gate-probe"\npath = "src/main.rs"\ntest = false\n[[test]]\nname = "it"\npath = "src/main.rs"\n[workspace]\n' > "$PROBE/Cargo.toml"
          printf 'fn main() { let _ = std::process::Command::new("forbidden"); }\n' > "$PROBE/src/main.rs"
          if cargo clippy --manifest-path "$PROBE/Cargo.toml" -- -A clippy::all -D clippy::disallowed_methods > "$RUNNER_TEMP/lint-probe.log" 2>&1; then
            echo '::error::The invariant gate accepted a forbidden process call'
            exit 1
          fi
          grep -q 'disallowed method' "$RUNNER_TEMP/lint-probe.log"
          cat > "$PROBE/src/main.rs" <<'RS'
          fn main() {}
          #[test]
          fn fails_only_on_first_attempt() {
              let path = std::env::var("GATE_ATTEMPTS").unwrap();
              let count = std::fs::read_to_string(&path).unwrap_or_default().parse::<u32>().unwrap_or(0) + 1;
              std::fs::write(path, count.to_string()).unwrap();
              assert!(count > 1, "first attempt fails; retry would hide it");
          }
          RS
          for PROFILE in default ci; do
            export GATE_ATTEMPTS="attempts-$PROFILE"
            if cargo nextest run --manifest-path "$PROBE/Cargo.toml" --config-file "$PWD/.config/nextest.toml" --profile "$PROFILE" > "$RUNNER_TEMP/retry-probe-$PROFILE.log" 2>&1; then
              echo "::error::The $PROFILE profile hid a failing test"
              exit 1
            fi
            if [ ! -f "$PROBE/$GATE_ATTEMPTS" ]; then
              cat "$RUNNER_TEMP/retry-probe-$PROFILE.log" >> "$RUNNER_TEMP/ci-build.log"
              echo "::error::The $PROFILE profile did not run the probe test"
              exit 1
            fi
            test "$(cat "$PROBE/$GATE_ATTEMPTS")" = 1
          done
          rm -f "$RUNNER_TEMP/failed_step"

      - name: Run tests (cargo nextest)
        run: |
          echo "Passo: cargo nextest run --workspace --profile ci"
          NEXTEST_RAW="$RUNNER_TEMP/nextest_raw.log"
          set +e
          cargo nextest run --workspace --profile ci > "$NEXTEST_RAW" 2>&1
          NEXTEST_EXIT=$?
          set -e
          cat "$NEXTEST_RAW" >> "$RUNNER_TEMP/ci-build.log"
          # Only the counts are public; the names of the tests that failed are in the private log.
          sed 's/\x1b\[[0-9;]*m//g' "$NEXTEST_RAW" | grep -E '^ *Summary \[' | sed -E 's/^ *//' | tail -1 || true

          if [ $NEXTEST_EXIT -eq 0 ]; then
            echo "Resultado: OK"
          else
            for dir in "${TMPDIR:-}" "${TMP:-}" "${TEMP:-}" /tmp; do
              if [ -n "$dir" ] && [ -f "$dir/parity-tails.log" ]; then
                { echo; echo "--- Telas da régua ($dir/parity-tails.log)"; cat "$dir/parity-tails.log"; } >> "$RUNNER_TEMP/ci-build.log"
                break
              fi
            done
            echo "Resultado: FALHOU"
            echo "cargo nextest" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      - name: Documentation tests (cargo test --doc)
        run: |
          echo "Passo: cargo test --workspace --doc"
          if cargo test --workspace --doc >> "$RUNNER_TEMP/ci-build.log" 2>&1; then
            echo "Resultado: OK"
          else
            echo "Resultado: FALHOU"
            echo "cargo test --doc" > "$RUNNER_TEMP/failed_step"
            exit 1
          fi

      # Runs on a timeout or cancellation too: the log of a hung step is the one most needed.
      - name: Seal the build log
        if: failure() || cancelled()
        run: |
          FAILED_STEP="passo desconhecido"
          [ -f "$RUNNER_TEMP/failed_step" ] && FAILED_STEP="$(cat "$RUNNER_TEMP/failed_step")"
          {
            echo "native-ci ${MATRIX_OS} ${SHA}: falhou em ${FAILED_STEP}"
            echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$RUNNER_TEMP/ci-build.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/sealed.log"
          node "$RUNNER_TEMP/scripts/ci-log-crypto.cjs" encrypt "$RUNNER_TEMP/scripts/ci-log-key.pub.pem" \
            "$RUNNER_TEMP/sealed.log" "$RUNNER_TEMP/ci-log.enc.json"
          rm -f "$RUNNER_TEMP/sealed.log"
          echo "Falhou em ${FAILED_STEP}; o log completo vai para o ci-logs do repositório privado."

      - name: Upload the sealed log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-log.enc.json
          if-no-files-found: ignore
          retention-days: 1

  # Compiles nothing: decrypts the sealed logs into the private ci-logs branch, records the commit
  # statuses and decides the Supabase deploy.
  report:
    name: report
    needs: [resolve, check]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Setup builder scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-log-crypto.cjs
            .github/scripts/persist-private-log.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the sealed logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-log-*
          path: ${{ runner.temp }}/sealed

      - name: Store the logs in the private repository
        env:
          CI_LOG_PRIVATE_KEY: ${{ secrets.CI_LOG_PRIVATE_KEY }}
          PRIVATE_LOG_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/persist-private-log.sh
          shopt -s nullglob
          for ENVELOPE in "$RUNNER_TEMP"/sealed/ci-log-*/ci-log.enc.json; do
            OS="$(basename "$(dirname "$ENVELOPE")")"
            OS="${OS#ci-log-}"
            if node .github/scripts/ci-log-crypto.cjs decrypt "$ENVELOPE" "$RUNNER_TEMP/$OS.log"; then
              persist_private_build_log "$RUNNER_TEMP/$OS.log" "$OS" "$OS"
            fi
            rm -f "$RUNNER_TEMP/$OS.log"
          done

      - name: Record the commit statuses
        id: statuses
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_WRITE_TOKEN}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name == "macos-15" or .name == "ubuntu-latest" or .name == "windows-latest")
                  | [.name, (.conclusion // "cancelled"), ([.steps[] | select(.conclusion == "failure") | .name][0] // "")] | @tsv' \
            > "$RUNNER_TEMP/jobs.tsv"
          while IFS=$'\t' read -r OS CONCLUSION STEP; do
            if [ "$CONCLUSION" = "success" ]; then
              STATE=success; DESCRIPTION="native-ci passed"
            else
              STATE=failure; DESCRIPTION="Failed at ${STEP:-$CONCLUSION}"
            fi
            [ "$OS" = "ubuntu-latest" ] && echo "ubuntu=$CONCLUSION" >> "$GITHUB_OUTPUT"
            BODY="$(jq -cn --arg state "$STATE" --arg description "${DESCRIPTION:0:140}" --arg context "native-ci/$OS" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, target_url: $url, description: $description, context: $context}')"
            curl -sf -X POST "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
              -H "Authorization: Bearer ${PRIVATE_WRITE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$BODY" >/dev/null 2>&1 || echo "::warning::Could not record the status of $OS"
            echo "$OS: $STATE"
          done < "$RUNNER_TEMP/jobs.tsv"

      - name: Trigger Supabase deploy
        if: steps.statuses.outputs.ubuntu == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          api() { curl -sf -H "Authorization: Bearer ${PRIVATE_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${PRIVATE_REPO}/$1"; }
          echo "Verificando se houve alterações em supabase/ desde o último deploy..."
          LAST_DEPLOYED_SHA="$(api "contents/supabase-deployed?ref=ci-logs" 2>/dev/null | jq -r '.content // empty' | base64 -d 2>/dev/null | tr -d ' \n\r' || true)"
          SHOULD_DEPLOY="false"
          if [ -z "$LAST_DEPLOYED_SHA" ]; then
            api "contents/supabase?ref=${SHA}" >/dev/null 2>&1 && SHOULD_DEPLOY="true"
          elif COMPARE="$(api "compare/${LAST_DEPLOYED_SHA}...${SHA}" 2>/dev/null)"; then
            # The compare API lists at most 300 files; a longer diff counts as a change.
            if printf '%s' "$COMPARE" | jq -e '(.files | length) >= 300 or any(.files[]; .filename | startswith("supabase/"))' >/dev/null; then
              SHOULD_DEPLOY="true"
            fi
          else
            SHOULD_DEPLOY="true"
          fi

          if [ "$SHOULD_DEPLOY" = "true" ]; then
            echo "Alterações detectadas em supabase/; disparando supabase-deploy.yml..."
            gh workflow run supabase-deploy.yml -R "$GITHUB_REPOSITORY" -f sha="$SHA" || echo "::warning::Não foi possível disparar supabase-deploy.yml"
          else
            echo "Nenhuma alteração em supabase/ desde $LAST_DEPLOYED_SHA."
          fi

  unstable:
    # Every commit of main that passes on the three systems becomes an unstable (beta) release;
    # promoting it to stable stays a manual native-promote run. A run from another branch never releases.
    name: unstable release
    needs: [resolve, check]
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.skip != 'true' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Dispatch native-release (beta)
        run: |
          set -euo pipefail
          if gh run list -R "$GITHUB_REPOSITORY" -w native-release.yml --json displayTitle --jq '.[].displayTitle' | grep -qxF "native-release beta $SHA"; then
            echo "$SHA already has an unstable release run; nothing to do."
            exit 0
          fi
          gh workflow run native-release.yml -R "$GITHUB_REPOSITORY" -f sha="$SHA" -f channel=beta
          echo "native-release beta dispatched for $SHA"
