          CERTIFICATE
          openssl cms -encrypt -binary -aes-256-cbc -in /tmp/stable-build.log -out stable-build.log.enc -outform DER /tmp/stable-debug.crt
          sealed=$?
          rm -f /tmp/stable-build.log /tmp/stable-install.log /tmp/stable-debug.crt
          rm -rf source/.git source/dist
          test "$sealed" -eq 0 || exit "$sealed"
          echo "Build exit code: $result. Diagnostics encrypted for the local reviewer."
          exit "$result"
      - name: Upload sealed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-windows-sealed-diagnostics
          path: stable-build.log.enc
          if-no-files-found: error
          retention-days: 1
