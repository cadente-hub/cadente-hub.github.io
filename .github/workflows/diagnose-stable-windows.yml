name: Diagnose Stable Windows Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Fetch stable source
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.CATARINA_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_TOKEN}"
          git clone --depth=1 "https://x-access-token:${PRIVATE_TOKEN}@github.com/jeancatarina/catarina-claude.git" source >/dev/null 2>&1
          git -C source fetch --depth=1 origin refs/tags/v0.2.93 >/dev/null 2>&1
          git -C source checkout --detach FETCH_HEAD >/dev/null 2>&1
          test "$(git -C source rev-parse HEAD)" = "d0bbbf48a2879f27101c27c6d10a099333ec60f1"
          git -C source remote set-url origin https://REDACTED@github.com/redacted/redacted.git
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri
          shared-key: cadente
          cache-on-failure: true
      - name: Install frontend dependencies
        shell: bash
        working-directory: source
        run: npm ci >/tmp/stable-install.log 2>&1
      - name: Build and seal diagnostics
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set +e
          cd source
          npx tauri build >/tmp/stable-build.log 2>&1
          result=$?
          cd ..
          cat > /tmp/stable-debug.crt <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIENzCCAp+gAwIBAgIUfS1AJldvvh0UxL9h/rJrTDaoehUwDQYJKoZIhvcNAQEL
          BQAwKzEpMCcGA1UEAwwgQ2FkZW50ZSBzdGFibGUgYnVpbGQgZGlhZ25vc3RpY3Mw
          HhcNMjYxMDA3MTAxMzQ5WhcNMjYxMDA4MTAxMzQ5WjArMSkwJwYDVQQDDCBDYWRl
          bnRlIHN0YWJsZSBidWlsZCBkaWFnbm9zdGljczCCAaIwDQYJKoZIhvcNAQEBBQAD
          ggGPADCCAYoCggGBAI0Fob6l2SaFfmWR8uB9yX4fMVJGd2UmCazbyEPpiSwicE/z
