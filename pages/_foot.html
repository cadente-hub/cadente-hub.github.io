  <footer class="foot">
    <div class="wrap foot__inner">
      <div class="foot__brand">
        <a href="{{@base}}" class="brand">{{@brand}}<span>Cadente</span></a>
        <p>{{foot.tagline}}</p>
      </div>
      <nav class="foot__cols" aria-label="{{foot.label|attr}}">
        <div><h4>{{foot.product}}</h4><a href="{{@base}}#abrir">{{nav.how}}</a><a href="{{@base}}#plugins">{{nav.plugins}}</a><a href="{{@base}}#loja">{{nav.store}}</a><a href="{{@base}}#creator">Creator mode</a><a href="{{@href:downloads}}">Downloads</a></div>
        <div><h4>{{foot.resources}}</h4><a href="{{@href:blog}}">{{nav.blog}}</a><a href="{{@href:release-notes}}">Release notes</a><a href="https://github.com/cadente-hub/cadente-hub.github.io" target="_blank" rel="noopener noreferrer">GitHub</a><a href="https://github.com/cadente-hub/cadente-hub.github.io/issues" target="_blank" rel="noopener noreferrer">Issues</a></div>
        <div><h4>{{foot.legal}}</h4><a href="{{@href:terms}}">{{foot.terms}}</a></div>
        <div class="foot__langs"><h4>{{foot.langs}}</h4>{{@langlinks}}</div>
      </nav>
      <p class="foot__copy">{{foot.copy}}</p>
    </div>
  </footer>
